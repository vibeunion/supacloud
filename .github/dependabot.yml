version: 2
updates:
  # Review TypeScript upgrades manually so prerelease dev builds cannot replace
  # the compiler versions pinned for each workspace.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/management-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/edge-runtime"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/web-console"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/admin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/supacloud"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/function-adapter"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "bun"
    directory: "/packages/supacloud-js"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  # The Lite package ships its own bun.lock; the npm_and_yarn ecosystem cannot
  # update it and Dependabot aborts the whole job with a misconfiguration error.
  - package-ecosystem: "bun"
    directory: "/packages/supacloud-lite"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/docker/self-host"
      - "/docker/self-host/postgres"
      - "/packages/edge-runtime"
      - "/packages/management-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker-compose"
    directories:
      - "/docker/dev"
      - "/docker/self-host"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
