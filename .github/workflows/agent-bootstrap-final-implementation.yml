name: Bootstrap final endpoint implementation

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-bootstrap-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/project-endpoints-legacy-backup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-endpoints-legacy-backup
          fetch-depth: 0

      - name: Apply or normalize implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path.cwd()
          endpoint_file = root / "packages/cli/src/shared/tools/project-endpoint-projection.ts"
          legacy_file = root / "packages/admin/src/shared/tools/legacy-backup-tools.ts"
          original_workflow = root / ".github/workflows/agent-project-endpoints-legacy-backup.yml"
          admin_policy = root / "packages/admin/src/shared/execution-policy.ts"
          admin_policy_backup = root / "packages/admin/src/shared/execution-policy.ts.agent-backup"

          # If the first generator did not commit, replay its exact embedded
          # Python against current main. Admin commonly re-exports the shared
          # policy; temporarily hiding that forwarding file lets the generator
          # patch the canonical CLI policy exactly once.
          if not endpoint_file.exists() or not legacy_file.exists():
              if not original_workflow.exists():
                  raise SystemExit("implementation files and original generator are both missing")
              workflow_text = original_workflow.read_text()
              start_marker = "          python3 <<'PY'\n"
              end_marker = "\n          PY\n\n      - name: Check generated diff"
              if start_marker not in workflow_text or end_marker not in workflow_text:
                  raise SystemExit("cannot locate original generator script")
              script = workflow_text.split(start_marker, 1)[1].split(end_marker, 1)[0]
              script = "\n".join(line[10:] if line.startswith("          ") else line for line in script.splitlines())

              if admin_policy.exists():
                  admin_policy.rename(admin_policy_backup)
              try:
                  namespace = {"__name__": "__main__"}
                  exec(compile(script, str(original_workflow), "exec"), namespace, namespace)
              finally:
                  if admin_policy_backup.exists():
                      admin_policy_backup.rename(admin_policy)

          if not endpoint_file.exists() or not legacy_file.exists():
              raise SystemExit("generator did not create required implementation files")

          # Patch a non-forwarding Admin policy only when it owns an independent
          # ACTION_POLICY. Re-exporting files intentionally inherit the CLI policy.
          if admin_policy.exists():
              policy_text = admin_policy.read_text()
              if "const ACTION_POLICY" in policy_text:
                  old = '        read: ["get", "health", "logs", "api_keys", "settings", "tasks", "task_detail", "task_stats", "dlq", "background_settings"],'
                  new = '        read: ["list", "list_endpoints", "get", "endpoints", "health", "logs", "api_keys", "settings", "tasks", "task_detail", "task_stats", "dlq", "background_settings"],'
                  if old in policy_text:
                      policy_text = policy_text.replace(old, new, 1)
                  if "    legacy_backup: {" not in policy_text:
                      marker = "    database: {"
                      if marker not in policy_text:
                          raise SystemExit("Admin policy database marker missing")
                      policy_text = policy_text.replace(marker, '    legacy_backup: {\n        read: ["inspect", "plan"],\n        write: [],\n    },\n' + marker, 1)
                  admin_policy.write_text(policy_text)

          user_block = '''                case "endpoints":
                    return projectReadResponse(projectEndpointsRead(
                        await http.get(`/v1/projects/${resolvedRef}`, {
                            maxResponseBytes: PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,
                        }),
                        resolvedRef,
                    ));
'''
          admin_block = '''                case "endpoints": {
                    const resolvedRef = resolveRef(ref);
                    return projectReadResponse(projectEndpointsRead(
                        await http.get(`/v1/projects/${resolvedRef}`, {
                            maxResponseBytes: PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,
                        }),
                        resolvedRef,
                    ));
                }
'''

          for project_tools in [
              root / "packages/cli/src/shared/tools/project-cli-tools.ts",
              root / "packages/admin/src/shared/tools/project-cli-tools.ts",
          ]:
              text = project_tools.read_text()
              marker = "export function registerAdminProjectCliTools"
              if marker not in text:
                  raise SystemExit(f"{project_tools}: admin tool marker missing")
              before_admin, admin = text.split(marker, 1)
              has_user_tool = "export function registerUserProjectCliTools" in before_admin
              admin = admin.replace(user_block, "")
              if has_user_tool and before_admin.count(user_block) != 1:
                  raise SystemExit(f"{project_tools}: project-scoped endpoint block is not unique")
              if not has_user_tool and before_admin.count(user_block) != 0:
                  raise SystemExit(f"{project_tools}: unexpected project-scoped endpoint block")
              text = before_admin + marker + admin
              if text.count(admin_block) != 1:
                  raise SystemExit(f"{project_tools}: admin endpoint block is not unique")
              project_tools.write_text(text)

          for workflow in (root / ".github/workflows").glob("agent-*-endpoint*.yml"):
              workflow.unlink()
          for exact in [
              root / ".github/workflows/agent-project-endpoints-legacy-backup.yml",
              root / ".github/workflows/agent-bootstrap-final-implementation.yml",
          ]:
              if exact.exists():
                  exact.unlink()
          PY
          git diff --check

      - name: Commit final implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Implementation already normalized."
          else
            git commit -m "feat(cli): implement safe endpoint and legacy backup projections"
            git push origin HEAD:feat/project-endpoints-legacy-backup
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate CLI and Admin packages
        shell: bash
        run: |
          set -euo pipefail
          (cd packages/cli && bun install --frozen-lockfile && bun run typecheck && bun test src/shared/tools/project-endpoint-projection.test.ts)
          (cd packages/admin && bun install --frozen-lockfile && bun run typecheck && bun test src/shared/tools/legacy-backup-tools.test.ts)
