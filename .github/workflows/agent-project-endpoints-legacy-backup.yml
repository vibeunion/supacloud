name: Apply project endpoint projection and legacy backup tools

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agent-project-endpoints-legacy-backup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/project-endpoints-legacy-backup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-endpoints-legacy-backup
          fetch-depth: 0

      - name: Apply narrowly-scoped implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              file = ROOT / path
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_if_present(path: str, old: str, new: str, *, maximum: int | None = None) -> int:
              file = ROOT / path
              text = file.read_text()
              count = text.count(old)
              if maximum is not None and count > maximum:
                  raise SystemExit(f"{path}: found {count} occurrences, maximum is {maximum}: {old[:120]!r}")
              if count:
                  file.write_text(text.replace(old, new))
              return count

          def append_once(path: str, marker: str, content: str) -> None:
              file = ROOT / path
              text = file.read_text()
              if marker not in text:
                  file.write_text(text.rstrip() + "\n\n" + content.strip() + "\n")

          endpoint_projection = r'''import type { HttpResult } from "../transports/http";
          import type { ProjectReadResult } from "./project-read-projection";

          export const PROJECT_ENDPOINT_RESPONSE_MAX_BYTES = 1_048_576;
          export const PROJECT_ENDPOINT_LIST_DEFAULT_LIMIT = 100;
          export const PROJECT_ENDPOINT_LIST_MAX_LIMIT = 500;

          const PROJECT_REF_PATTERN = /^[a-z0-9-]{1,20}$/;
          const DNS_LABEL_PATTERN = /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$/;
          const ENDPOINT_KINDS = ["api", "auth", "studio"] as const;

          type EndpointKind = typeof ENDPOINT_KINDS[number];
          type EndpointSource = "project" | "config";

          export interface ProjectEndpointProjection {
              schema: "supacloud.project-endpoints.v1";
              project_ref: string;
              endpoints: Partial<Record<EndpointKind, {
                  origin: string;
                  hostname: string;
                  source: EndpointSource;
              }>>;
          }

          export type ProjectRefSelection =
              | { ok: true; refs: string[]; total: number; truncated: boolean }
              | { ok: false; result: ProjectReadResult };

          function plainRecord(candidate: unknown): Record<string, unknown> | null {
              if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return null;
              const prototype = Object.getPrototypeOf(candidate);
              return prototype === Object.prototype || prototype === null
                  ? candidate as Record<string, unknown>
                  : null;
          }

          function payloadWithinLimit(candidate: unknown): boolean {
              try {
                  const serialized = JSON.stringify(candidate);
                  return serialized !== undefined
                      && new TextEncoder().encode(serialized).byteLength <= PROJECT_ENDPOINT_RESPONSE_MAX_BYTES;
              } catch {
                  return false;
              }
          }

          function validHttpStatus(status: number): boolean {
              return Number.isSafeInteger(status) && status >= 100 && status <= 599;
          }

          function successfulResponse(response: HttpResult<unknown>): boolean {
              return response.ok === true
                  && validHttpStatus(response.status)
                  && response.status >= 200
                  && response.status <= 299;
          }

          function failedResult(message: string): ProjectReadResult {
              return { text: `❌ ${message}`, isError: true };
          }

          function canonicalHostname(candidate: string): boolean {
              if (candidate === "localhost") return true;
              if (candidate.startsWith("[") && candidate.endsWith("]")) return true;
              const ipv4 = candidate.split(".");
              if (ipv4.length === 4 && ipv4.every(part => /^\d{1,3}$/u.test(part))) {
                  return ipv4.every(part => Number(part) <= 255);
              }
              return candidate.split(".").every(label => DNS_LABEL_PATTERN.test(label));
          }

          function canonicalOrigin(candidate: unknown): string | null {
              if (typeof candidate !== "string" || !candidate || candidate.length > 2_048
                  || candidate.trim() !== candidate || candidate.includes("\\")
                  || /[\u0000-\u001f\u007f]/u.test(candidate)) return null;
              const withScheme = candidate.includes("://")
                  ? candidate
                  : `${candidate === "localhost" || candidate.startsWith("127.") || candidate.startsWith("[") ? "http" : "https"}://${candidate}`;
              try {
                  const url = new URL(withScheme);
                  if (!["http:", "https:"].includes(url.protocol)
                      || url.username || url.password || url.search || url.hash
                      || url.pathname !== "/" || !canonicalHostname(url.hostname)) return null;
                  return url.origin;
              } catch {
                  return null;
              }
          }

          function endpointFromRecord(
              candidate: unknown,
              source: EndpointSource,
          ): { origin: string; hostname: string; source: EndpointSource } | null {
              const endpoint = plainRecord(candidate);
              const origin = endpoint && canonicalOrigin(endpoint.url);
              return origin ? { origin, hostname: new URL(origin).hostname, source } : null;
          }

          function endpointFromConfig(
              config: Record<string, unknown> | null,
              keys: readonly string[],
          ): { origin: string; hostname: string; source: EndpointSource } | null {
              if (!config) return null;
              for (const key of keys) {
                  const origin = canonicalOrigin(config[key]);
                  if (origin) return { origin, hostname: new URL(origin).hostname, source: "config" };
              }
              return null;
          }

          function endpointCandidates(project: Record<string, unknown>, kind: EndpointKind) {
              const direct = endpointFromRecord(project[kind], "project");
              if (direct) return direct;
              const config = plainRecord(project.config);
              const configKeys: Record<EndpointKind, readonly string[]> = {
                  api: ["api_url", "apiUrl", "api_domain", "apiDomain", "SUPABASE_PUBLIC_DOMAIN"],
                  auth: ["auth_url", "authUrl", "auth_domain", "authDomain", "SUPABASE_AUTH_DOMAIN"],
                  studio: ["studio_url", "studioUrl", "studio_domain", "studioDomain", "SUPABASE_STUDIO_DOMAIN"],
              };
              return endpointFromConfig(config, configKeys[kind]);
          }

          export function projectEndpointProjection(
              response: HttpResult<unknown>,
              expectedRef: string,
          ): ProjectEndpointProjection | null {
              if (!PROJECT_REF_PATTERN.test(expectedRef)
                  || !successfulResponse(response)
                  || !payloadWithinLimit(response.data)) return null;
              const project = plainRecord(response.data);
              if (!project || project.ref !== expectedRef) return null;
              const endpoints: ProjectEndpointProjection["endpoints"] = {};
              for (const kind of ENDPOINT_KINDS) {
                  const endpoint = endpointCandidates(project, kind);
                  if (endpoint) endpoints[kind] = endpoint;
              }
              if (Object.keys(endpoints).length === 0) return null;
              return {
                  schema: "supacloud.project-endpoints.v1",
                  project_ref: expectedRef,
                  endpoints,
              };
          }

          export function projectEndpointsRead(
              response: HttpResult<unknown>,
              expectedRef: string,
          ): ProjectReadResult {
              if (!successfulResponse(response)) {
                  return failedResult(validHttpStatus(response.status)
                      ? `Project endpoints request failed (${response.status})`
                      : "Project endpoints request failed");
              }
              const projection = projectEndpointProjection(response, expectedRef);
              return projection
                  ? { text: JSON.stringify(projection, null, 2), isError: false }
                  : failedResult("Invalid project endpoints response");
          }

          function normalizedLimit(candidate: unknown): number | null {
              if (candidate === undefined) return PROJECT_ENDPOINT_LIST_DEFAULT_LIMIT;
              return typeof candidate === "number" && Number.isSafeInteger(candidate)
                  && candidate >= 1 && candidate <= PROJECT_ENDPOINT_LIST_MAX_LIMIT
                  ? candidate
                  : null;
          }

          export function projectRefsFromList(
              response: HttpResult<unknown>,
              requestedLimit: unknown,
          ): ProjectRefSelection {
              const limit = normalizedLimit(requestedLimit);
              if (limit === null) {
                  return { ok: false, result: failedResult(
                      `Project endpoint list limit must be an integer from 1 to ${PROJECT_ENDPOINT_LIST_MAX_LIMIT}`,
                  ) };
              }
              if (!successfulResponse(response)) {
                  return { ok: false, result: failedResult(validHttpStatus(response.status)
                      ? `Project list request failed (${response.status})`
                      : "Project list request failed") };
              }
              if (!payloadWithinLimit(response.data) || !Array.isArray(response.data)) {
                  return { ok: false, result: failedResult("Invalid project list response") };
              }
              const refs: string[] = [];
              const seen = new Set<string>();
              for (const candidate of response.data) {
                  const project = plainRecord(candidate);
                  const ref = project?.ref;
                  if (typeof ref !== "string" || !PROJECT_REF_PATTERN.test(ref) || seen.has(ref)) {
                      return { ok: false, result: failedResult("Invalid project list response") };
                  }
                  seen.add(ref);
                  if (refs.length < limit) refs.push(ref);
              }
              return {
                  ok: true,
                  refs,
                  total: response.data.length,
                  truncated: response.data.length > refs.length,
              };
          }

          export function projectEndpointInventoryRead(
              projects: ProjectEndpointProjection[],
              total: number,
              truncated: boolean,
          ): ProjectReadResult {
              return {
                  text: JSON.stringify({
                      schema: "supacloud.project-endpoint-inventory.v1",
                      total,
                      returned: projects.length,
                      truncated,
                      projects,
                  }, null, 2),
                  isError: false,
              };
          }
          '''
          endpoint_projection = "\n".join(line[10:] if line.startswith("          ") else line for line in endpoint_projection.splitlines()) + "\n"
          (ROOT / "packages/cli/src/shared/tools/project-endpoint-projection.ts").write_text(endpoint_projection)
          (ROOT / "packages/admin/src/shared/tools/project-endpoint-projection.ts").write_text(
              'export * from "../../../../cli/src/shared/tools/project-endpoint-projection";\n'
          )

          endpoint_tests = r'''import { describe, expect, test } from "bun:test";
          import {
              projectEndpointInventoryRead,
              projectEndpointProjection,
              projectEndpointsRead,
              projectRefsFromList,
          } from "./project-endpoint-projection";

          function response(data: unknown, status = 200) {
              return { ok: status >= 200 && status < 300, status, data } as any;
          }

          describe("project endpoint projection", () => {
              test("returns only canonical endpoint origins and never echoes unrelated config", () => {
                  const projection = projectEndpointProjection(response({
                      ref: "abc123",
                      api: { url: "https://api.example.com" },
                      studio: { url: "https://studio.example.com" },
                      config: {
                          auth_domain: "auth.example.com",
                          service_role_key: "must-not-leak",
                      },
                  }), "abc123");

                  expect(projection).toEqual({
                      schema: "supacloud.project-endpoints.v1",
                      project_ref: "abc123",
                      endpoints: {
                          api: { origin: "https://api.example.com", hostname: "api.example.com", source: "project" },
                          auth: { origin: "https://auth.example.com", hostname: "auth.example.com", source: "config" },
                          studio: { origin: "https://studio.example.com", hostname: "studio.example.com", source: "project" },
                      },
                  });
                  expect(JSON.stringify(projection)).not.toContain("must-not-leak");
              });

              test("rejects cross-project, credential-bearing, and path-bearing endpoint payloads", () => {
                  expect(projectEndpointProjection(response({
                      ref: "other",
                      api: { url: "https://api.example.com" },
                  }), "abc123")).toBeNull();
                  expect(projectEndpointsRead(response({
                      ref: "abc123",
                      api: { url: "https://user:pass@api.example.com" },
                      studio: { url: "https://studio.example.com/private" },
                  }), "abc123").isError).toBe(true);
              });

              test("bounds and validates platform endpoint inventory selection", () => {
                  const selected = projectRefsFromList(response([
                      { ref: "alpha", private: "discard" },
                      { ref: "beta" },
                  ]), 1);
                  expect(selected).toEqual({ ok: true, refs: ["alpha"], total: 2, truncated: true });
                  expect(projectRefsFromList(response([{ ref: "alpha" }, { ref: "alpha" }]), 100).ok).toBe(false);
                  expect(projectRefsFromList(response([{ ref: "alpha" }]), 501).ok).toBe(false);
              });

              test("renders a stable bulk inventory envelope", () => {
                  const project = projectEndpointProjection(response({
                      ref: "alpha",
                      api: { url: "https://api.example.com" },
                  }), "alpha")!;
                  expect(JSON.parse(projectEndpointInventoryRead([project], 3, true).text)).toEqual({
                      schema: "supacloud.project-endpoint-inventory.v1",
                      total: 3,
                      returned: 1,
                      truncated: true,
                      projects: [project],
                  });
              });
          });
          '''
          endpoint_tests = "\n".join(line[10:] if line.startswith("          ") else line for line in endpoint_tests.splitlines()) + "\n"
          (ROOT / "packages/cli/src/shared/tools/project-endpoint-projection.test.ts").write_text(endpoint_tests)

          legacy_tools = r'''import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { createReadStream, lstatSync, realpathSync } from "node:fs";
          import { basename, posix, resolve } from "node:path";
          import { Type } from "@sinclair/typebox";
          import { optional, stringEnum, withDescription } from "../schema";
          import type { ToolSchema } from "../schema";

          type ToolServer = {
              tool: (
                  name: string,
                  description: string,
                  schema: ToolSchema,
                  callback: (args: Record<string, unknown>) => Promise<any>,
              ) => void;
          };

          const LISTING_MAX_BYTES = 4 * 1024 * 1024;
          const MANIFEST_MAX_BYTES = 1024 * 1024;
          const MAX_ARCHIVE_ENTRIES = 100_000;
          const SHA256_PATTERN = /^[a-f0-9]{64}$/;
          const PROJECT_REF_PATTERN = /^[a-z0-9-]{1,20}$/;
          const MANIFEST_BASENAMES = new Set(["manifest.json", "backup-manifest.json", "management-full.json"]);

          type ManifestClassification = {
              kind: "management-full" | "unknown";
              format_version: string | null;
              created_at: string | null;
          };

          function safeError(code: string, detail?: string) {
              return {
                  isError: true,
                  content: [{
                      type: "text" as const,
                      text: JSON.stringify({
                          schema: "supacloud.legacy-backup.v1",
                          ok: false,
                          error: { code, ...(detail ? { detail } : {}) },
                      }, null, 2),
                  }],
              };
          }

          function success(payload: Record<string, unknown>) {
              return {
                  content: [{
                      type: "text" as const,
                      text: JSON.stringify({
                          schema: "supacloud.legacy-backup.v1",
                          ok: true,
                          ...payload,
                      }, null, 2),
                  }],
              };
          }

          function plainRecord(candidate: unknown): Record<string, unknown> | null {
              if (!candidate || typeof candidate !== "object" || Array.isArray(candidate)) return null;
              const prototype = Object.getPrototypeOf(candidate);
              return prototype === Object.prototype || prototype === null
                  ? candidate as Record<string, unknown>
                  : null;
          }

          function boundedString(candidate: unknown, maximum: number): string | null {
              return typeof candidate === "string" && candidate.length > 0 && candidate.length <= maximum
                  && !/[\u0000-\u001f\u007f]/u.test(candidate)
                  ? candidate
                  : null;
          }

          export function safeLegacyArchiveMember(candidate: string): string | null {
              if (!candidate || candidate.length > 4_096 || candidate.includes("\0") || candidate.includes("\\")) return null;
              const withoutDot = candidate.replace(/^\.\//u, "").replace(/\/$/u, "");
              if (!withoutDot || withoutDot.startsWith("/") || /^[A-Za-z]:/u.test(withoutDot)) return null;
              const normalized = posix.normalize(withoutDot);
              if (normalized === ".." || normalized.startsWith("../") || normalized !== withoutDot) return null;
              return normalized;
          }

          function canonicalTimestamp(candidate: unknown): string | null {
              const value = boundedString(candidate, 64);
              if (!value) return null;
              const milliseconds = Date.parse(value);
              return Number.isFinite(milliseconds) && new Date(milliseconds).toISOString() === value
                  ? value
                  : null;
          }

          export function classifyLegacyBackupManifest(candidate: unknown): ManifestClassification {
              const manifest = plainRecord(candidate);
              if (!manifest) return { kind: "unknown", format_version: null, created_at: null };
              const rawKind = boundedString(
                  manifest.kind ?? manifest.backup_kind ?? manifest.backup_type ?? manifest.type,
                  64,
              );
              const normalizedKind = rawKind?.trim().toLowerCase().replace(/_/gu, "-");
              const rawVersion = boundedString(manifest.format_version ?? manifest.version, 64);
              return {
                  kind: normalizedKind === "management-full" ? "management-full" : "unknown",
                  format_version: rawVersion,
                  created_at: canonicalTimestamp(manifest.created_at ?? manifest.createdAt),
              };
          }

          function runTar(args: string[], maximumBytes: number): string {
              const result = spawnSync("tar", args, {
                  encoding: "utf8",
                  timeout: 30_000,
                  maxBuffer: maximumBytes,
                  windowsHide: true,
              });
              if (result.error || result.status !== 0 || typeof result.stdout !== "string") {
                  throw new Error("ARCHIVE_READ_FAILED");
              }
              return result.stdout;
          }

          function archiveMembers(archivePath: string): string[] {
              const rawMembers = runTar(["-tf", archivePath], LISTING_MAX_BYTES).split("\n").filter(Boolean);
              if (rawMembers.length === 0 || rawMembers.length > MAX_ARCHIVE_ENTRIES) {
                  throw new Error("ARCHIVE_ENTRY_LIMIT");
              }
              const members = rawMembers.map(safeLegacyArchiveMember);
              if (members.some(member => member === null)) throw new Error("UNSAFE_ARCHIVE_PATH");
              const safeMembers = members as string[];
              if (new Set(safeMembers).size !== safeMembers.length) throw new Error("DUPLICATE_ARCHIVE_ENTRY");

              const verbose = runTar(["-tvf", archivePath], LISTING_MAX_BYTES).split("\n").filter(Boolean);
              if (verbose.some(line => line.length === 0 || !["-", "d"].includes(line[0]!))) {
                  throw new Error("UNSAFE_ARCHIVE_ENTRY_TYPE");
              }
              return safeMembers;
          }

          function manifestCandidate(members: readonly string[]): string | null {
              const candidates = members.filter(member => MANIFEST_BASENAMES.has(basename(member)));
              return candidates.sort((left, right) => left.split("/").length - right.split("/").length || left.localeCompare(right))[0] ?? null;
          }

          function readManifest(archivePath: string, member: string | null): unknown {
              if (!member) return null;
              const raw = runTar(["-xOf", archivePath, member], MANIFEST_MAX_BYTES);
              try {
                  return JSON.parse(raw);
              } catch {
                  throw new Error("INVALID_ARCHIVE_MANIFEST");
              }
          }

          async function sha256File(path: string): Promise<string> {
              return await new Promise((resolveDigest, reject) => {
                  const hash = createHash("sha256");
                  const stream = createReadStream(path);
                  stream.on("error", reject);
                  stream.on("data", chunk => hash.update(chunk));
                  stream.on("end", () => resolveDigest(hash.digest("hex")));
              });
          }

          function componentInventory(members: readonly string[]) {
              const has = (pattern: RegExp) => members.some(member => pattern.test(member));
              return {
                  manifest: members.some(member => MANIFEST_BASENAMES.has(basename(member))),
                  project_metadata: has(/(?:^|\/)(?:projects?|tenants?)\.json$/iu),
                  control_plane_database: has(/(?:^|\/)(?:management|supacloud[_-]?meta)[^/]*\.(?:sql|dump)(?:\.gz)?$/iu),
                  database_dumps: has(/(?:^|\/)(?:databases?|postgres)[^/]*\.(?:sql|dump)(?:\.gz)?$/iu),
                  configuration: has(/(?:^|\/)(?:config|environment|env)(?:\.[^/]+)?$/iu),
                  object_assets: has(/(?:^|\/)(?:storage|objects?|assets?)(?:\/|$)/iu),
              };
          }

          async function inspectLegacyArchive(archivePathInput: unknown) {
              const input = boundedString(archivePathInput, 4_096);
              if (!input) throw new Error("INVALID_ARCHIVE_PATH");
              const archivePath = resolve(input);
              const metadata = lstatSync(archivePath);
              if (metadata.isSymbolicLink() || !metadata.isFile()) throw new Error("ARCHIVE_NOT_REGULAR_FILE");
              const canonicalPath = realpathSync(archivePath);
              const members = archiveMembers(canonicalPath);
              const selectedManifest = manifestCandidate(members);
              const classification = classifyLegacyBackupManifest(readManifest(canonicalPath, selectedManifest));
              return {
                  archive: {
                      path: canonicalPath,
                      bytes: metadata.size,
                      sha256: await sha256File(canonicalPath),
                      entries: members.length,
                  },
                  format: {
                      kind: classification.kind,
                      format_version: classification.format_version,
                      created_at: classification.created_at,
                      manifest_present: Boolean(selectedManifest),
                  },
                  components: componentInventory(members),
                  safety: {
                      extracted: false,
                      paths_validated: true,
                      links_and_special_files_rejected: true,
                  },
              };
          }

          export function legacyBackupPlan(
              inspection: Awaited<ReturnType<typeof inspectLegacyArchive>>,
              targetRef: unknown,
          ) {
              const target = targetRef === undefined ? null : boundedString(targetRef, 20);
              if (target !== null && !PROJECT_REF_PATTERN.test(target)) throw new Error("INVALID_TARGET_REF");
              const recognized = inspection.format.kind === "management-full";
              const blockedReasons = [
                  ...(!recognized ? ["archive format is not a recognized management-full manifest"] : []),
                  "legacy import is intentionally disabled until a format-specific migrator and rollback fixture are installed",
              ];
              return {
                  operation: "legacy_backup.plan",
                  archive: inspection.archive,
                  format: inspection.format,
                  components: inspection.components,
                  target_project_ref: target,
                  mutation_supported: false,
                  blocked_reasons: blockedReasons,
                  proposed_phases: [
                      "create a current control-plane backup",
                      "restore into an isolated temporary database or namespace",
                      "validate project identities, endpoint mappings, and credential references",
                      "generate a reviewed migration report",
                      "perform an explicitly confirmed cutover with a tested rollback",
                  ],
              };
          }

          export function registerLegacyBackupTools(server: ToolServer): void {
              server.tool(
                  "legacy_backup",
                  "Read-only inspection and planning for legacy management-full archives. No extraction or restore mutation is performed.",
                  {
                      action: withDescription(stringEnum(["inspect", "plan"]), "Legacy archive action"),
                      archive_path: Type.String({ description: "Path to a local tar-compatible legacy backup archive" }),
                      expected_sha256: optional(Type.String(), "[plan] Exact lowercase SHA-256 from a prior inspect result"),
                      target_ref: optional(Type.String(), "[plan] Optional target project ref for migration planning"),
                  },
                  async ({ action, archive_path, expected_sha256, target_ref }) => {
                      try {
                          const inspection = await inspectLegacyArchive(archive_path);
                          if (action === "inspect") {
                              return success({ operation: "legacy_backup.inspect", ...inspection });
                          }
                          if (action !== "plan") return safeError("UNKNOWN_ACTION");
                          if (typeof expected_sha256 !== "string" || !SHA256_PATTERN.test(expected_sha256)) {
                              return safeError("INVALID_EXPECTED_SHA256");
                          }
                          if (inspection.archive.sha256 !== expected_sha256) {
                              return safeError("CHECKSUM_MISMATCH");
                          }
                          return success(legacyBackupPlan(inspection, target_ref));
                      } catch (error) {
                          const code = error instanceof Error && /^[A-Z0-9_]+$/u.test(error.message)
                              ? error.message
                              : "LEGACY_BACKUP_INSPECTION_FAILED";
                          return safeError(code);
                      }
                  },
              );
          }
          '''
          legacy_tools = "\n".join(line[10:] if line.startswith("          ") else line for line in legacy_tools.splitlines()) + "\n"
          (ROOT / "packages/admin/src/shared/tools/legacy-backup-tools.ts").write_text(legacy_tools)

          legacy_tests = r'''import { describe, expect, test } from "bun:test";
          import {
              classifyLegacyBackupManifest,
              legacyBackupPlan,
              safeLegacyArchiveMember,
          } from "./legacy-backup-tools";

          describe("legacy backup safety primitives", () => {
              test("accepts normalized relative members and rejects traversal, absolute, and ambiguous paths", () => {
                  expect(safeLegacyArchiveMember("management-full/manifest.json")).toBe("management-full/manifest.json");
                  for (const candidate of ["../secret", "/etc/passwd", "a/../secret", "C:\\secret", "a\\b"]) {
                      expect(safeLegacyArchiveMember(candidate)).toBeNull();
                  }
              });

              test("recognizes only an explicit management-full manifest contract", () => {
                  expect(classifyLegacyBackupManifest({
                      backup_kind: "management_full",
                      format_version: "1",
                      created_at: "2026-01-01T00:00:00.000Z",
                  })).toEqual({
                      kind: "management-full",
                      format_version: "1",
                      created_at: "2026-01-01T00:00:00.000Z",
                  });
                  expect(classifyLegacyBackupManifest({ type: "logical-full" }).kind).toBe("unknown");
                  expect(classifyLegacyBackupManifest({ kind: "management-full", created_at: "not-a-date" }).created_at).toBeNull();
              });

              test("produces a read-only plan and never claims import support", () => {
                  const inspection = {
                      archive: { path: "/secure/backup.tar", bytes: 42, sha256: "a".repeat(64), entries: 3 },
                      format: { kind: "management-full" as const, format_version: "1", created_at: null },
                      components: {
                          manifest: true,
                          project_metadata: true,
                          control_plane_database: true,
                          database_dumps: false,
                          configuration: true,
                          object_assets: false,
                      },
                      safety: { extracted: false, paths_validated: true, links_and_special_files_rejected: true },
                  };
                  const plan = legacyBackupPlan(inspection, "abc123");
                  expect(plan.mutation_supported).toBe(false);
                  expect(plan.target_project_ref).toBe("abc123");
                  expect(plan.blocked_reasons.length).toBeGreaterThan(0);
              });
          });
          '''
          legacy_tests = "\n".join(line[10:] if line.startswith("          ") else line for line in legacy_tests.splitlines()) + "\n"
          (ROOT / "packages/admin/src/shared/tools/legacy-backup-tools.test.ts").write_text(legacy_tests)

          # Project command surfaces (the CLI and Admin copies intentionally share the same projection contract).
          for project_tools_path in [
              "packages/cli/src/shared/tools/project-cli-tools.ts",
              "packages/admin/src/shared/tools/project-cli-tools.ts",
          ]:
              replace_once(
                  project_tools_path,
                  '} from "./project-read-projection";\n',
                  '} from "./project-read-projection";\nimport {\n    PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,\n    projectEndpointInventoryRead,\n    projectEndpointProjection,\n    projectEndpointsRead,\n    projectRefsFromList,\n} from "./project-endpoint-projection";\n',
              )

              # User-facing action additions are present in the shared CLI implementation and harmless if mirrored.
              replace_if_present(
                  project_tools_path,
                  "Actions: get, pause, restore, health, logs, api_keys, settings, tasks, task_detail, task_cancel, task_retry, task_stats, dlq, background_settings, update_background_settings",
                  "Actions: list (admin guidance), get, endpoints, pause, restore, health, logs, api_keys, settings, tasks, task_detail, task_cancel, task_retry, task_stats, dlq, background_settings, update_background_settings",
                  maximum=1,
              )
              replace_if_present(
                  project_tools_path,
                  '                "get", "pause", "restore", "health", "logs", "api_keys", "settings",\n',
                  '                "list", "get", "endpoints", "pause", "restore", "health", "logs", "api_keys", "settings",\n',
                  maximum=1,
              )
              replace_if_present(
                  project_tools_path,
                  "            const resolvedRef = resolveRef(ref, projectRef);\n            let text: string;\n",
                  "            if (action === \"list\") {\n                return {\n                    isError: true,\n                    content: [{\n                        type: \"text\" as const,\n                        text: \"Project enumeration is a platform operation. Use: supacloud-admin project list\",\n                    }],\n                };\n            }\n            const resolvedRef = resolveRef(ref, projectRef);\n            let text: string;\n",
                  maximum=1,
              )
              replace_if_present(
                  project_tools_path,
                  '                case "pause":\n',
                  '                case "endpoints":\n                    return projectReadResponse(projectEndpointsRead(\n                        await http.get(`/v1/projects/${resolvedRef}`, {\n                            maxResponseBytes: PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,\n                        }),\n                        resolvedRef,\n                    ));\n                case "pause":\n',
                  maximum=2,
              )

              # Admin actions.
              replace_if_present(
                  project_tools_path,
                  "Actions: list, create, get, delete, pause, restore, restart, settings, update_settings, api_keys, health, logs, tasks, task_detail, task_cancel, task_retry, task_stats, dlq, background_settings, update_background_settings",
                  "Actions: list, list_endpoints, create, get, endpoints, delete, pause, restore, restart, settings, update_settings, api_keys, health, logs, tasks, task_detail, task_cancel, task_retry, task_stats, dlq, background_settings, update_background_settings",
                  maximum=1,
              )
              replace_if_present(
                  project_tools_path,
                  '                "list", "create", "get", "delete", "pause", "restore",\n',
                  '                "list", "list_endpoints", "create", "get", "endpoints", "delete", "pause", "restore",\n',
                  maximum=1,
              )
              replace_if_present(
                  project_tools_path,
                  '            ref: optional(Type.String(), "Project ref (required for most actions except \'list\' and \'create\')"),\n',
                  '            ref: optional(Type.String(), "Project ref (required for most actions except \'list\', \'list_endpoints\', and \'create\')"),\n',
                  maximum=1,
              )
              replace_if_present(
                  project_tools_path,
                  '            limit: optional(Type.Number(), "[tasks/dlq] Max items to return"),\n',
                  '            limit: optional(Type.Number(), "[list_endpoints/tasks/dlq] Max items to return; endpoint inventory accepts 1-500"),\n',
                  maximum=2,
              )
              list_case = '''                case "list":
                    return projectReadResponse(projectListRead(await http.get("/v1/projects", {
                        maxResponseBytes: PROJECT_READ_RESPONSE_MAX_BYTES,
                    })));
'''
              list_endpoints_case = list_case + '''                case "list_endpoints": {
                    const selection = projectRefsFromList(await http.get("/v1/projects", {
                        maxResponseBytes: PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,
                    }), limit);
                    if (!selection.ok) return projectReadResponse(selection.result);
                    const projects = [];
                    for (const projectRef of selection.refs) {
                        const projection = projectEndpointProjection(await http.get(`/v1/projects/${projectRef}`, {
                            maxResponseBytes: PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,
                        }), projectRef);
                        if (!projection) {
                            return {
                                isError: true,
                                content: [{
                                    type: "text" as const,
                                    text: `❌ Invalid project endpoints response for ${projectRef}`,
                                }],
                            };
                        }
                        projects.push(projection);
                    }
                    return projectReadResponse(projectEndpointInventoryRead(
                        projects,
                        selection.total,
                        selection.truncated,
                    ));
                }
'''
              replace_if_present(project_tools_path, list_case, list_endpoints_case, maximum=1)

              # Add admin single-project endpoint projection immediately before delete.
              replace_if_present(
                  project_tools_path,
                  '                case "delete": {\n',
                  '                case "endpoints": {\n                    const resolvedRef = resolveRef(ref);\n                    return projectReadResponse(projectEndpointsRead(\n                        await http.get(`/v1/projects/${resolvedRef}`, {\n                            maxResponseBytes: PROJECT_ENDPOINT_RESPONSE_MAX_BYTES,\n                        }),\n                        resolvedRef,\n                    ));\n                }\n                case "delete": {\n',
                  maximum=1,
              )

          # Top-level CLI schema and help.
          replace_once(
              "packages/cli/src/index.ts",
              '    "get", "pause", "restore", "health", "logs", "api_keys", "settings",\n',
              '    "list", "get", "endpoints", "pause", "restore", "health", "logs", "api_keys", "settings",\n',
          )
          replace_once(
              "packages/cli/src/index.ts",
              '  ${preferredCommand} project get\n',
              '  ${preferredCommand} project get\n  ${preferredCommand} project endpoints --ref abc123\n',
          )

          # Register the always-local, read-only legacy archive tool in the Admin CLI.
          replace_once(
              "packages/admin/src/index.ts",
              'import { registerFrontendTools } from "./shared/tools/frontend-tools";\n',
              'import { registerFrontendTools } from "./shared/tools/frontend-tools";\nimport { registerLegacyBackupTools } from "./shared/tools/legacy-backup-tools";\n',
          )
          replace_once(
              "packages/admin/src/index.ts",
              "    registerUnavailableAdminTools(tools);\n",
              "    Object.assign(tools, captureTools((server) => registerLegacyBackupTools(server as any)));\n    registerUnavailableAdminTools(tools);\n",
          )
          replace_once(
              "packages/admin/src/index.ts",
              "  supacloud-admin project list\n",
              "  supacloud-admin project list\n  supacloud-admin project endpoints --ref abc123\n  supacloud-admin project list_endpoints --limit 100\n  supacloud-admin legacy_backup inspect --archive_path /secure/management-full.tar.gz\n  supacloud-admin legacy_backup plan --archive_path /secure/management-full.tar.gz --expected_sha256 <sha256> --target_ref abc123\n",
          )

          # Execution policy is shared conceptually but may be mirrored between packages.
          for policy_path in [
              "packages/cli/src/shared/execution-policy.ts",
              "packages/admin/src/shared/execution-policy.ts",
          ]:
              file = ROOT / policy_path
              if not file.exists():
                  continue
              text = file.read_text()
              old = '        read: ["get", "health", "logs", "api_keys", "settings", "tasks", "task_detail", "task_stats", "dlq", "background_settings"],'
              new = '        read: ["list", "list_endpoints", "get", "endpoints", "health", "logs", "api_keys", "settings", "tasks", "task_detail", "task_stats", "dlq", "background_settings"],'
              if old not in text:
                  raise SystemExit(f"{policy_path}: project read policy pattern not found")
              text = text.replace(old, new, 1)
              marker = "    database: {"
              if "    legacy_backup: {" not in text:
                  if marker not in text:
                      raise SystemExit(f"{policy_path}: database policy marker not found")
                  text = text.replace(marker, '    legacy_backup: {\n        read: ["inspect", "plan"],\n        write: [],\n    },\n' + marker, 1)
              file.write_text(text)

          # Documentation and changelogs. These sections intentionally describe the stable boundaries.
          append_once(
              "packages/cli/README.md",
              "## Project endpoint projection",
              '''## Project endpoint projection

`supacloud-cli project endpoints --ref <ref>` returns a bounded, secret-free
projection of the selected project's canonical API, Auth, and Studio origins.
It never enumerates other projects. Platform enumeration remains an operator
boundary: use `supacloud-admin project list` or
`supacloud-admin project list_endpoints --limit <1-500>`.
''',
          )
          append_once(
              "packages/admin/README.md",
              "## Project endpoint inventory and legacy backup inspection",
              '''## Project endpoint inventory and legacy backup inspection

```bash
supacloud-admin project endpoints --ref abc123
supacloud-admin project list_endpoints --limit 100
supacloud-admin legacy_backup inspect --archive_path /secure/management-full.tar.gz
supacloud-admin legacy_backup plan \\
  --archive_path /secure/management-full.tar.gz \\
  --expected_sha256 <sha256> \\
  --target_ref abc123
```

Legacy archive operations are read-only. They validate archive paths, reject
links and special entries, compute an exact SHA-256, and produce a migration
plan. They do not extract or restore data; a format-specific importer remains
blocked until it has a fixture-backed rollback contract.
''',
          )
          append_once(
              "packages/cli/skills/supacloud-cli/references/command-map.md",
              "### Endpoint and platform enumeration boundary",
              '''### Endpoint and platform enumeration boundary

- Use `supacloud-cli project endpoints --ref <ref>` for the selected project's
  secret-free API/Auth/Studio origin projection.
- Project enumeration is platform-scoped. Use `supacloud-admin project list` or
  `supacloud-admin project list_endpoints`; do not broaden a project credential
  into organization-wide discovery.
- `project restore` resumes/re-provisions lifecycle state. It is not a database
  backup restore and must never be used as an alias for legacy archive import.
''',
          )

          for changelog_path, feature_lines in [
              (
                  "packages/cli/CHANGELOG.md",
                  "* **cli:** add secret-free project endpoint projection and explicit admin guidance for project enumeration\n",
              ),
              (
                  "packages/admin/CHANGELOG.md",
                  "* **admin:** add project endpoint inventory plus read-only legacy management-full inspection and planning\n",
              ),
          ]:
              file = ROOT / changelog_path
              text = file.read_text()
              if feature_lines.strip() not in text:
                  marker = "### Features\n\n"
                  if marker not in text:
                      raise SystemExit(f"{changelog_path}: Unreleased Features marker missing")
                  file.write_text(text.replace(marker, marker + feature_lines, 1))

          # The one-shot workflow must not remain in the PR diff.
          workflow = ROOT / ".github/workflows/agent-project-endpoints-legacy-backup.yml"
          workflow.unlink()
          PY

      - name: Check generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(cli): add project endpoint projection and legacy backup planning"
          git push origin HEAD:feat/project-endpoints-legacy-backup

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate CLI
        working-directory: packages/cli
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test src/shared/tools/project-endpoint-projection.test.ts src/shared/tools/project-cli-tools.test.ts src/shared/execution-policy.test.ts

      - name: Validate Admin CLI
        working-directory: packages/admin
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run typecheck
          bun test src/shared/tools/legacy-backup-tools.test.ts src/shared/tools/project-cli-tools.test.ts src/shared/execution-policy.test.ts
