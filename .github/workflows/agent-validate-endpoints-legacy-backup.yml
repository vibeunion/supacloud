name: Validate endpoint and legacy backup implementation

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-final-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/project-endpoints-legacy-backup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-endpoints-legacy-backup
          fetch-depth: 0

      - name: Remove temporary agent workflows from the PR diff
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f -name 'agent-*.yml' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary implementation workflows"
            git push origin HEAD:feat/project-endpoints-legacy-backup
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Validate implementation and report result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -uo pipefail
          log_file="$RUNNER_TEMP/endpoint-validation.log"
          {
            echo '## CLI'
            cd packages/cli
            bun install --frozen-lockfile
            bun run typecheck
            bun test src/shared/tools/project-endpoint-projection.test.ts src/shared/tools/project-cli-tools.test.ts src/shared/execution-policy.test.ts
            cd ../..
            echo '## Admin CLI'
            cd packages/admin
            bun install --frozen-lockfile
            bun run typecheck
            bun test src/shared/tools/legacy-backup-tools.test.ts src/shared/tools/project-cli-tools.test.ts src/shared/execution-policy.test.ts
          } >"$log_file" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            gh pr comment "$PR_NUMBER" --body $'✅ Focused validation passed.\n\n- CLI frozen install and typecheck\n- Project endpoint projection tests\n- Project command and execution-policy tests\n- Admin frozen install and typecheck\n- Legacy backup safety tests\n- Admin command and execution-policy tests'
          else
            tail -n 120 "$log_file" >"$RUNNER_TEMP/endpoint-validation-tail.log"
            {
              echo '❌ Focused validation failed. The last 120 log lines follow:'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/endpoint-validation-tail.log"
              echo '```'
            } >"$RUNNER_TEMP/endpoint-validation-comment.md"
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/endpoint-validation-comment.md"
          fi
          cat "$log_file"
          exit "$status"
