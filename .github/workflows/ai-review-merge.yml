name: AI Review & Auto-Merge PR

on:
  workflow_run:
    workflows: ["Management API CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: write

concurrency:
  group: ai-review-merge-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: true

jobs:
  ai-review-and-merge:
    name: AI Review & Auto-Merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Determine PR metadata
        id: pr-info
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$MANUAL_PR_NUMBER"
            HEAD_SHA=""
            RUN_BASE_REF=""
            RUN_HEAD_REF=""
          else
            PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            HEAD_SHA=$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")
            RUN_BASE_REF=$(jq -r '.workflow_run.pull_requests[0].base.ref // empty' "$GITHUB_EVENT_PATH")
            RUN_HEAD_REF=$(jq -r '.workflow_run.pull_requests[0].head.ref // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$PR_NUMBER" ] || [ -z "$HEAD_SHA" ] || [ -z "$RUN_BASE_REF" ] || [ -z "$RUN_HEAD_REF" ]; then
              echo "Trusted workflow run is missing immutable PR origin metadata. Skipping."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "No pull request is associated with this trusted workflow run."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_JSON=$(curl -fsS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          STATE=$(jq -r '.state // empty' <<<"$PR_JSON")
          DRAFT=$(jq -r '.draft // false' <<<"$PR_JSON")
          BASE_REF=$(jq -r '.base.ref // empty' <<<"$PR_JSON")
          PR_HEAD_REF=$(jq -r '.head.ref // empty' <<<"$PR_JSON")
          if [ "$STATE" != "open" ]; then
            echo "PR #${PR_NUMBER} is not open. Skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "PR #${PR_NUMBER} is a draft. Skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$BASE_REF" in
            main|dev) ;;
            *)
              echo "PR #${PR_NUMBER} targets ineligible base ${BASE_REF}. Skipping."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            if [ "$BASE_REF" != "$RUN_BASE_REF" ]; then
              echo "Workflow base ${RUN_BASE_REF} no longer matches PR base ${BASE_REF}. Skipping."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$PR_HEAD_REF" != "$RUN_HEAD_REF" ]; then
              echo "Workflow head ${RUN_HEAD_REF} no longer matches PR head ${PR_HEAD_REF}. Skipping."
              echo "pr_number=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          PR_HEAD_SHA=$(jq -r '.head.sha' <<<"$PR_JSON")
          if [ -n "$HEAD_SHA" ] && [ "$HEAD_SHA" != "$PR_HEAD_SHA" ]; then
            echo "Workflow SHA ${HEAD_SHA} is stale; current PR head is ${PR_HEAD_SHA}. Skipping."
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${PR_HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted default-branch control code
        if: steps.pr-info.outputs.pr_number != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        if: steps.pr-info.outputs.pr_number != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Validate trusted AI review script
        if: steps.pr-info.outputs.pr_number != ''
        run: |
          node --check .github/scripts/ai-review-merge.mjs
          node --test .github/scripts/ai-review-merge.test.mjs

      - name: AI Review & Merge
        if: steps.pr-info.outputs.pr_number != ''
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ steps.pr-info.outputs.base_ref }}
          GITHUB_HEAD_REF: ${{ steps.pr-info.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr-info.outputs.head_sha }}
        run: node .github/scripts/ai-review-merge.mjs

      # GITHUB_TOKEN 合并产生的 push 事件不会触发依赖 on.push 的 workflow
      # （GitHub 对默认 token 的硬性限制）。auto-merge 合入 main 后显式
      # dispatch release-please，确保发版 PR 正常生成；dev 分支不触发。
      - name: Trigger release-please after auto-merge
        if: steps.pr-info.outputs.pr_number != '' && steps.pr-info.outputs.base_ref == 'main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-info.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MERGED=$(curl -fsS \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}" \
            | jq -r '.merged // false')
          if [ "$MERGED" = "true" ]; then
            echo "PR #${PR_NUMBER} was auto-merged. Dispatching release-please."
            gh workflow run release-please.yml --repo "${REPOSITORY}" --ref main
          else
            echo "PR #${PR_NUMBER} was not merged (AI did not approve, or merge failed). Skipping release-please dispatch."
          fi
