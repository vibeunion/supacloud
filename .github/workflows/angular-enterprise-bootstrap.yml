name: Angular enterprise verification environment

on:
  push:
    branches: [feat/angular-enterprise-completion]
    paths: [.github/workflows/angular-enterprise-bootstrap.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  environment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Record source and install exact lockfile dependencies
        run: |
          git rev-parse HEAD
          bun --version
          status=0
          for package in contracts commands delivery compiler db app supacloud-js testing elysia cli; do
            (cd "packages/$package" && bun install --frozen-lockfile --ignore-scripts) || status=1
          done
          exit "$status"
      - name: Export source and verification runtime (no credentials or git configuration)
        if: always()
        run: |
          mkdir -p /tmp/angular-enterprise-evidence
          git archive --format=tar HEAD > /tmp/angular-enterprise-evidence/source.tar
          git bundle create /tmp/angular-enterprise-evidence/repository.bundle --all
          find packages -maxdepth 2 -type d \( -name node_modules -o -name dist \) -print0 > /tmp/angular-enterprise-paths
          tar --null -T /tmp/angular-enterprise-paths -cf /tmp/angular-enterprise-evidence/dependencies.tar
          cp "$(command -v bun)" /tmp/angular-enterprise-evidence/bun
          git rev-parse HEAD > /tmp/angular-enterprise-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-enterprise-verification-environment
          path: /tmp/angular-enterprise-evidence/
          retention-days: 1
          compression-level: 1
