name: App Generation Acceptance

# Called by "Management API CI" so the packed-consumer acceptance is part of the
# required "Required Checks" aggregate. Kept as a reusable workflow (instead of
# inlining the steps) so the generator path has a single definition.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Reusable workflows inherit the caller's github.workflow. Keep independent
  # callers/events from cancelling one another's required acceptance jobs.
  group: app-generation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-consumer:
    name: Packed CLI and generated resource
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Build, pack, install and exercise the consumer path
        run: bun run scripts/check_app_generation.ts
      - name: Generator safety and existing CLI regressions
        if: ${{ !cancelled() }}
        working-directory: packages/cli
        run: |
          bun run typecheck
          bun test src/shared/tools/app-scaffold-writes.test.ts src/shared/tools/app-resource-generation.test.ts src/shared/tools/app-tools.test.ts src/shared/tools/app-starter-composition.test.ts
          bun test src/shared/tools/app-minimal-starter.test.ts
          bun test src/shared/tools/app-local-dev.test.ts
          bun test src/shared/tools/app-verification-plan.test.ts
      - name: Recorded vibecoding metrics contract
        run: bun test scripts/vibecoding-eval.test.ts
      - name: Keep the exact Elysia beta policy intact
        if: ${{ !cancelled() }}
        run: node scripts/check-elysia-compatibility.mjs
