name: Auto Release & Tag

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Standard Version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 获取当前版本并计算新版本号
            CURRENT_VERSION=$(node -p "require('./package.json').version")
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            
            case "${{ github.event.inputs.release_type }}" in
              major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
              minor) NEW_VERSION="$MAJOR.$((MINOR+1)).0" ;;
              patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH+1))" ;;
            esac
            
            # 如果 tag 已存在，先删除远程 tag
            if git tag -l "v$NEW_VERSION" | grep -q "v$NEW_VERSION"; then
              echo "Tag v$NEW_VERSION already exists, deleting it first..."
              git push --delete origin "v$NEW_VERSION" 2>/dev/null || true
              git tag -d "v$NEW_VERSION" 2>/dev/null || true
            fi
            
            bun run release -- --release-as ${{ github.event.inputs.release_type }}
          else
            bun run release
          fi

      - name: Push Changes & Tags
        run: |
          git push --follow-tags origin main
