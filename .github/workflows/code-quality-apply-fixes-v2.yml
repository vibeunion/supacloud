name: Apply reviewed code quality fixes

on:
  push:
    branches:
      - agent/fix-code-quality-findings

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-code-quality-findings

      - name: Correct the final test-block matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-code-quality-fixes.py')
          text = path.read_text(encoding='utf-8')
          old = r'(?=describe\("ProjectService"\))'
          new = r'(?=describe\("ProjectService",)'
          if text.count(old) != 1:
              raise RuntimeError(f'expected one matcher to update, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Apply fixes and capture diagnostics
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python3 .github/scripts/apply-code-quality-fixes.py > /tmp/code-quality-fix-result.txt 2>&1
          status=$?
          set -e

          cat /tmp/code-quality-fix-result.txt
          if [[ "$status" -ne 0 ]]; then
            encoded="$(base64 -w 0 /tmp/code-quality-fix-result.txt)"
            path='.github/code-quality-fix-result.txt'
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=agent/fix-code-quality-findings" --jq '.sha' 2>/dev/null || true)"
            args=(
              --method PUT
              "repos/${GITHUB_REPOSITORY}/contents/${path}"
              -f message='chore: capture quality fix failure [skip ci]'
              -f content="$encoded"
              -f branch='agent/fix-code-quality-findings'
            )
            if [[ -n "$current_sha" ]]; then
              args+=(-f sha="$current_sha")
            fi
            gh api "${args[@]}"
            exit "$status"
          fi

      - name: Validate and commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git status --short)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: resolve reproducible code quality findings [skip ci]'
          git push origin HEAD:agent/fix-code-quality-findings
