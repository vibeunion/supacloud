name: Current Code Quality audit

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  analyze:
    if: github.head_ref == 'agent/audit-code-quality-20260822'
    name: Code Quality audit (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Prepare reproducible Code Quality report
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          language = os.environ["CODEQL_LANGUAGE"]
          findings = []
          for sarif_path in sorted(Path("codeql-results").rglob("*.sarif")):
              sarif = json.loads(sarif_path.read_text(encoding="utf-8"))
              for run in sarif.get("runs", []):
                  tool = run.get("tool", {})
                  components = [tool.get("driver", {})] + tool.get("extensions", [])
                  rules = {
                      rule.get("id"): rule
                      for component in components
                      for rule in component.get("rules", [])
                      if rule.get("id")
                  }
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId")
                      rule = rules.get(rule_id, {})
                      properties = rule.get("properties", {})
                      tags = [str(tag).lower() for tag in properties.get("tags", [])]
                      quality_tags = {
                          "quality",
                          "maintainability",
                          "reliability",
                          "correctness",
                      }
                      is_quality = bool(quality_tags.intersection(tags))
                      is_security = (
                          "security" in tags
                          or any(tag.startswith("external/cwe/") for tag in tags)
                      )
                      if not is_quality or is_security:
                          continue

                      locations = result.get("locations") or []
                      physical = locations[0].get("physicalLocation", {}) if locations else {}
                      artifact = physical.get("artifactLocation", {})
                      region = physical.get("region", {})
                      findings.append({
                          "rule_id": rule_id or "unknown",
                          "rule_name": rule.get("name") or "",
                          "severity": properties.get("problem.severity") or result.get("level") or "",
                          "path": artifact.get("uri") or "",
                          "line": region.get("startLine") or "",
                          "column": region.get("startColumn") or "",
                          "message": (result.get("message") or {}).get("text") or "",
                      })

          findings.sort(key=lambda item: (
              str(item["rule_id"]),
              str(item["path"]),
              str(item["line"]),
              str(item["column"]),
          ))
          counts = Counter(item["rule_id"] for item in findings)
          Path("code-quality-count.txt").write_text(str(len(findings)), encoding="utf-8")
          Path("code-quality-findings.json").write_text(
              json.dumps(findings, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          def esc(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          lines = [
              f"## Code Quality audit: `{language}`",
              "",
              f"**Reproducible non-security quality findings: {len(findings)}**",
              "",
              "The scan used CodeQL `security-and-quality`, excluded security/CWE-tagged results, and did not upload SARIF.",
              "",
              "### Counts by rule",
              "",
          ]
          if counts:
              for rule_id, count in sorted(counts.items()):
                  lines.append(f"- `{rule_id}`: {count}")
          else:
              lines.append("- None")

          lines.extend([
              "",
              "### Findings",
              "",
          ])
          if findings:
              lines.extend([
                  "| Severity | Rule | File | Line | Message |",
                  "|---|---|---|---:|---|",
              ])
              for item in findings[:200]:
                  lines.append(
                      "| {severity} | `{rule}` | `{path}` | {line} | {message} |".format(
                          severity=esc(item["severity"]),
                          rule=esc(item["rule_id"]),
                          path=esc(item["path"]),
                          line=esc(item["line"]),
                          message=esc(item["message"]),
                      )
                  )
              if len(findings) > 200:
                  lines.append(f"\n_Truncated in comment: {len(findings) - 200} additional findings._")
          else:
              lines.append("No findings.")

          Path("code-quality-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"CODE_QUALITY_LANGUAGE={language}")
          print(f"CODE_QUALITY_FINDING_COUNT={len(findings)}")
          print("CODE_QUALITY_COUNTS_BY_RULE=" + json.dumps(dict(sorted(counts.items()))))
          PY

      - name: Publish audit summary to diagnostic PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -f code-quality-summary.md ]] || exit 0
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file code-quality-summary.md

      - name: Fail when reproducible quality findings exist
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat code-quality-count.txt)" = "0"
