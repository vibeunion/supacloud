name: Final Code Quality regression

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    if: github.head_ref == 'agent/fix-code-quality-findings'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze without uploading
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Assert no reproducible Code Quality findings
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          findings = []
          for sarif_path in sorted(Path('codeql-results').rglob('*.sarif')):
              sarif = json.loads(sarif_path.read_text(encoding='utf-8'))
              for run in sarif.get('runs', []):
                  tool = run.get('tool', {})
                  components = [tool.get('driver', {})] + tool.get('extensions', [])
                  rules = {
                      rule.get('id'): rule
                      for component in components
                      for rule in component.get('rules', [])
                      if rule.get('id')
                  }
                  for result in run.get('results', []):
                      rule_id = result.get('ruleId')
                      rule = rules.get(rule_id, {})
                      tags = [
                          str(tag).lower()
                          for tag in rule.get('properties', {}).get('tags', [])
                      ]
                      quality_tags = {
                          'quality',
                          'maintainability',
                          'reliability',
                          'correctness',
                      }
                      is_quality = bool(quality_tags.intersection(tags))
                      is_security = (
                          'security' in tags
                          or any(tag.startswith('external/cwe/') for tag in tags)
                      )
                      if not is_quality or is_security:
                          continue

                      locations = result.get('locations') or []
                      physical = locations[0].get('physicalLocation', {}) if locations else {}
                      artifact = physical.get('artifactLocation', {})
                      region = physical.get('region', {})
                      findings.append({
                          'rule_id': rule_id,
                          'path': artifact.get('uri'),
                          'line': region.get('startLine'),
                          'message': (result.get('message') or {}).get('text'),
                      })

          counts = Counter(item['rule_id'] for item in findings)
          print(f'CODE_QUALITY_LANGUAGE={os.environ["CODEQL_LANGUAGE"]}')
          print(f'CODE_QUALITY_FINDING_COUNT={len(findings)}')
          print('CODE_QUALITY_COUNTS_BY_RULE=' + json.dumps(dict(sorted(counts.items()))))
          if findings:
              print('CODE_QUALITY_FINDINGS=' + json.dumps(findings, ensure_ascii=False))
              raise SystemExit(1)
          PY
