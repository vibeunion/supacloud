name: Code quality findings probe

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  security-events: write

jobs:
  analyze:
    if: github.head_ref == 'agent/fix-code-quality-findings'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Analyze without uploading
        id: analyze
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-results

      - name: Extract reproducible quality findings
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('codeql-results')
          findings = []
          all_results = []

          for sarif_path in sorted(root.rglob('*.sarif')):
              sarif = json.loads(sarif_path.read_text(encoding='utf-8'))
              for run in sarif.get('runs', []):
                  rules = {
                      rule.get('id'): rule
                      for rule in run.get('tool', {}).get('driver', {}).get('rules', [])
                      if rule.get('id')
                  }
                  for result in run.get('results', []):
                      rule_id = result.get('ruleId')
                      rule = rules.get(rule_id, {})
                      properties = rule.get('properties', {})
                      tags = [str(tag).lower() for tag in properties.get('tags', [])]
                      locations = result.get('locations') or []
                      physical = (
                          locations[0].get('physicalLocation', {})
                          if locations
                          else {}
                      )
                      artifact = physical.get('artifactLocation', {})
                      region = physical.get('region', {})
                      item = {
                          'language': os.environ['CODEQL_LANGUAGE'],
                          'rule_id': rule_id,
                          'name': rule.get('name'),
                          'title': (rule.get('shortDescription') or {}).get('text'),
                          'message': (result.get('message') or {}).get('text'),
                          'path': artifact.get('uri'),
                          'start_line': region.get('startLine'),
                          'start_column': region.get('startColumn'),
                          'end_line': region.get('endLine'),
                          'severity': properties.get('problem.severity'),
                          'precision': properties.get('precision'),
                          'tags': tags,
                      }
                      all_results.append(item)

                      quality_tags = {'maintainability', 'reliability', 'correctness'}
                      is_quality = bool(quality_tags.intersection(tags))
                      is_security = (
                          'security' in tags
                          or any(tag.startswith('external/cwe/') for tag in tags)
                      )
                      if is_quality and not is_security:
                          findings.append(item)

          unclassified = [
              item for item in all_results
              if item not in findings
              and 'security' not in item['tags']
              and not any(tag.startswith('external/cwe/') for tag in item['tags'])
          ]

          summary = {
              'language': os.environ['CODEQL_LANGUAGE'],
              'quality_findings': findings,
              'unclassified_non_security_findings': unclassified,
              'total_result_count': len(all_results),
          }

          print('CODEQL_QUALITY_FINDINGS_BEGIN')
          print(json.dumps(findings, ensure_ascii=False, separators=(',', ':')))
          print('CODEQL_QUALITY_FINDINGS_END')
          print(f'CODEQL_QUALITY_FINDING_COUNT={len(findings)}')
          print('CODEQL_UNCLASSIFIED_FINDINGS_BEGIN')
          print(json.dumps(unclassified, ensure_ascii=False, separators=(',', ':')))
          print('CODEQL_UNCLASSIFIED_FINDINGS_END')
          print(f'CODEQL_TOTAL_RESULT_COUNT={len(all_results)}')

          if os.environ['CODEQL_LANGUAGE'] == 'javascript-typescript':
              Path('code-quality-js-findings.json').write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Persist JavaScript findings summary temporarily
        if: matrix.language == 'javascript-typescript'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w 0 code-quality-js-findings.json)"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/.github/code-quality-js-findings.json" \
            -f message='chore: persist code quality probe findings [skip ci]' \
            -f content="$encoded" \
            -f branch="$GITHUB_HEAD_REF"
