name: Code quality findings summarizer

on:
  push:
    branches:
      - agent/fix-code-quality-findings

permissions:
  contents: write

jobs:
  summarize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/fix-code-quality-findings

      - name: Split findings and capture source context
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          payload = json.loads(Path('.github/code-quality-js-findings.json').read_text(encoding='utf-8'))
          findings = payload['quality_findings']
          findings.sort(key=lambda item: (
              item.get('severity') or '',
              item.get('rule_id') or '',
              item.get('path') or '',
              item.get('start_line') or 0,
          ))

          findings_dir = Path('.github/code-quality-findings')
          context_dir = Path('.github/code-quality-context')
          findings_dir.mkdir(parents=True, exist_ok=True)
          context_dir.mkdir(parents=True, exist_ok=True)
          for directory in (findings_dir, context_dir):
              for old in directory.iterdir():
                  if old.is_file():
                      old.unlink()

          chunk_size = 15
          chunk_paths = []
          for index in range(0, len(findings), chunk_size):
              chunk = findings[index:index + chunk_size]
              number = index // chunk_size + 1
              chunk_path = findings_dir / f'{number:02d}.jsonl'
              chunk_path.write_text(
                  ''.join(json.dumps(item, ensure_ascii=False, separators=(',', ':')) + '\n' for item in chunk),
                  encoding='utf-8',
              )
              chunk_paths.append(chunk_path.as_posix())

              blocks = []
              for item in chunk:
                  path = Path(item['path'])
                  line_number = int(item.get('start_line') or 1)
                  lines = path.read_text(encoding='utf-8').splitlines()
                  start = max(1, line_number - 4)
                  end = min(len(lines), line_number + 4)
                  blocks.append(
                      f"=== {item['path']}:{line_number} | {item['rule_id']} | {item['message']} ==="
                  )
                  for current in range(start, end + 1):
                      marker = '>' if current == line_number else ' '
                      blocks.append(f'{marker}{current:5d}: {lines[current - 1]}')
                  blocks.append('')
              (context_dir / f'{number:02d}.txt').write_text(
                  '\n'.join(blocks) + '\n',
                  encoding='utf-8',
              )

          summary = {
              'total': len(findings),
              'by_severity': dict(sorted(Counter(item.get('severity') for item in findings).items())),
              'by_rule': dict(sorted(Counter(item['rule_id'] for item in findings).items(), key=lambda item: (-item[1], item[0]))),
              'by_path': dict(sorted(Counter(item['path'] for item in findings).items(), key=lambda item: (-item[1], item[0]))),
              'chunks': chunk_paths,
          }
          Path('.github/code-quality-summary.json').write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit compact review files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/code-quality-summary.json .github/code-quality-findings .github/code-quality-context
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh code quality review context [skip ci]'
          git push origin HEAD:agent/fix-code-quality-findings
