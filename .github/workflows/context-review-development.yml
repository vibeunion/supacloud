name: Development Context Review Validation
on:
  push:
    branches: [review/context-1515-1516]
    paths: [.github/workflows/context-review-development.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked verification dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/contracts
          bun run --cwd packages/contracts build
          bun install --frozen-lockfile --cwd packages/delivery
          bun install --frozen-lockfile --cwd packages/compiler
          bun install --frozen-lockfile --cwd packages/app
          mkdir -p /tmp/context-development-results
      - name: Apply merged development PR preserving every existing export
        run: |
          git diff 8bf40fc5988aaf075c7c3d8a319798bb11e366fd^ 8bf40fc5988aaf075c7c3d8a319798bb11e366fd -- docs packages/compiler/src/cli.ts 'packages/compiler/src/application-development*' | git apply
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          patch=subprocess.check_output(['git','diff','8bf40fc5988aaf075c7c3d8a319798bb11e366fd^','8bf40fc5988aaf075c7c3d8a319798bb11e366fd','--','packages/compiler/src/index.ts'],text=True)
          added='\n'.join(line[1:] for line in patch.splitlines() if line.startswith('+') and not line.startswith('+++'))+'\n'
          assert added.startswith('export {\n') and added.count('from "./application-development";')==2
          p=Path('packages/compiler/src/index.ts')
          original=p.read_text()
          assert 'from "./application-development";' not in original
          anchor='export type { ExecutionContextPack, ExecutionTimelineStage, ExecutionTimelineAttempt, ExecutionTimelineEntry } from "./execution-context";\n'
          assert original.count(anchor)==1
          p.write_text(original.replace(anchor,anchor+added))
          PY
          cp packages/compiler/src/application-development.ts /tmp/original-development.ts
          python3 .review/fix1516.py
          cp packages/compiler/src/application-development.ts /tmp/fixed-development.ts
          cp /tmp/original-development.ts packages/compiler/src/application-development.ts
          set +e
          bun test packages/compiler/src/application-development-regressions.test.ts > /tmp/context-development-results/1516-before.log 2>&1
          code=$?
          set -e
          cat /tmp/context-development-results/1516-before.log
          test "$code" -ne 0
          grep -q '5 fail' /tmp/context-development-results/1516-before.log
          cp /tmp/fixed-development.ts packages/compiler/src/application-development.ts
      - name: Verify both contexts, CLI and resource regressions
        run: |
          set -o pipefail
          bun test packages/compiler/src/application-development.test.ts packages/compiler/src/application-development-regressions.test.ts packages/compiler/src/application-development-cli.test.ts packages/compiler/src/execution-context.test.ts packages/compiler/src/execution-timeline-regressions.test.ts packages/compiler/src/execution-context-cli.test.ts packages/compiler/src/resource-model.test.ts packages/compiler/src/resource-model-regressions.test.ts 2>&1 | tee /tmp/context-development-results/1516-after.log
          bun run --cwd packages/compiler typecheck 2>&1 | tee /tmp/context-development-results/1516-typecheck.log
          bun run --cwd packages/compiler typecheck:test 2>&1 | tee -a /tmp/context-development-results/1516-typecheck.log
          bun scripts/check_public_api.ts --update 2>&1 | tee /tmp/context-development-results/public-api.log
          bun scripts/check_public_api.ts 2>&1 | tee -a /tmp/context-development-results/public-api.log
          bun scripts/check_diagnostic_docs.ts
          node scripts/check-readme-docs.mjs
          git diff --exit-code -- packages/app/public-api.json
          git diff --check
      - name: Save validated product files on the isolated review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/README.md docs/application-development-context.md docs/encore-alignment-roadmap.md packages/compiler/src/application-development* packages/compiler/src/cli.ts packages/compiler/src/index.ts packages/compiler/public-api.json
          git commit -m 'fix(compiler): align development projection with canonical application model'
          git push origin HEAD:refs/heads/review/context-1515-1516
          python3 - <<'PY'
          import json,subprocess
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          paths=git('diff','--name-only','c1ecc16a7bafdb7da78d68b0444ede59e30eceb2','HEAD','--','docs','packages').splitlines()
          result={'commit':git('rev-parse','HEAD'),'files':[{'path':p,'mode':'100644','type':'blob','sha':git('rev-parse','HEAD:'+p)} for p in paths]}
          open('/tmp/context-development-results/1516.json','w').write(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: development-context-review-evidence
          path: /tmp/context-development-results
          retention-days: 7
