name: Deployment Test (RHEL Family)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  rhel-deploy-test:
    name: Installation Test on ${{ matrix.os }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [almalinux, rockylinux]
        version: ['9']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Install Script in Virtual Machine
        uses: cross-platform-actions/action@v0.25.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          run: |
            # 修复换行符问题 (Windows Git 同步可能带入 CRLF)
            sudo sed -i 's/\r$//' install.sh
            
            # 注入 CI 配置以跳过交互
            sudo bash -c "cat > config.env <<INNEREOF
            INTERNAL_IP=127.0.0.1
            SUPABASE_PUBLIC_DOMAIN=api.ci-test.local
            SUPABASE_STUDIO_DOMAIN=studio.ci-test.local
            DB_PASSWORD=ci_test_password_123
            JWT_SECRET=super-secret-jwt-token-32-chars-long-for-ci
            DASHBOARD_USERNAME=admin
            DASHBOARD_PASSWORD=ci_admin_password
            GRAFANA_PASSWORD=ci_grafana_password
            S3_STORAGE_TYPE=minio
            EDGE_RUNTIME=deno
            INNEREOF"
            
            # 执行完整的安装脚本
            sudo bash install.sh
            
            # 验证生成的文件
            echo "=== Verifying generated configs ==="
            sudo ls -l /etc/nginx/nginx.conf || echo "Nginx config not generated"
            sudo ls -l /etc/supabase/jwt-keys.env || echo "JWT keys not generated"
            sudo nginx -v 2>&1 || echo "Nginx not installed"
            sudo cat /root/pigsty/pigsty.yml 2>/dev/null | head -30 || echo "Pigsty config not generated"
