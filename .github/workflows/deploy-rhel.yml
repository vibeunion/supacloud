name: Deployment Test (RHEL Family)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  rhel-deploy-test:
    name: Installation Test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: ["quay.io/centos/centos:stream9"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start systemd-enabled container
        run: |
          # 启动带 systemd 的特权容器 (用 /usr/sbin/init 作为 PID 1)
          # 这样 Ansible 模块、sshd、nginx 等服务都能正常工作
          docker run \
            --privileged \
            --cgroupns=host \
            --tmpfs /tmp:exec \
            --tmpfs /run \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -e ANSIBLE_REMOTE_TMP=/root/.ansible/tmp \
            --name rhel-node -d \
            -v ${{ github.workspace }}:/workspace \
            ${{ matrix.distro }} \
            /usr/sbin/init
          
          # 等待 systemd 完全启动
          echo "等待 systemd 初始化..."
          for i in $(seq 1 30); do
            if docker exec rhel-node systemctl is-system-running --wait 2>/dev/null | grep -qE "running|degraded"; then
              echo "systemd 已就绪 (${i}s)"
              break
            fi
            sleep 1
          done
          
          # 验证 systemd 状态
          docker exec rhel-node systemctl is-system-running || true
          docker exec rhel-node cat /proc/1/comm

      - name: Prepare environment
        run: |
          # 修复换行符问题 (Windows Git 同步可能带入 CRLF)
          docker exec rhel-node /bin/bash -c "cd /workspace && sed -i 's/\r$//' install.sh"
          
          # 注入 CI 配置以跳过交互
          docker exec rhel-node /bin/bash -c "cat > /workspace/config.env <<INNEREOF
          INTERNAL_IP=127.0.0.1
          SUPABASE_PUBLIC_DOMAIN=api.ci-test.local
          SUPABASE_STUDIO_DOMAIN=studio.ci-test.local
          DB_PASSWORD=ci_test_password_123
          JWT_SECRET=super-secret-jwt-token-32-chars-long-for-ci
          DASHBOARD_USERNAME=admin
          DASHBOARD_PASSWORD=ci_admin_password
          GRAFANA_PASSWORD=ci_grafana_password
          S3_STORAGE_TYPE=minio
          EDGE_RUNTIME=deno
          INNEREOF"

      - name: Run Install Script
        run: |
          # 在 systemd 容器中执行完整的安装脚本
          docker exec rhel-node /bin/bash -c "cd /workspace && bash install.sh"

      - name: Verify Configuration Artifacts
        if: always()
        run: |
          echo "=== Verifying generated configs ==="
          docker exec rhel-node ls -l /etc/nginx/nginx.conf || echo "Nginx config not generated"
          docker exec rhel-node ls -l /etc/supabase/jwt-keys.env || echo "JWT keys not generated"
          docker exec rhel-node nginx -v 2>&1 || echo "Nginx not installed"
          docker exec rhel-node ls -la /usr/lib64/nginx/modules/ 2>/dev/null || echo "No modules dir"
          docker exec rhel-node cat /root/pigsty/pigsty.yml 2>/dev/null | head -30 || echo "Pigsty config not generated"

      - name: Cleanup
        if: always()
        run: docker rm -f rhel-node || true
