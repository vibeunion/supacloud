name: Deployment Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy-check:
    runs-on: ubuntu-latest
    
    env:
      # Randomly generated configuration for testing
      PROJECT_NAME: "supacloud-test"
      DOMAIN: "test.example.com"
      DB_PASSWORD: "test_db_password_123!"
      JWT_SECRET: "super-secret-jwt-token-32-chars-minimum-length-key"
      ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.anon-key-payload"
      SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-payload"
      # Pigsty / Infrastructure configs
      # We will fetch and set these dynamically in the steps to simulate real IP detection
      # PG_HOST: "mocked_in_steps"
      # RIO_HOST: "mocked_in_steps"
      # OBJ_HOST: "mocked_in_steps"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mock Network Environment
        id: net_info
        run: |
          # Get the internal IP of the GitHub Runner
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Detected Runner IP: $RUNNER_IP"
          
          # Export for subsequent steps
          echo "PG_HOST=$RUNNER_IP" >> $GITHUB_ENV
          echo "RIO_HOST=$RUNNER_IP" >> $GITHUB_ENV
          echo "OBJ_HOST=$RUNNER_IP" >> $GITHUB_ENV
          
          echo "Simulated Infrastructure IPs set to $RUNNER_IP"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './deploy'
          severity: 'error' # Only fail on errors for now

      - name: Verify Configuration Templates
        working-directory: ./deploy
        run: |
          echo "Simulating configuration generation..."
          
          # 模拟 config.env 的生成或检查
          if [ ! -f config.env ]; then
            echo "config.env not found in deploy/, assuming it is generated or needs to be present."
          fi

      - name: Test Install Script (Dry Run / Syntax Check)
        working-directory: ./deploy
        run: |
          echo "Checking install.sh syntax and basic execution path..."
          chmod +x install.sh
          
          # 由于 install.sh 可能会执行真正的安装逻辑，我们这里仅做 bash -n 语法检查
          bash -n install.sh
          
          if [ $? -eq 0 ]; then
            echo "install.sh syntax is valid."
          else
            echo "install.sh syntax error!"
            exit 1
          fi

      - name: Validate Docker Compose Config
        working-directory: ./templates/project
        run: |
          echo "Validating docker-compose.yml..."
          # 创建一个临时的 .env 文件供 docker-compose config 使用
          cat > .env <<EOF
          POSTGRES_PASSWORD=${{ env.DB_PASSWORD }}
          JWT_SECRET=${{ env.JWT_SECRET }}
          ANON_KEY=${{ env.ANON_KEY }}
          SERVICE_ROLE_KEY=${{ env.SERVICE_ROLE_KEY }}
          KONG_HTTP_PORT=8000
          KONG_HTTPS_PORT=8443
          STUDIO_PORT=3000
          EOF
          
          # 使用 docker compose config 验证配置文件的有效性
          docker compose config > /dev/null
          if [ $? -eq 0 ]; then
            echo "Docker Compose configuration is valid."
          else
            echo "Docker Compose configuration is INVALID!"
            exit 1
          fi

      - name: Setup Node.js (for Bun/JS checks if needed)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: List scripts for verification
        run: |
          ls -R scripts/
          ls -R deploy/
