name: Deployment Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  integration-test:
    name: Full Installation Test
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Test Configuration
        run: |
          # 获取 Runner 内网 IP
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Using Runner IP: $RUNNER_IP"
          
          # 创建完整的 config.env 以避免交互式提示
          cat > config.env <<EOF
          # CI Test Configuration
          INTERNAL_IP=${RUNNER_IP}
          
          # Domains
          SUPABASE_PUBLIC_DOMAIN=api.ci-test.local
          SUPABASE_STUDIO_DOMAIN=studio.ci-test.local
          
          # Credentials (CI Mocks)
          # 设置具体的值以跳过生成逻辑或避免验证错误
          DB_PASSWORD=ci_test_password_123
          JWT_SECRET=super-secret-jwt-token-32-chars-long-for-ci
          ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.anon-key-ci-mock
          SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-key-ci-mock
          DASHBOARD_USERNAME=admin
          DASHBOARD_PASSWORD=ci_admin_password
          GRAFANA_PASSWORD=ci_grafana_password
          
          # Storage
          S3_STORAGE_TYPE=minio
          
          # Runtime
          EDGE_RUNTIME=deno
          
          # Skip large downloads or mocks if possible (optional env vars support could be added to install.sh)
          # 目前 install.sh 会尝试完整下载，我们让它跑，但可能会遇到 Pigsty 源的问题
          EOF
          
          echo "Config generated:"
          cat config.env

      - name: Setup Local SSH (Required for Ansible)
        run: |
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Runner IP: $RUNNER_IP"

          # ── Step 1: 生成 SSH 密鑰（优先用 ed25519）
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          # ── Step 2: 修改 sshd_config（必须在 keyscan 之前，修改后才重启）
          sudo sed -i \
            -e 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' \
            -e 's/^#\?PubkeyAuthentication.*/PubkeyAuthentication yes/' \
            /etc/ssh/sshd_config
          grep -q "^PermitRootLogin" /etc/ssh/sshd_config  || echo "PermitRootLogin yes"  | sudo tee -a /etc/ssh/sshd_config
          grep -q "^PubkeyAuthentication" /etc/ssh/sshd_config || echo "PubkeyAuthentication yes" | sudo tee -a /etc/ssh/sshd_config

          # ── Step 3: 重启 sshd（必须在 keyscan 之前）
          sudo systemctl restart ssh || sudo service ssh restart
          sleep 2  # 等待 sshd 完全就绪

          # ── Step 4: 为 root 配置密鑰 ──
          sudo mkdir -p /root/.ssh && sudo chmod 700 /root/.ssh
          sudo cp ~/.ssh/id_ed25519 /root/.ssh/id_ed25519
          sudo cp ~/.ssh/authorized_keys /root/.ssh/authorized_keys
          sudo chmod 600 /root/.ssh/id_ed25519 /root/.ssh/authorized_keys
          sudo chown -R root:root /root/.ssh

          # ── Step 5: keyscan 填充 known_hosts（sshd 已重启后）
          # 包括当前用户和 root 的 known_hosts，二者都必须填充
          for host in localhost 127.0.0.1 "$RUNNER_IP"; do
            ssh-keyscan -H "$host" 2>/dev/null >> ~/.ssh/known_hosts
            ssh-keyscan -H "$host" 2>/dev/null | sudo tee -a /root/.ssh/known_hosts > /dev/null
          done
          chmod 600 ~/.ssh/known_hosts
          sudo chmod 600 /root/.ssh/known_hosts

          # ── Step 6: 验证（root IP SSH 必须成功，否则 Ansible 一定失败）
          echo "Testing root@localhost SSH..."
          sudo ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_ed25519 root@localhost "echo ROOT_LOCALHOST_OK" || echo "WARN: root@localhost failed"

          echo "Testing root@IP SSH (this is what Ansible uses)..."
          sudo ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_ed25519 root@"$RUNNER_IP" "echo ROOT_IP_OK" || {
            echo "ERROR: root@$RUNNER_IP SSH failed — Ansible cannot proceed"
            exit 1
          }

          # ── Step 7: 导出 Ansible 环境变量 ──
          echo "ANSIBLE_HOST_KEY_CHECKING=False" >> "$GITHUB_ENV"
          echo "ANSIBLE_PRIVATE_KEY_FILE=/root/.ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH setup complete ✅"

      - name: Run Install Script
        run: |
          # 赋予执行权限
          chmod +x install.sh
          
          # 使用 sudo 执行，并带上非交互式前端配置防止 apt 卡住
          # 注意：install.sh 包含 sleep 和 heavy download，CI 中可能会很慢
          export DEBIAN_FRONTEND=noninteractive
          
          echo "Starting installation..."
          # 这里为了防止真正的 heavy install (Pigsty) 导致 CI 极其耗时或失败
          # 我们通常只测试到 '环境检查' 和 '配置生成' 阶段
          # 但如果你要求 '真正的安装逻辑'，那就是下面这行：
          
          sudo -E ./install.sh
          
      - name: Verify Installation (Basic)
        if: success()
        run: |
          echo "Installation script finished successfully."
          # 检查生成的文件是否存在
          ls -l /etc/nginx/nginx.conf || true
          ls -l /etc/supabase/jwt-keys.env || true
          # 检查服务状态 (如果安装成功的话)
          systemctl status nginx || true

  management-test:
    name: Management API Integration Test
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: supacloud_meta
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Initialize Metadata Database
        run: |
          # Create schema that matches the actual code
          cat > metadata_schema.sql <<'SQLEOF'
          CREATE TABLE IF NOT EXISTS projects (
              id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
              ref VARCHAR(20) UNIQUE NOT NULL,
              name VARCHAR(100) NOT NULL,
              db_name VARCHAR(63) NOT NULL,
              db_user VARCHAR(63) NOT NULL,
              db_password VARCHAR(100) NOT NULL,
              jwt_secret VARCHAR(100) NOT NULL,
              anon_key TEXT NOT NULL,
              service_role_key TEXT NOT NULL,
              s3_bucket VARCHAR(63) NOT NULL,
              s3_access_key VARCHAR(100),
              s3_secret_key VARCHAR(100),
              region VARCHAR(50) DEFAULT 'local',
              status VARCHAR(20) DEFAULT 'creating',
              config JSONB DEFAULT '{}',
              created_at TIMESTAMPTZ DEFAULT NOW(),
              updated_at TIMESTAMPTZ DEFAULT NOW(),
              deleted_at TIMESTAMPTZ
          );
          CREATE INDEX IF NOT EXISTS idx_projects_ref ON projects(ref);
          CREATE INDEX IF NOT EXISTS idx_projects_status ON projects(status);
          SQLEOF
          PGPASSWORD=postgres_password psql -h localhost -U postgres -d supacloud_meta -f metadata_schema.sql

      - name: Setup Mock Libraries
        run: |
          mkdir -p scripts/lib
          cat > scripts/lib/mock.sh <<'SHEOF'
          #!/bin/bash
          echo "Mock: $0 $@"
          if [[ "$1" == "create" ]]; then
            echo "ACCESS_KEY=mock_access_key"
            echo "SECRET_KEY=mock_secret_key"
          fi
          exit 0
          SHEOF
          chmod +x scripts/lib/mock.sh
          cp scripts/lib/mock.sh scripts/lib/db_manager.sh
          cp scripts/lib/mock.sh scripts/lib/s3_manager.sh
          cp scripts/lib/mock.sh scripts/lib/router_manager.sh
          cp scripts/lib/mock.sh scripts/lib/key_manager.sh
          cp scripts/lib/mock.sh scripts/lib/function_manager.sh
          chmod +x scripts/lib/*.sh

      - name: Install Dependencies
        run: |
          cd packages/management-api
          bun install

      - name: Run Unit Tests
        run: |
          cd packages/management-api
          bun test --coverage

      - name: Run E2E Integration Tests
        run: |
          cd packages/management-api
          # Start the server in the background
          export MASTER_TOKEN=ci-test-token
          export DATABASE_URL=postgres://postgres:postgres_password@localhost:5432/supacloud_meta
          export SCRIPTS_PATH=${{ github.workspace }}/scripts/lib
          bun run src/index.ts &
          SERVER_PID=$!

          # Wait for server to start
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:9090/health > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            sleep 1
          done

          # Test: Health Check
          echo "Testing Health Check..."
          curl -sf http://localhost:9090/health | tee /tmp/health.json

          # Test: Create Project
          echo ""
          echo "Testing Project Creation..."
          RESPONSE=$(curl -sf -X POST http://localhost:9090/v1/projects \
            -H "Authorization: Bearer ci-test-token" \
            -H "Content-Type: application/json" \
            -d '{"name": "CI Test Project", "region": "local"}')
          echo "$RESPONSE" | tee /tmp/create.json
          echo "$RESPONSE" | grep -q "CI Test Project" || (echo "Failed: name not found" && exit 1)
          echo "$RESPONSE" | grep -q '"ref"' || (echo "Failed: ref not found" && exit 1)

          # Extract project ref
          PROJECT_REF=$(echo "$RESPONSE" | bun -e "console.log(JSON.parse(await Bun.stdin.text()).ref)")
          echo "Created project ref: $PROJECT_REF"

          # Test: List Projects
          echo ""
          echo "Testing Project Listing..."
          curl -sf -X GET http://localhost:9090/v1/projects \
            -H "Authorization: Bearer ci-test-token" | tee /tmp/list.json

          # Test: Get Project Details
          echo ""
          echo "Testing Project Details..."
          curl -sf -X GET "http://localhost:9090/v1/projects/$PROJECT_REF" \
            -H "Authorization: Bearer ci-test-token" | tee /tmp/details.json

          # Test: API Keys
          echo ""
          echo "Testing API Keys..."
          curl -sf -X GET "http://localhost:9090/v1/projects/$PROJECT_REF/api-keys" \
            -H "Authorization: Bearer ci-test-token" | tee /tmp/keys.json
          grep -q "anon_key" /tmp/keys.json || (echo "Failed: anon_key not found" && exit 1)
          grep -q "service_role_key" /tmp/keys.json || (echo "Failed: service_role_key not found" && exit 1)

          # Test: Project Health
          echo ""
          echo "Testing Project Health..."
          curl -sf -X GET "http://localhost:9090/v1/projects/$PROJECT_REF/health" \
            -H "Authorization: Bearer ci-test-token" | tee /tmp/health_proj.json

          # Cleanup: Kill server
          kill $SERVER_PID 2>/dev/null || true

          echo ""
          echo "All E2E tests passed!"

