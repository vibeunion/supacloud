name: Deployment Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    name: Full Installation Test
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Test Configuration
        run: |
          # 获取 Runner 内网 IP
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Using Runner IP: $RUNNER_IP"
          
          # 创建完整的 config.env 以避免交互式提示
          cat > deploy/config.env <<EOF
          # CI Test Configuration
          INTERNAL_IP=${RUNNER_IP}
          
          # Domains
          SUPABASE_PUBLIC_DOMAIN=api.ci-test.local
          SUPABASE_STUDIO_DOMAIN=studio.ci-test.local
          
          # Credentials (CI Mocks)
          # 设置具体的值以跳过生成逻辑或避免验证错误
          DB_PASSWORD=ci_test_password_123
          JWT_SECRET=super-secret-jwt-token-32-chars-long-for-ci
          ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.anon-key-ci-mock
          SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-key-ci-mock
          DASHBOARD_USERNAME=admin
          DASHBOARD_PASSWORD=ci_admin_password
          GRAFANA_PASSWORD=ci_grafana_password
          
          # Storage
          S3_STORAGE_TYPE=minio
          
          # Runtime
          EDGE_RUNTIME=deno
          
          # Skip large downloads or mocks if possible (optional env vars support could be added to install.sh)
          # 目前 install.sh 会尝试完整下载，我们让它跑，但可能会遇到 Pigsty 源的问题
          EOF
          
          echo "Config generated:"
          cat deploy/config.env

      - name: Run Install Script
        working-directory: ./deploy
        run: |
          # 赋予执行权限
          chmod +x install.sh
          
          # 使用 sudo 执行，并带上非交互式前端配置防止 apt 卡住
          # 注意：install.sh 包含 sleep 和 heavy download，CI 中可能会很慢
          export DEBIAN_FRONTEND=noninteractive
          
          echo "Starting installation..."
          # 这里为了防止真正的 heavy install (Pigsty) 导致 CI 极其耗时或失败
          # 我们通常只测试到 '环境检查' 和 '配置生成' 阶段
          # 但如果你要求 '真正的安装逻辑'，那就是下面这行：
          
          sudo -E ./install.sh
          
      - name: Verify Installation (Basic)
        if: success()
        run: |
          echo "Installation script finished successfully."
          # 检查生成的文件是否存在
          ls -l /usr/local/openresty/nginx/conf/nginx.conf || true
          ls -l /etc/supabase/jwt-keys.env || true
          # 检查服务状态 (如果安装成功的话)
          systemctl status openresty || true

