name: Deployment Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  integration-test:
    name: Full Installation Test
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Test Configuration
        run: |
          # 获取 Runner 内网 IP
          RUNNER_IP=$(hostname -I | awk '{print $1}')
          echo "Using Runner IP: $RUNNER_IP"
          
          # 创建完整的 config.env 以避免交互式提示
          cat > config.env <<EOF
          # CI Test Configuration
          INTERNAL_IP=${RUNNER_IP}
          
          # Domains
          SUPABASE_PUBLIC_DOMAIN=api.ci-test.local
          SUPABASE_STUDIO_DOMAIN=studio.ci-test.local
          
          # Credentials (CI Mocks)
          # 设置具体的值以跳过生成逻辑或避免验证错误
          DB_PASSWORD=ci_test_password_123
          JWT_SECRET=super-secret-jwt-token-32-chars-long-for-ci
          ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.anon-key-ci-mock
          SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.service-role-key-ci-mock
          DASHBOARD_USERNAME=admin
          DASHBOARD_PASSWORD=ci_admin_password
          GRAFANA_PASSWORD=ci_grafana_password
          
          # Storage
          S3_STORAGE_TYPE=minio
          
          # Runtime
          EDGE_RUNTIME=deno
          
          # Skip large downloads or mocks if possible (optional env vars support could be added to install.sh)
          # 目前 install.sh 会尝试完整下载，我们让它跑，但可能会遇到 Pigsty 源的问题
          EOF
          
          echo "Config generated:"
          cat config.env

      - name: Setup Local SSH (Required for Ansible)
        run: |
          # 1. 生成 keys
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          
          # 2. 配置 authorized_keys
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          
          # 3. 确保已知 host (避免首次连接的 yes/no 提示)
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh-keyscan -H 127.0.0.1 >> ~/.ssh/known_hosts
          ssh-keyscan -H $(hostname -I | awk '{print $1}') >> ~/.ssh/known_hosts
          
          # 4. 配置 SSH 服务 (GitHub Runner 可能默认禁用了 root 登录或者没配好)
          # 对于 CI Runner，通常用户是 'runner'，但我们后续是用 sudo ./install.sh
          # Pigsty 默认用 root 或带有 sudo 的用户。
          # 我们需要让当前用户能 ssh localhost
          
          echo "Testing SSH connection..."
          ssh -o StrictHostKeyChecking=no $(whoami)@localhost "echo SSH Connection OK"
          
          # 5. 特殊处理：Pigsty 运行在 sudo 下，会尝试 ssh root@ip
          # 必须允许 root 通过 SSH 登录
          
          # 关键：目录权限必须是 700，否则 SSH 会拒绝使用 Key
          sudo mkdir -p /root/.ssh
          sudo chmod 700 /root/.ssh
          
          sudo cp ~/.ssh/authorized_keys /root/.ssh/authorized_keys
          sudo cp ~/.ssh/id_rsa /root/.ssh/id_rsa
          sudo chmod 600 /root/.ssh/authorized_keys
          sudo chmod 600 /root/.ssh/id_rsa
          sudo chown -R root:root /root/.ssh
          
          # 修改 sshd_config 允许 root 登录
          sudo sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/#PermitRootLogin yes/PermitRootLogin yes/' /etc/ssh/sshd_config
          
          if ! grep -q "PermitRootLogin" /etc/ssh/sshd_config; then
            echo "PermitRootLogin yes" | sudo tee -a /etc/ssh/sshd_config
          fi
          
          # 重启 sshd
          sudo systemctl restart ssh || sudo service ssh restart
          
          echo "Testing Root SSH connection..."
          sudo ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_rsa root@localhost "echo ROOT SSH OK" || echo "Root SSH Failed"
          sudo ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_rsa root@$(hostname -I | awk '{print $1}') "echo ROOT IP SSH OK" || echo "Root IP SSH Failed"
          
          # 设置 Ansible 变量
          echo "ANSIBLE_HOST_KEY_CHECKING=False" >> $GITHUB_ENV
          echo "ANSIBLE_PRIVATE_KEY_FILE=/root/.ssh/id_rsa" >> $GITHUB_ENV
          # 注意：sudo 会重置环境变量，所以我们需要在 sudo 命令中显式传递，或者配置 sudoers
          # 更简单的是在 sudo install.sh 时 -E 保留环境


      - name: Run Install Script
        run: |
          # 赋予执行权限
          chmod +x install.sh
          
          # 使用 sudo 执行，并带上非交互式前端配置防止 apt 卡住
          # 注意：install.sh 包含 sleep 和 heavy download，CI 中可能会很慢
          export DEBIAN_FRONTEND=noninteractive
          
          echo "Starting installation..."
          # 这里为了防止真正的 heavy install (Pigsty) 导致 CI 极其耗时或失败
          # 我们通常只测试到 '环境检查' 和 '配置生成' 阶段
          # 但如果你要求 '真正的安装逻辑'，那就是下面这行：
          
          sudo -E ./install.sh
          
      - name: Verify Installation (Basic)
        if: success()
        run: |
          echo "Installation script finished successfully."
          # 检查生成的文件是否存在
          ls -l /usr/local/openresty/nginx/conf/nginx.conf || true
          ls -l /etc/supabase/jwt-keys.env || true
          # 检查服务状态 (如果安装成功的话)
          systemctl status openresty || true

