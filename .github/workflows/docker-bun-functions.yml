name: Build and Push Bun Functions Docker Image

on:
  push:
    branches:
      - main
    paths:
      # 仅当 Dockerfile 或相关文件变动时触发
      - 'templates/project/packages/bun-functions/Dockerfile'
      - 'templates/project/packages/bun-functions/index.ts'
      - 'templates/project/packages/bun-functions/package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'templates/project/packages/bun-functions/Dockerfile'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (leave empty for auto date tag)'
        required: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: zuohuadong/supabase-bun-function

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Generate date version
        id: version
        run: |
          # 生成日期版本: YYYYMMDD-短SHA (类似 Supabase 格式)
          DATE_TAG=$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-7)
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT
          echo "Generated version: ${DATE_TAG}"
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest 标签 (仅 main 分支)
            type=raw,value=latest,enable={{is_default_branch}}
            # 日期版本标签: 20241230-abc1234
            type=raw,value=${{ steps.version.outputs.date_tag }},enable={{is_default_branch}}
            # PR 标签
            type=ref,event=pr
            # 手动输入的标签
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./templates/project/packages/bun-functions
          file: ./templates/project/packages/bun-functions/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Supabase Bun Edge Functions
            org.opencontainers.image.description=High performance Bun.js Edge Functions runtime
            org.opencontainers.image.version=${{ steps.version.outputs.date_tag }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Summary
        run: |
          echo "## 🚀 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Usage:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.date_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # 健康检查测试
  test:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Pull and test image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # 启动容器
          docker run -d \
            --name test-bun-functions \
            -p 9001:9001 \
            -e JWT_SECRET="test-secret" \
            -e ANON_KEY="test-anon-key" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # 等待启动
          sleep 5
          
          # 健康检查
          curl -f http://localhost:9001/health || exit 1
          
          # 显示版本信息
          curl -s http://localhost:9001/health | jq .
          
          # 清理
          docker stop test-bun-functions
          docker rm test-bun-functions
          
          echo "✅ Health check passed!"
