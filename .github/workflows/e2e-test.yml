name: E2E Integration Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ "ubuntu:22.04", "debian:12", "rockylinux:9" ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Management API Binary
        working-directory: ./packages/management-api
        run: |
          bun install
          bun run prebuild
          echo "[CI] 运行逻辑单元测试与 Mock 集成测试..."
          bun test
          bun run build:amd64

      - name: Run E2E Test in Container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.os }} \
            bash -c "
              # 1. 安装基础依赖
              if command -v apt-get >/dev/null; then
                apt-get update && apt-get install -y curl wget sudo kmod iproute2 openssh-server openssh-client
              elif command -v dnf >/dev/null; then
                dnf install -y --allowerasing epel-release curl wget sudo kmod iproute2 openssh-server openssh-clients
              elif command -v yum >/dev/null; then
                yum install -y --allowerasing epel-release curl wget sudo kmod iproute2 openssh-server openssh-clients
              fi

              # 2. 模拟系统环境 (假装有 systemd) 并启动 SSH
              mkdir -p /etc/supabase
              mkdir -p /run/sshd
              ssh-keygen -A
              /usr/sbin/sshd
              
              # 3. 运行安装测试
              cp packages/management-api/supacloud-linux-amd64 /usr/local/bin/supacloud
              chmod +x /usr/local/bin/supacloud
              
              echo '[CI] 验证版本...'
              supacloud --version
              
              echo '[CI] 开始完整安装流量测试...'
              # 安装脚本内部会自动触发 Doctor 巡检
              supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass
              
              echo '[CI] 安装流程逻辑路径验证完成！'
            "
