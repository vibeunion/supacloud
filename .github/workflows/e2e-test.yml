name: E2E Integration Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test_host:
    name: Test on Ubuntu Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Prepare SSH Environment
        run: |
          # 1. 生成并授权当前用户
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          
          # 2. 彻底开启 root 登录权限并授权
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/id_rsa.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh && sudo chmod 600 /root/.ssh/authorized_keys
          
          # 3. 物理强力覆盖 sshd 配置 (确保主配置绝对优先)
          sudo ssh-keygen -A # 确保主机密钥就绪
          
          # 彻底移除所有子配置目录，消除任何潜在的覆盖策略
          sudo rm -rf /etc/ssh/sshd_config.d/ || true
          
          # 在主配置文件最前面插入强制允许规则 (确保优先级最高)
          # 注意：此处不仅是加入规则，还要确保 AuthorizedKeysFile 指向 root 专用的路径
          sudo sed -i '1i PermitRootLogin yes' /etc/ssh/sshd_config
          sudo sed -i '1i PubkeyAuthentication yes' /etc/ssh/sshd_config
          sudo sed -i '1i AuthorizedKeysFile .ssh/authorized_keys' /etc/ssh/sshd_config
          
          # 重启服务并强制加载
          sudo systemctl daemon-reload || true
          sudo systemctl restart ssh || sudo service ssh restart || true
          
          # 检查当前生效的配置以供诊断
          echo "[SSHD CONFIG CHECK]"
          sudo sshd -T | grep -iE "permitrootlogin|pubkeyauthentication|authorizedkeysfile"
          
          # 4. 验证连通性
          # 使用 -o 强制使用生成的密钥，防止 agent 干扰
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa -vv root@127.0.0.1 "echo SSH Connection Verified"

      - name: Build and Test
        run: |
          cd packages/management-api
          bun install
          bun run prebuild
          bun run build:amd64
          sudo cp supacloud-linux-amd64 /usr/local/bin/supacloud
          sudo chmod +x /usr/local/bin/supacloud
          echo "[CI] 开始宿主机原生环境测试 (集成环境补丁已自动启动)..."
          sudo /usr/local/bin/supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass
          
          echo "[CI] 等待 API 启动并执行冒烟测试..."
          sleep 10
          curl -f http://127.0.0.1:8080/health || (echo "[ERROR] 冒烟测试失败！" && exit 1)
          echo "[SUCCESS] 宿主机冒烟测试通过！"

  test_container:
    name: Test on ${{ matrix.os }} Container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "debian:12"
            image: "geerlingguy/docker-debian12-ansible"
            init: "/lib/systemd/systemd"
          - os: "debian:11"
            image: "geerlingguy/docker-debian11-ansible"
            init: "/lib/systemd/systemd"
          - os: "ubuntu:22.04"
            image: "geerlingguy/docker-ubuntu2204-ansible"
            init: "/lib/systemd/systemd"
          - os: "rockylinux:9"
            image: "geerlingguy/docker-rockylinux9-ansible"
            init: "/usr/lib/systemd/systemd"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Build supacloud
        run: |
          cd packages/management-api
          bun install
          bun run prebuild
          bun run build:amd64
      - name: Run E2E Test in Container
        run: |
          docker rm -f e2e-node || true
          
          # 使用带 systemd 的专业镜像，并增加 cgroup v2 兼容参数
          docker run -d --name e2e-node --privileged \
            --workdir /root/supacloud \
            --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v ${{ github.workspace }}:/root/supacloud \
            ${{ matrix.image }} ${{ matrix.init }}
          
          echo "[CI] 容器 ${{ matrix.os }} (using ${{ matrix.image }}) 已启动，进行最后检查..."
          sleep 5
          docker inspect -f '{{.State.Running}}' e2e-node || { docker logs e2e-node; exit 1; }
          
          # 执行测试脚本
          docker exec -t e2e-node bash /root/supacloud/scripts/ci/container-test.sh
