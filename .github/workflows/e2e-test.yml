name: E2E Integration Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test_host:
    name: Test on Ubuntu Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Free Disk Space
        run: |
          sudo docker image prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Prepare SSH Environment
        run: |
          # 生成并授权当前用户
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          
          # 关键：开启 root 登录权限并授权
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/id_rsa.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh
          sudo chmod 600 /root/.ssh/authorized_keys
          
          # 修正 SSHD 配置以允许 root 密钥登录 (GitHub Runner 默认可能限制)
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          
          # 验证连通性
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no root@127.0.0.1 "echo SSH Connection Verified"

      - name: Build and Test
        run: |
          cd packages/management-api
          bun install
          bun run prebuild
          bun run build:amd64
          cp supacloud-linux-amd64 /usr/local/bin/supacloud
          chmod +x /usr/local/bin/supacloud
          echo "[CI] 开始宿主机原生环境测试..."
          # 宿主机上虽然通常不会忙，但为了环境一致性和鲁棒性，我们也注入一些安全参数
          export SUPACLOUD_ANSIBLE_ARGS="-e node_write_etc_hosts=false -e node_dns_method=none -vv"
          sudo -E /usr/local/bin/supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass

  test_container:
    name: Test on ${{ matrix.os }} (Docker Mocked)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ "ubuntu:22.04", "debian:12", "rockylinux:9" ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: Free Disk Space
        run: |
          sudo docker image prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Build Management API Binary
        working-directory: ./packages/management-api
        run: |
          bun install
          bun run prebuild
          bun run build:amd64

      - name: Run E2E Test in Container
        run: |
          # 确保脚本有执行权限
          chmod +x ./scripts/ci/container-test.sh
          # 使用更加健壮的执行方式：直接指向挂载的脚本文件
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.os }} \
            bash /workspace/scripts/ci/container-test.sh
