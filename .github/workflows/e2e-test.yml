name: E2E Integration Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test_host:
    name: Test on Ubuntu Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Free Disk Space
        run: |
          sudo docker image prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Prepare SSH Environment
        run: |
          # 1. 生成并授权当前用户
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          
          # 2. 关键：彻底开启 root 登录权限并授权
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/id_rsa.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh && sudo chmod 600 /root/.ssh/authorized_keys
          
          # 3. 强制覆盖所有可能的限制
          sudo ssh-keygen -A # 确保主机密钥就绪
          sudo sed -i 's/^PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
          
          # 清理 ubuntu 宿主机特有的限制覆盖文件（这是权限被拒的最核心原因）
          sudo rm -f /etc/ssh/sshd_config.d/*.conf || true
          
          sudo systemctl restart ssh || sudo service ssh restart
          
          # 4. 验证连通性
          ssh -o StrictHostKeyChecking=no root@127.0.0.1 "echo SSH Connection Verified"

      - name: Build and Test
        run: |
          cd packages/management-api
          bun install
          bun run prebuild
          bun run build:amd64
          sudo cp supacloud-linux-amd64 /usr/local/bin/supacloud
          sudo chmod +x /usr/local/bin/supacloud
          echo "[CI] 开始宿主机原生环境测试..."
          # 宿主机上同样需要注入环境兼容参数，防止误删源或尝试无意义的内核/服务操作
          export SUPACLOUD_ANSIBLE_ARGS="-e node_repo_remove=false -e node_write_etc_hosts=false -e node_dns_method=none -e node_tune=none -e node_kernel_modules=[] -e chrony_enabled=false -vv"
          sudo -E /usr/local/bin/supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass

  test_container:
    name: Test on ${{ matrix.os }} (Docker Mocked)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ "ubuntu:22.04", "debian:12", "rockylinux:9" ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: Free Disk Space
        run: |
          sudo docker image prune -af
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          df -h

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Build Management API Binary
        working-directory: ./packages/management-api
        run: |
          bun install
          bun run prebuild
          bun run build:amd64

      - name: Run E2E Test in Container
        run: |
          # 确保脚本有执行权限
          chmod +x ./scripts/ci/container-test.sh
          # 使用更加健壮的执行方式：直接指向挂载的脚本文件
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.os }} \
            bash /workspace/scripts/ci/container-test.sh
