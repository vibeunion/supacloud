name: E2E Integration Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test_host:
    name: Test on Ubuntu Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Prepare SSH Environment
        run: |
          # 1. 生成并授权当前用户
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys
          
          # 2. 彻底开启 root 登录权限并授权
          sudo mkdir -p /root/.ssh
          sudo cp ~/.ssh/id_rsa.pub /root/.ssh/authorized_keys
          sudo chmod 700 /root/.ssh && sudo chmod 600 /root/.ssh/authorized_keys
          
          # 3. 物理强力覆盖 sshd 配置
          sudo ssh-keygen -A # 确保主机密钥就绪
          
          # 删除所有配置干扰项
          sudo rm -f /etc/ssh/sshd_config.d/*.conf || true
          
          # 写入最宽松的配置
          echo "PermitRootLogin yes" | sudo tee /etc/ssh/sshd_config.d/00-allow-root.conf
          echo "PubkeyAuthentication yes" | sudo tee -a /etc/ssh/sshd_config.d/00-allow-root.conf
          echo "AuthorizedKeysFile .ssh/authorized_keys" | sudo tee -a /etc/ssh/sshd_config.d/00-allow-root.conf
          echo "PasswordAuthentication yes" | sudo tee -a /etc/ssh/sshd_config.d/00-allow-root.conf
          
          # 重启服务并强制加载
          sudo systemctl daemon-reload || true
          sudo systemctl restart ssh || sudo service ssh restart
          
          # 4. 验证连通性 (增加 -v 方便调试)
          ssh -o StrictHostKeyChecking=no -v root@127.0.0.1 "echo SSH Connection Verified"

      - name: Build and Test
        run: |
          cd packages/management-api
          bun install
          bun run prebuild
          bun run build:amd64
          sudo cp supacloud-linux-amd64 /usr/local/bin/supacloud
          sudo chmod +x /usr/local/bin/supacloud
          echo "[CI] 开始宿主机原生环境测试..."
          # 宿主机上同样需要注入环境兼容参数
          export SUPACLOUD_ANSIBLE_ARGS="-e node_repo_remove=false -e node_write_etc_hosts=false -e node_dns_method=none -e node_tune=none -e node_kernel_modules=[] -e chrony_enabled=false -vv"
          sudo -E /usr/local/bin/supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass

  test_container:
    name: Test on ${{ matrix.os }} Container
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: "debian:12"
            image: "geerlingguy/docker-debian12-ansible"
            init: "/lib/systemd/systemd"
          - os: "debian:11"
            image: "geerlingguy/docker-debian11-ansible"
            init: "/lib/systemd/systemd"
          - os: "ubuntu:24.04"
            image: "geerlingguy/docker-ubuntu2204-ansible" # 暂时用 22.04 稳定版，或寻找对应 24.04 版
            init: "/lib/systemd/systemd"
          - os: "rockylinux:9"
            image: "geerlingguy/docker-rockylinux9-ansible"
            init: "/usr/lib/systemd/systemd"
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Run E2E Test in Container
        run: |
          docker rm -f e2e-node || true
          
          # 使用带 systemd 的专业 Ansible 测试镜像
          docker run -d --name e2e-node --privileged \
            --workdir /root/supacloud \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            -v ${{ github.workspace }}:/root/supacloud \
            ${{ matrix.image }} ${{ matrix.init }}
          
          echo "[CI] 容器 ${{ matrix.os }} (using ${{ matrix.image }}) 已启动，等待系统初始化..."
          sleep 5
          
          # 执行测试脚本
          docker exec -t e2e-node bash /root/supacloud/scripts/ci/container-test.sh
