name: E2E Integration Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test_host:
    name: Test on Ubuntu Host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Build and Test
        run: |
          cd packages/management-api
          bun install
          bun run prebuild
          bun run build:amd64
          cp supacloud-linux-amd64 /usr/local/bin/supacloud
          chmod +x /usr/local/bin/supacloud
          echo "[CI] 开始宿主机原生环境测试..."
          sudo /usr/local/bin/supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass

  test_container:
    name: Test on ${{ matrix.os }} (Docker Mocked)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ "ubuntu:22.04", "debian:12", "rockylinux:9" ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v3
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
      - name: Build Management API Binary
        working-directory: ./packages/management-api
        run: |
          bun install
          bun run prebuild
          bun run build:amd64

      - name: Run E2E Test in Container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ${{ matrix.os }} \
            bash <<'EOF'
          set -e
          export DEBIAN_FRONTEND=noninteractive
          ln -fs /usr/share/zoneinfo/UTC /etc/localtime

          # 1. 安装基础依赖
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y curl wget sudo kmod iproute2 openssh-server openssh-client ansible
          elif command -v dnf >/dev/null; then
            dnf install -y --allowerasing epel-release curl wget sudo kmod iproute openssh-server openssh-clients ansible
          elif command -v yum >/dev/null; then
            yum install -y --allowerasing epel-release curl wget sudo kmod iproute openssh-server openssh-clients ansible
          fi

          # 2. 模拟系统环境 (关键：通过伪装指令绕过 Ansible/Pigsty 环境检查)
          mkdir -p /etc/supabase /run/sshd
          ssh-keygen -A
          
          # 批量生成模拟指令以适配 Ansible
          for cmd in systemctl hostnamectl timedatectl sysctl modprobe apparmor_status udevadm; do
            case "$cmd" in
              systemctl)
                cat <<'INNEREOF' > /usr/local/bin/systemctl
          #!/bin/bash
          [ "$1" = "daemon-reload" ] && exit 0
          echo "Simulating systemctl $@"
          exit 0
          INNEREOF
                ;;
              hostnamectl)
                cat <<'INNEREOF' > /usr/local/bin/hostnamectl
          #!/bin/bash
          echo "Static hostname: localhost"; echo "Icon name: computer-vm"; echo "Chassis: vm"; echo "Operating System: Linux"
          INNEREOF
                ;;
              timedatectl)
                cat <<'INNEREOF' > /usr/local/bin/timedatectl
          #!/bin/bash
          echo "Local time: $(date)"; echo "Time zone: UTC (UTC, +0000)"
          INNEREOF
                ;;
              sysctl|modprobe|udevadm)
                cat <<'INNEREOF' > "/usr/local/bin/$cmd"
          #!/bin/bash
          echo "Simulating $cmd $@"
          exit 0
          INNEREOF
                ;;
              apparmor_status)
                cat <<'INNEREOF' > /usr/local/bin/apparmor_status
          #!/bin/bash
          echo "apparmor module is not loaded."
          exit 0
          INNEREOF
                ;;
            esac
            chmod +x "/usr/local/bin/$cmd"
          done
          /usr/sbin/sshd
          
          # 3. 运行安装测试
          cp packages/management-api/supacloud-linux-amd64 /usr/local/bin/supacloud
          chmod +x /usr/local/bin/supacloud
          
          echo '[CI] 开始跨发行版容器集成测试...'
          /usr/local/bin/supacloud install --yes --ip 127.0.0.1 --domain api.local.nip.io --password ci-test-pass
          EOF
