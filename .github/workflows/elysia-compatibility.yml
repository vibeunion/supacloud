name: Elysia Compatibility

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main", "dev"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elysia-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Elysia dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Test dependency policy regressions
        run: node --test scripts/check-elysia-compatibility.test.mjs
      - name: Check declarations, schema tuple, lock metadata and templates
        run: node scripts/check-elysia-compatibility.mjs

  lockfiles:
    name: Elysia reproducible lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      # One-time repair; remove after reviewing/committing Bun-normalized output.
      # Reuse checked-in registry entries rather than silently updating ranges.
      - name: Seed inherited populated snapshots and their existing locked dependencies
        run: |
          bun --eval '
            import { existsSync, readFileSync, readdirSync, writeFileSync } from "node:fs";
            import { parseLockfile } from "./scripts/check-elysia-compatibility.mjs";
            const manifests = new Map();
            for (const entry of readdirSync("packages", { withFileTypes: true })) {
              const path = `packages/${entry.name}/package.json`;
              if (!entry.isDirectory() || !existsSync(path)) continue;
              const manifest = JSON.parse(readFileSync(path, "utf8"));
              manifests.set(manifest.name, manifest);
            }
            const db = parseLockfile(readFileSync("packages/db/bun.lock", "utf8"));
            const lite = parseLockfile(readFileSync("packages/supacloud-lite/bun.lock", "utf8"));
            for (const path of ["packages/elysia/bun.lock", "packages/supacloud-lite/bun.lock"]) {
              const lock = parseLockfile(readFileSync(path, "utf8"));
              for (const entry of Object.values(lock.packages)) {
                if (!Array.isArray(entry) || typeof entry[0] !== "string" || !entry[0].includes("@file:")) continue;
                if (!entry[1] || Object.keys(entry[1]).length === 0) continue;
                const name = entry[0].split("@file:")[0];
                const manifest = manifests.get(name);
                if (!manifest) throw new Error(`Missing local manifest: ${name}`);
                const metadata = {};
                for (const field of ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies", "bin"]) {
                  if (manifest[field] !== undefined) metadata[field] = manifest[field];
                }
                const optional = Object.entries(manifest.peerDependenciesMeta ?? {}).filter(([, value]) => value.optional).map(([name]) => name);
                if (optional.length) metadata.optionalPeers = optional;
                entry[1] = metadata;
              }
              if (path === "packages/elysia/bun.lock") {
                for (const name of ["libpg-query", "@pgsql/types"]) {
                  if (!db.packages[name]) throw new Error(`Missing locked DB dependency: ${name}`);
                  lock.packages[name] ??= db.packages[name];
                }
                for (const name of ["@types/node", "undici-types"]) {
                  if (!lite.packages[name]) throw new Error(`Missing locked app dependency: ${name}`);
                  lock.packages[name] = lite.packages[name];
                }
              }
              writeFileSync(path, JSON.stringify(lock, null, 2) + "\n");
            }
          '
      - name: Reconcile local dependency snapshots with the pinned Bun
        run: |
          bun --revision
          bun install --lockfile-only --ignore-scripts --cwd packages/elysia
          bun install --lockfile-only --ignore-scripts --cwd packages/supacloud-lite
      - name: Reject uncommitted lockfile changes
        run: |
          git diff --binary -- packages/elysia/bun.lock packages/supacloud-lite/bun.lock > elysia-lockfiles.patch
          git diff --exit-code -- packages/elysia/bun.lock packages/supacloud-lite/bun.lock
      - name: Preserve lockfile audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: elysia-lockfile-audit
          path: |
            packages/elysia/bun.lock
            packages/supacloud-lite/bun.lock
            elysia-lockfiles.patch
          retention-days: 3
          if-no-files-found: error

  conformance:
    name: Elysia beta runtime conformance
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Build local adapter dependencies
        run: bun run scripts/build-command-dependencies.ts elysia
      - name: Install the pinned adapter graph
        working-directory: packages/elysia
        run: bun install --frozen-lockfile
      - name: Verify beta HTTP and generated-contract behavior
        working-directory: packages/elysia
        run: |
          bun run generate:example
          bun run typecheck
          bun run typecheck:test
          bun run test:conformance
          bun test src/http-context.test.ts src/readme-context.test.ts
          bun run test:contract-upgrade
