name: Preserve empty optional GoTrue user fields

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: preserve-empty-auth-user-fields
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'fix/auth-cli-user-link-boundaries' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/auth-cli-user-link-boundaries
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Accept empty optional GoTrue user strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('packages/cli/src/shared/tools/auth-tools.ts')
          source = source_path.read_text(encoding='utf-8')
          source, count = re.subn(r'^\s*\|\| value\.length === 0\s*\n', '', source, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'optional user empty-string guard matched {count} times')
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('packages/cli/src/shared/tools/auth-tools.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    test("bounds auth search and email inputs before HTTP", async () => {'
          if tests.count(marker) != 1:
              raise SystemExit('auth test insertion marker did not match exactly once')
          added = '''    test("preserves empty optional email and phone fields from GoTrue", async () => {
              const userId = "00000000-0000-4000-8000-000000000002";
              const { callback } = captureAuthTool({
                  get: async () => ({
                      ok: true,
                      status: 200,
                      data: {
                          id: userId,
                          email: "",
                          phone: "",
                          created_at: "2026-08-18T00:00:00.000Z",
                          last_sign_in_at: null,
                      },
                  }),
              });

              const response = await callback({ action: "get_user", ref: "project-a", user_id: userId });

              expect(response.isError).not.toBe(true);
              expect(JSON.parse(response.content[0].text).user).toEqual({
                  id: userId,
                  email: "",
                  phone: "",
                  created_at: "2026-08-18T00:00:00.000Z",
                  last_sign_in_at: null,
              });
          });

          '''
          test_path.write_text(tests.replace(marker, added + marker, 1), encoding='utf-8')
          PY

      - name: Validate project CLI
        shell: bash
        run: |
          set -euo pipefail
          cd packages/cli
          bun install --frozen-lockfile
          bun test src/shared/tools/auth-tools.test.ts src/shared/execution-policy.test.ts
          bun run typecheck
          bun run build

      - name: Commit reviewed compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-auth-empty-user-fields.yml
          git diff --check
          git add -A
          git commit -m "fix(cli): preserve empty optional auth user fields"
          git push origin HEAD:fix/auth-cli-user-link-boundaries
