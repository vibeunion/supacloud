name: Apply project endpoint capability patch

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-project-endpoint-capability-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/project-endpoint-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: agent/project-endpoint-projection
          fetch-depth: 0

      - name: Apply delegated capability mapping
        run: python3 -B scripts/agent/fix-project-endpoint-capability.py

      - name: Commit fix and remove bootstrap files
        env:
          BRANCH: agent/project-endpoint-projection
        run: |
          set -euo pipefail
          git diff --check
          rm -f scripts/agent/fix-project-endpoint-capability.py
          rm -f .github/workflows/fix-project-endpoint-capability.yml
          rmdir scripts/agent 2>/dev/null || true
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(auth): authorize project endpoint reads"
          git push origin "HEAD:${BRANCH}"
