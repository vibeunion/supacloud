name: Framework verification workspace
on:
  push:
    branches: [feat/angular-defaults-completion]
    paths: [.github/workflows/framework-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare frozen dependencies without lifecycle scripts
        run: |
          for package in contracts app supacloud-js delivery compiler testing cli elysia commands db; do
            bun install --frozen-lockfile --ignore-scripts --cwd "packages/$package"
          done
      - name: Export only tracked source, installed packages and the test runtime
        run: |
          git archive HEAD > "$RUNNER_TEMP/framework-source.tar"
          mkdir -p "$RUNNER_TEMP/framework-tools"
          cp "$(command -v bun)" "$RUNNER_TEMP/framework-tools/bun"
          find packages -mindepth 2 -maxdepth 2 -type d -name node_modules -print0 > "$RUNNER_TEMP/framework-deps.list"
          tar --null -T "$RUNNER_TEMP/framework-deps.list" -czf "$RUNNER_TEMP/framework-deps.tgz"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: framework-workspace
          retention-days: 1
          compression-level: 0
          path: |
            ${{ runner.temp }}/framework-source.tar
            ${{ runner.temp }}/framework-deps.tgz
            ${{ runner.temp }}/framework-tools/bun
