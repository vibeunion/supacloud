name: Install Script Test

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "install.sh"
      - "switch.sh"
      - "scripts/**"
      - ".github/workflows/install-test-rhel.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "install.sh"
      - "switch.sh"
      - "scripts/**"

jobs:
  syntax-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Syntax check install.sh
        run: bash -n install.sh

      - name: Syntax check switch.sh
        run: bash -n switch.sh

      - name: Syntax check all helper scripts
        run: |
          for f in scripts/lib/*.sh; do
            echo "Checking $f ..."
            bash -n "$f"
          done

  shellcheck-lint:
    name: ShellCheck Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck -s bash -e SC2086,SC2034,SC2155,SC2046,SC2012 install.sh || true

      - name: Lint switch.sh
        run: shellcheck -s bash -e SC2086,SC2034,SC2155 switch.sh || true

      - name: Lint helper scripts
        run: shellcheck -s bash scripts/lib/*.sh || true

  function-verification:
    name: Function Verification on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - "quay.io/centos/centos:stream9"
          - "ubuntu:22.04"
          - "ubuntu:24.04"
          - "debian:12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify function definitions
        run: |
          # 确保脚本里定义了所有 main() 中调用到的函数
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            ${{ matrix.distro }} \
            /bin/bash -c '
              cd /workspace
              sed -i "s/\r$//" install.sh

              echo "=== Syntax Check ==="
              bash -n install.sh && echo "PASS: syntax ok" || { echo "FAIL: syntax error"; exit 1; }

              echo ""
              echo "=== Function Definition Check ==="
              # 提取 main() 中调用的函数名 (支持含数字的函数名如 install_s3_storage)
              CALLED=$(sed -n "/^main()/,/^}/p" install.sh | grep -oE "^[[:space:]]+[a-z_][a-z0-9_]*" | tr -d " " | sort -u)
              # 提取所有定义的函数名
              DEFINED=$(grep -oE "^[a-z_][a-z0-9_]*\(\)" install.sh | tr -d "()" | sort -u)

              MISSING=""
              for fn in $CALLED; do
                if ! echo "$DEFINED" | grep -qx "$fn"; then
                  # 排除内建命令和关键字
                  case "$fn" in
                    echo|if|fi|then|else|elif|for|while|do|done|case|esac|local|return|exit|cd|source|set|log_*) ;;
                    *) MISSING="$MISSING $fn" ;;
                  esac
                fi
              done

              if [ -n "$MISSING" ]; then
                echo "FAIL: Missing function definitions:$MISSING"
                exit 1
              else
                echo "PASS: All called functions are defined"
              fi
            '

      - name: Test pre-Pigsty installation steps
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e INTERNAL_IP=10.0.0.1 \
            -e SUPABASE_PUBLIC_DOMAIN=api.ci-test.local \
            -e SUPABASE_STUDIO_DOMAIN=studio.ci-test.local \
            -e DASHBOARD_PASSWORD=ci-test-pass \
            -e POSTGRES_PASSWORD=ci-test-db \
            -e GRAFANA_PASSWORD=ci-test-grafana \
            -e EDGE_RUNTIME=deno \
            ${{ matrix.distro }} \
            /bin/bash -c '
              cd /workspace
              sed -i "s/\r$//" install.sh config.env

              # 加载函数定义
              source config.env
              source install.sh 2>/dev/null || true

              echo "========================================="
              echo "  Testing: install_base_dependencies"
              echo "========================================="
              install_base_dependencies && echo "PASS" || { echo "FAIL"; exit 1; }

              echo ""
              echo "========================================="
              echo "  Testing: setup_local_ssh"
              echo "========================================="
              setup_local_ssh && echo "PASS" || { echo "FAIL"; exit 1; }

              echo ""
              echo "========================================="
              echo "  Testing: configure_edge_runtime"
              echo "========================================="
              configure_edge_runtime && echo "PASS" || { echo "FAIL"; exit 1; }

              echo ""
              echo "========================================="
              echo "  All SupaCloud pre-Pigsty steps PASSED"
              echo "========================================="
            '

      - name: Test Pigsty download and bootstrap
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -e INTERNAL_IP=10.0.0.1 \
            -e PIGSTY_VERSION=v4.1.0 \
            ${{ matrix.distro }} \
            /bin/bash -c '
              cd /workspace
              sed -i "s/\r$//" install.sh config.env
              source config.env
              source install.sh 2>/dev/null || true

              # 测试 Pigsty 下载
              install_base_dependencies
              cd ~
              if [[ ! -f ~/pigsty/bootstrap ]]; then
                rm -rf ~/pigsty
                curl -fsSL https://repo.pigsty.io/get | bash -s "${PIGSTY_VERSION:-v4.1.0}"
              fi

              echo "PASS: Pigsty downloaded"
              ls -la ~/pigsty/bootstrap

              # 运行 bootstrap — 必须完全通过
              cd ~/pigsty && ./bootstrap
              echo "PASS: Pigsty bootstrap completed"
            '
