name: CNB issue diagnostics

on:
  push:
    branches:
      - agent/secure-cnb-relay-20260819
    paths:
      - .github/workflows/issue-diagnostics.yml

permissions:
  contents: write

env:
  REPORT_BRANCH: agent/secure-cnb-relay-20260819

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Collect deterministic grep reports
        run: |
          set -euo pipefail
          out=/tmp/supacloud-diagnostics-v3
          mkdir -p "$out"
          printf 'HEAD %s\nGREP %s\n' "$(git rev-parse HEAD)" "$(command -v grep)" > "$out/meta.txt"

          scan() {
            local name=$1 pattern=$2
            shift 2
            {
              printf 'PATTERN %s\n\n' "$pattern"
              grep -RInEi \
                --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target \
                --exclude-dir=dist --exclude-dir=build --exclude-dir=.svelte-kit \
                --exclude='*.lock' --exclude='pnpm-lock.yaml' --exclude='package-lock.json' \
                -- "$pattern" "$@" 2>/dev/null | head -n 2500 || true
            } > "$out/$name.txt"
          }

          scan frontend 'onAuthStateChange|redirecting|正在重定向|/projects|settings/general|SIGNED_OUT|TOKEN_REFRESHED|INITIAL_SESSION|subscription.{0,40}debugger' packages/web-console
          scan grafana 'grafana|GF_SERVER|serve_from_sub_path|root_url|pgsql-overview' packages docker infra infrastructure scripts docs config.env setup.sh install.sh
          scan realtime 'provision_realtime|realtime.{0,60}(unavailable|available|health|poll|task|provision)|polling|websocket|task.{0,30}center|task_center' packages docker infra infrastructure scripts docs
          scan stats 'table_count|index_count|relation_count|pg_class|pg_tables|pg_stat_user|information_schema\.tables|database.{0,40}stat|dashboard.{0,40}stat' packages docker infra infrastructure scripts docs
          scan auth 'Missing tenant reference|tenant reference|tenant_ref|tenant-ref|x-tenant|x-project|project-ref|grant_type|auth/v1/token|tenant.{0,30}header' packages docker infra infrastructure scripts docs
          scan functions 'edge.?function|function.{0,50}deploy|deploy.{0,50}function|functions/v1|function_deploy|function-deploy|storage.{0,40}500' packages docker infra infrastructure scripts docs
          scan tls 'SupaCloud Generated|self.?signed|mkcert|certificate|TLS|HTTPS|trust.{0,30}cert|ca\.crt|ca\.pem' packages docker infra infrastructure scripts docs

      - name: Publish reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            local source=$1 path=$2 content payload
            content=$(base64 -w0 "$source")
            payload=$(jq -n --arg message 'chore: publish CNB issue diagnostics v3' --arg content "$content" --arg branch "$REPORT_BRANCH" '{message:$message,content:$content,branch:$branch}')
            curl --fail-with-body --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${path}" \
              --data "$payload" >/dev/null
          }
          for file in /tmp/supacloud-diagnostics-v3/*.txt; do
            publish "$file" ".secure-relay/diagnostics-v3/$(basename "$file")"
          done
