name: Management API CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - "packages/web-console/**"
      - "packages/supacloud-js/**"
      - "packages/edge-runtime/**"
      - "docker/**"
      - "scripts/**"
      - "install.sh"
      - "setup.sh"
      - "switch.sh"
      - ".github/workflows/management-api.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - "packages/web-console/**"
      - "packages/supacloud-js/**"
      - "packages/edge-runtime/**"
      - "docker/**"
      - "scripts/**"
      - "install.sh"
      - "setup.sh"
      - "switch.sh"
      - ".github/workflows/management-api.yml"
  workflow_dispatch:

# Demo JWT signed with the Supabase public demo key (not a real credential).
# Source: https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys
# gitleaks:allow
env:
  NODE_VERSION: "24.x"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # noqa: hardcoded-jwt — these are the Supabase public demo keys used for local/CI testing only
  # Source: https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys
  SUPABASE_DEMO_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" # gitleaks:allow
  SUPABASE_DEMO_SERVICE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU" # gitleaks:allow

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Type check
        working-directory: packages/management-api
        run: bun run tsc --noEmit

  package-checks:
    name: Package Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Check web console
        working-directory: packages/web-console
        run: |
          bun install
          bun run check

      - name: Check SupaCloud JS SDK
        working-directory: packages/supacloud-js
        run: |
          bun install
          bun run typecheck
          bun run typecheck:test
          bun test src/index.test.ts

      - name: Check edge runtime
        working-directory: packages/edge-runtime
        run: |
          bun install
          bun run typecheck

  docker-and-scripts-checks:
    name: Docker & Scripts Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker/dev/docker-compose.yml config --quiet
          docker compose -f docker/self-host/docker-compose.yml config --quiet

      - name: Validate Kong declarative configs
        run: |
          docker run --rm \
            -e KONG_DATABASE=off \
            -v "$PWD/docker/dev/kong/kong.yml:/kong.yml:ro" \
            kong:3.9 kong config parse /kong.yml
          docker run --rm \
            -e KONG_DATABASE=off \
            -v "$PWD/docker/self-host/kong/kong.yml:/kong.yml:ro" \
            kong:3.9 kong config parse /kong.yml

      - name: Validate shell script syntax
        run: |
          bash -n install.sh setup.sh switch.sh deploy_all.sh scripts/pre_start_recovery.sh
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Run unit tests
        working-directory: packages/management-api
        run: |
          bun test tests/unit/sdk-proxy.functions.test.ts
          bun test $(find tests/unit -name "*.test.ts" ! -name "sdk-proxy.functions.test.ts" | sort)

  integration-test:
    name: Integration & Compliance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.6.1.107
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgrest:
        image: postgrest/postgrest:latest
        ports:
          - 3000:3000
        env:
          PGRST_DB_URI: postgres://supabase_admin:postgres@postgres:5432/postgres
          PGRST_DB_SCHEMA: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      gotrue:
        image: supabase/gotrue:v2.188.1
        ports:
          - 9999:9999
        env:
          GOTRUE_LOG_LEVEL: info
          GOTRUE_API_HOST: 0.0.0.0
          GOTRUE_API_PORT: 9999
          GOTRUE_SITE_URL: http://127.0.0.1:9090
          GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:9090
          GOTRUE_DB_DRIVER: postgres
          GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:postgres@postgres:5432/postgres
          GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          GOTRUE_JWT_AUD: authenticated
          GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
          GOTRUE_JWT_EXP: 3600
          GOTRUE_MAILER_AUTOCONFIRM: "true"
          GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
          GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
          GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
          GOTRUE_PASSWORD_MIN_LENGTH: "6"
          API_EXTERNAL_URL: http://127.0.0.1:9090
          GOTRUE_OPERATOR_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
      realtime:
        image: supabase/realtime:latest
        ports:
          - 4000:4000
        env:
          PORT: 4000
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: supabase_admin
          DB_PASSWORD: postgres
          DB_SSL: "false"
          DB_ENC_KEY: supabaserealtime
          JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          SECRET_KEY_BASE: super-secret-jwt-token-with-at-least-32-characters-long-realtime-base
          METRICS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          REPLICATION_MODE: RLS
          REPLICATION_POLL_INTERVAL: 100
          ERL_AFLAGS: -proto_dist inet_tcp
          DNS_NODES: "''"
          APP_NAME: realtime
          SEED_SELF_HOST: "true"
          RLIMIT_NOFILE: "10000"
      minio:
        image: minio/minio:latest
        ports:
          - 9001:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: |
          bun install
          cd ../edge-runtime && bun install

      - name: Initialize Database
        working-directory: packages/management-api
        run: bun src/db/init.ts
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres

      - name: Wait for CI services
        run: |
          echo "Waiting for Realtime container to be ready..."
          JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long"
          for i in $(seq 1 30); do
            # Check the health endpoint for the self-seeded tenant
            if curl -sf -H "Authorization: Bearer ${JWT_SECRET}" "http://127.0.0.1:4000/api/tenants/realtime-dev/health" > /dev/null 2>&1; then
              echo "✅ Realtime self-hosted tenant is ready"
              break
            elif curl -sf "http://127.0.0.1:4000/health" > /dev/null 2>&1; then
              echo "✅ Realtime container is ready (basic health)"
              break
            fi
            echo "  Attempt $i/30: Realtime not ready, waiting 2s..."
            sleep 2
          done
          echo "Waiting for MinIO container to be ready..."
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:9001/minio/health/live > /dev/null 2>&1; then
              echo "✅ MinIO is ready"
              break
            fi
            echo "  Attempt $i/15: MinIO not ready, waiting 2s..."
            sleep 2
          done

      - name: Setup CI Tenant Bridge
        working-directory: packages/management-api
        run: |
          echo "🌉 Setting up CI Tenant Bridge..."
          bun run tests/scripts/ci-tenant-bridge.ts
          echo "✅ CI Tenant Bridge configured."
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres
          MASTER_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
          TEST_SUPABASE_ANON_KEY: ${{ env.SUPABASE_DEMO_ANON_KEY }}
          TEST_SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_DEMO_SERVICE_KEY }}
          CI: "true"
          NODE_ENV: test
          S3_ENDPOINT: http://127.0.0.1:9001
          S3_REGION: us-east-1
          STORAGE_TYPE: s3
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_FORCE_PATH_STYLE: true

      - name: Restart flaky services
        run: |
          echo "Restarting Auth and Realtime Containers..."
          docker start $(docker ps -a -q --filter "ancestor=supabase/gotrue:v2.188.1") || true
          docker start $(docker ps -a -q --filter "ancestor=supabase/realtime:latest") || true
          sleep 4

      - name: Launch API & Execute Full Defenses
        working-directory: packages/management-api
        run: |
          echo "Starting Management API in background..."
          bun src/index.ts > api-server.log 2>&1 &
          PID=$!
          sleep 4
          curl -sf http://127.0.0.1:9090/health || (echo "API failed to start. Logs:" && cat api-server.log && exit 1)

          echo "===== RUNNING E2E SNAPSHOTS ====="
          bun test tests/e2e || (echo "::error title=E2E Failed! Server Logs::$(tail -n 50 api-server.log | awk '{printf "%s%%0A", $0}')" && cat api-server.log && exit 1)

          echo "===== RUNNING SDK PARITY TESTS (hard gate) ====="
          bun test tests/integration/sdk-parity.test.ts || (echo "::error title=SDK Parity Failed::SDK parity tests failed. Check sdk-parity.test.ts output above." && exit 1)

          echo "===== RUNNING OFFICIAL SDK PARITY PIPELINE ====="
          bun run tests/scripts/run-official-sdk-compliance.ts || (echo "::error title=Official SDK Parity Failed::Server Logs below:"; cat api-server.log; exit 1)

          sleep 2
          curl -sf http://127.0.0.1:9090/health || echo "⚠️ API health check failed between phases"

          echo "===== RUNNING OFFICIAL CLI COMPLIANCE ====="
          bun run tests/scripts/run-official-cli-compliance.ts

          sleep 2
          curl -sf http://127.0.0.1:9090/health || echo "⚠️ API health check failed between phases"

          echo "===== RUNNING OPENAPI SCHEMA CRAWLER ====="
          bun run tests/scripts/run-openapi-compliance.ts
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres
          PORT: 9090
          TEST_FIXED_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          TEST_SUPABASE_URL: http://127.0.0.1:9090
          TEST_SUPABASE_ANON_KEY: ${{ env.SUPABASE_DEMO_ANON_KEY }}
          TEST_SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_DEMO_SERVICE_KEY }}
          MASTER_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
          CI: "true"
          NODE_ENV: test
          S3_ENDPOINT: http://127.0.0.1:9001
          S3_REGION: us-east-1
          STORAGE_TYPE: s3
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_FORCE_PATH_STYLE: true

  shell-scripts-lint:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          ignored_rules="SC1090,SC1091,SC2012,SC2015,SC2034,SC2046,SC2086,SC2155,SC2207,SC2317"

          echo "=== Checking scripts/*.sh and scripts/lib/*.sh ==="
          shellcheck -s bash -e "$ignored_rules" scripts/*.sh scripts/lib/*.sh

          echo "=== Checking root shell scripts ==="
          root_scripts=()
          for script in install.sh setup.sh switch.sh deploy_all.sh supacloud; do
            if [ -f "$script" ]; then
              root_scripts+=("$script")
            fi
          done
          shellcheck -s bash -e "$ignored_rules" "${root_scripts[@]}"

  build-binaries:
    name: Build Binaries
    needs: [lint-and-typecheck, package-checks, docker-and-scripts-checks, unit-test, integration-test, shell-scripts-lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Build Linux primary binaries
        working-directory: packages/management-api
        run: |
          mkdir -p dist
          bun run build:linux
          mv supacloud-linux-amd64 dist/
          mv supacloud-linux-arm64 dist/

      - name: Build macOS developer binaries
        working-directory: packages/management-api
        run: |
          bun run build:macos
          mv supacloud-macos-amd64 dist/
          mv supacloud-macos-arm64 dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: supacloud-binaries-linux-primary-macos-dev
          path: packages/management-api/dist/*
          retention-days: 7
