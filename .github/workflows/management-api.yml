name: Management API CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - ".github/workflows/management-api.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Type check
        working-directory: packages/management-api
        run: bun run tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Run tests
        working-directory: packages/management-api
        run: bun test

  shell-scripts-lint:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "=== Checking scripts/lib/*.sh ==="
          shellcheck -s bash scripts/lib/*.sh || true

          echo "=== Checking install.sh ==="
          shellcheck -s bash -e SC2086,SC2034,SC2155,SC2046,SC2012 install.sh || true

          echo "=== Checking switch.sh ==="
          shellcheck -s bash -e SC2086,SC2034,SC2155 switch.sh || true

          echo "=== Checking supacloud CLI ==="
          shellcheck -s bash supacloud || true

