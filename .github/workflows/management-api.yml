name: Management API CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - ".github/workflows/management-api.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
  workflow_dispatch:

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Type check
        working-directory: packages/management-api
        run: bun run tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:17.6.1.107
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgrest:
        image: postgrest/postgrest:latest
        ports:
          - 3000:3000
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
          PGRST_DB_SCHEMA: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      gotrue:
        image: supabase/gotrue:v2.188.1
        ports:
          - 9999:9999
        env:
          GOTRUE_LOG_LEVEL: info
          GOTRUE_API_HOST: 0.0.0.0
          GOTRUE_API_PORT: 9999
          GOTRUE_SITE_URL: http://127.0.0.1:9090
          GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:9090
          GOTRUE_DB_DRIVER: postgres
          GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          GOTRUE_JWT_AUD: authenticated
          GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
          GOTRUE_JWT_EXP: 3600
          GOTRUE_MAILER_AUTOCONFIRM: "true"
          GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
          GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
          GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
          GOTRUE_PASSWORD_MIN_LENGTH: "6"
          API_EXTERNAL_URL: http://127.0.0.1:9090
          GOTRUE_OPERATOR_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
      realtime:
        image: supabase/realtime:latest
        ports:
          - 4000:4000
        env:
          PORT: 4000
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          REPLICATION_MODE: RLS
          REPLICATION_POLL_INTERVAL: 100
          SECRET_KEY_BASE: super-secret-jwt-token-with-at-least-32-characters-long-realtime-base
      minio:
        image: minio/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        command: server /data

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: |
          bun install
          cd ../edge-runtime && bun install

      - name: Initialize Database
        working-directory: packages/management-api
        run: bun src/db/init.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Run tests
        working-directory: packages/management-api
        run: |
          bun src/index.ts &
          sleep 3
          bun test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_FIXED_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_REGION: us-east-1
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_FORCE_PATH_STYLE: true

  shell-scripts-lint:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "=== Checking scripts/lib/*.sh ==="
          shellcheck -s bash scripts/lib/*.sh || true

          echo "=== Checking install.sh ==="
          shellcheck -s bash -e SC2086,SC2034,SC2155,SC2046,SC2012 install.sh || true

          echo "=== Checking switch.sh ==="
          shellcheck -s bash -e SC2086,SC2034,SC2155 switch.sh || true

          echo "=== Checking supacloud CLI ==="
          shellcheck -s bash supacloud || true

  build-binaries:
    name: Build Binaries
    needs: [lint-and-typecheck, unit-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Build all platforms
        working-directory: packages/management-api
        run: |
          # 确保构建目录存在
          mkdir -p dist
          # 执行编译指令 (amd64, arm64, macos)
          bun run build:amd64
          bun run build:arm64
          bun run build:macos-amd64
          bun run build:macos-arm64
          # 将产物移动到统一目录
          mv supacloud-linux-amd64 dist/
          mv supacloud-linux-arm64 dist/
          mv supacloud-macos-amd64 dist/
          mv supacloud-macos-arm64 dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supacloud-binaries
          path: packages/management-api/dist/*
          retention-days: 7


