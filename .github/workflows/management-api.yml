name: Management API CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - ".github/workflows/management-api.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Type check
        working-directory: packages/management-api
        run: bun run tsc --noEmit

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Run tests
        working-directory: packages/management-api
        run: bun test

  shell-scripts-lint:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          echo "=== Checking scripts/lib/*.sh ==="
          shellcheck -s bash scripts/lib/*.sh || true

          echo "=== Checking install.sh ==="
          shellcheck -s bash -e SC2086,SC2034,SC2155,SC2046,SC2012 install.sh || true

          echo "=== Checking switch.sh ==="
          shellcheck -s bash -e SC2086,SC2034,SC2155 switch.sh || true

          echo "=== Checking supacloud CLI ==="
          shellcheck -s bash supacloud || true

  build-binaries:
    name: Build Binaries
    needs: [lint-and-typecheck, unit-test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Build all platforms
        working-directory: packages/management-api
        run: |
          # 确保构建目录存在
          mkdir -p dist
          # 执行编译指令 (amd64, arm64, macos)
          bun run build:amd64
          bun run build:arm64
          bun run build:macos-amd64
          bun run build:macos-arm64
          # 将产物移动到统一目录
          mv supacloud-linux-amd64 dist/
          mv supacloud-linux-arm64 dist/
          mv supacloud-macos-amd64 dist/
          mv supacloud-macos-arm64 dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supacloud-binaries
          path: packages/management-api/dist/*
          retention-days: 7


