name: Management API CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - "packages/web-console/**"
      - "packages/supacloud-js/**"
      - "packages/edge-runtime/**"
      - "packages/admin/**"
      - "packages/cli/**"
      - "packages/supacloud/**"
      - "docker/**"
      - "scripts/**"
      - "install.sh"
      - "setup.sh"
      - "switch.sh"
      - ".github/scripts/**"
      - ".github/workflows/ai-review-merge.yml"
      - ".github/workflows/management-api.yml"
      - ".github/workflows/release-please.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "packages/management-api/**"
      - "packages/web-console/**"
      - "packages/supacloud-js/**"
      - "packages/edge-runtime/**"
      - "packages/admin/**"
      - "packages/cli/**"
      - "packages/supacloud/**"
      - "docker/**"
      - "scripts/**"
      - "install.sh"
      - "setup.sh"
      - "switch.sh"
      - ".github/scripts/**"
      - ".github/workflows/ai-review-merge.yml"
      - ".github/workflows/management-api.yml"
      - ".github/workflows/release-please.yml"
  workflow_dispatch:

permissions:
  contents: read

# Demo JWT signed with the Supabase public demo key (not a real credential).
# Source: https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys
# gitleaks:allow
env:
  NODE_VERSION: "24.x"
  BUN_VERSION: "1.3.14"
  XCADDY_VERSION: "v0.4.5"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # noqa: hardcoded-jwt — these are the Supabase public demo keys used for local/CI testing only
  # Source: https://supabase.com/docs/guides/self-hosting/docker#generate-api-keys
  SUPABASE_DEMO_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0" # gitleaks:allow
  SUPABASE_DEMO_SERVICE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU" # gitleaks:allow

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: packages/management-api
        run: bun run tsc --noEmit

      - name: Audit Management API dependencies
        working-directory: packages/management-api
        run: bun audit --audit-level high

      - name: Check Swagger route coverage
        working-directory: packages/management-api
        run: bun run scripts/check-swagger-coverage.ts --strict

  package-checks:
    name: Package Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Check web console
        working-directory: packages/web-console
        run: |
          bun install --frozen-lockfile
          bun test src
          bun run check
          bun run build
          bun audit --audit-level high

      - name: Check SupaCloud JS SDK
        working-directory: packages/supacloud-js
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run typecheck:test
          bun run build
          bun run typecheck:consumer
          bun test src/index.test.ts src/auth-fetch.test.ts
          bun audit --audit-level high

      - name: Check edge runtime
        working-directory: packages/edge-runtime
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun audit --audit-level high

      - name: Check project CLI
        working-directory: packages/cli
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test src
          bun run build
          bun audit --audit-level high

      - name: Check admin CLI
        working-directory: packages/admin
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test src
          bun run build
          bun audit --audit-level high

      - name: Check unified supacloudctl CLI
        working-directory: packages/supacloud
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          content_install_mode="$(bun -e '
            const pkg = await Bun.file("package.json").json();
            const cli = await Bun.file("../cli/package.json").json();
            const admin = await Bun.file("../admin/package.json").json();
            const lock = await Bun.file("bun.lock").text();
            const dependenciesMatchCandidates =
              pkg.dependencies["@supacloud/cli"] === `^${cli.version}` &&
              pkg.dependencies["@supacloud/admin"] === `^${admin.version}`;
            const lockHasCandidates =
              lock.includes(`@supacloud/cli@${cli.version}`) &&
              lock.includes(`@supacloud/admin@${admin.version}`);
            console.log(dependenciesMatchCandidates && !lockHasCandidates ? "local-candidate" : "frozen");
          ')"
          trusted_release_context=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]] ||
             [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_AUTHOR" == "github-actions[bot]" && "${GITHUB_HEAD_REF:-}" == release-please--branches--* ]]; then
            trusted_release_context=true
          fi
          install_mode="frozen"
          if [[ "$trusted_release_context" == "true" && "$content_install_mode" == "local-candidate" ]]; then
            install_mode="local-candidate"
          fi
          if [[ "$install_mode" == "local-candidate" ]]; then
            # Release 提升 sibling 包版本时，锁文件会暂时落后；使用同一提交中的候选包验证。
            bun -e '
              const pkg = await Bun.file("package.json").json();
              const cli = await Bun.file("../cli/package.json").json();
              const admin = await Bun.file("../admin/package.json").json();
              if (pkg.dependencies["@supacloud/cli"] !== `^${cli.version}` ||
                  pkg.dependencies["@supacloud/admin"] !== `^${admin.version}`) {
                throw new Error("supacloud dependency versions do not match local release candidates");
              }
            '
            bun add --no-save '@supacloud/cli@file:../cli' '@supacloud/admin@file:../admin'
            git diff --exit-code -- package.json bun.lock
          else
            bun install --frozen-lockfile
          fi
          bun run typecheck
          bun test src/index.test.ts
          bun run build
          bun audit --audit-level high

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: supacloud-sbom.cdx.json
          upload-artifact: true

  docker-and-scripts-checks:
    name: Docker & Scripts Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker/dev/docker-compose.yml config --quiet
          docker compose -f docker/self-host/docker-compose.yml config --quiet

      - name: Validate shell script syntax
        run: |
          bash -n install.sh setup.sh switch.sh deploy_all.sh scripts/pre_start_recovery.sh
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n
          bash scripts/lib/tenant_runtime.test.sh

      - name: Validate AI review script
        run: |
          node --check .github/scripts/ai-review-merge.mjs
          node --test .github/scripts/ai-review-merge.test.mjs

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install --frozen-lockfile

      - name: Check canonical SQL modules
        working-directory: packages/management-api
        run: bun run sql:check

      - name: Enforce canonical SQL module coverage
        working-directory: packages/management-api
        run: bun run test:sql-modules

      - name: Compile management API
        working-directory: packages/management-api
        run: bun run build:amd64

      - name: Run unit tests
        working-directory: packages/management-api
        run: bun run test:unit

  postgres-18-compatibility:
    name: SupaCloud PostgreSQL 18 Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: ci-jwt-secret-with-at-least-32-characters
      MASTER_TOKEN: ci-master-token-with-at-least-32-characters
      SECRETS_ENCRYPTION_KEY: ci-encryption-key-with-at-least-32-characters
      DASHBOARD_PASSWORD: ci-dashboard-password

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build and start SupaCloud PostgreSQL 18
        run: docker compose -f docker/self-host/docker-compose.yml up -d --build postgres

      - name: Wait for SupaCloud PostgreSQL 18
        run: |
          ready=false
          container="$(docker compose -f docker/self-host/docker-compose.yml ps -q postgres)"
          test -n "$container"
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = "healthy" ]; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = "true"

      - name: Install Management API dependencies
        working-directory: packages/management-api
        run: bun install --frozen-lockfile

      - name: Initialize Docker metadata database
        working-directory: packages/management-api
        env:
          NODE_ENV: development
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        # This job validates the metadata/compatibility path, not the separate
        # E2E Storage fixture that init.ts enables when CI variables are set.
        run: env -u CI -u GITHUB_ACTIONS bun src/db/init.ts

      - name: Apply and verify Docker PostgreSQL compatibility
        env:
          SUPACLOUD_META_DB: postgres
          LOGFLARE_DB_OWNER: postgres
          SUPACLOUD_DOCKER_SKIP_MANAGEMENT_INIT: "true"
          SUPACLOUD_DOCKER_BACKUP_DIR: /tmp/supacloud-postgres-backups
        run: |
          bash scripts/upgrade_postgres_docker_4_4_compat.sh --dry-run
          bash scripts/upgrade_postgres_docker_4_4_compat.sh --apply
          bash scripts/upgrade_postgres_docker_4_4_compat.sh --check
          test -n "$(find /tmp/supacloud-postgres-backups -type f -name '*.sql' -size +0c -print -quit)"

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker compose -f docker/self-host/docker-compose.yml logs --no-color postgres

      - name: Stop PostgreSQL 18 fixture
        if: always()
        run: docker compose -f docker/self-host/docker-compose.yml down

  integration-test:
    name: Integration & Compliance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Upstream Supabase compatibility fixture only. SupaCloud deployment remains PostgreSQL 18.
        image: supabase/postgres:17.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgrest:
        image: postgrest/postgrest:v14.15
        ports:
          - 3000:3000
        env:
          PGRST_DB_URI: postgres://supabase_admin:postgres@postgres:5432/postgres
          PGRST_DB_SCHEMA: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      gotrue:
        image: supabase/gotrue:v2.193.0
        ports:
          - 9999:9999
        env:
          GOTRUE_LOG_LEVEL: info
          GOTRUE_API_HOST: 0.0.0.0
          GOTRUE_API_PORT: 9999
          GOTRUE_SITE_URL: http://127.0.0.1:9090
          GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:9090
          GOTRUE_DB_DRIVER: postgres
          GOTRUE_DB_DATABASE_URL: postgres://supabase_admin:postgres@postgres:5432/postgres
          GOTRUE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          GOTRUE_JWT_AUD: authenticated
          GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
          GOTRUE_JWT_EXP: 3600
          GOTRUE_MAILER_AUTOCONFIRM: "true"
          GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
          GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
          GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
          GOTRUE_PASSWORD_MIN_LENGTH: "6"
          API_EXTERNAL_URL: http://127.0.0.1:9090
          GOTRUE_OPERATOR_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
      realtime:
        image: public.ecr.aws/supabase/realtime:v2.116.1
        ports:
          - 4000:4000
        env:
          PORT: 4000
          DB_HOST: postgres
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: supabase_admin
          DB_PASSWORD: postgres
          DB_USER_REALTIME: supabase_admin
          DB_PASS_REALTIME: postgres
          DB_SSL: "false"
          DB_ENC_KEY: supabaserealtime
          JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          API_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          SECRET_KEY_BASE: super-secret-jwt-token-with-at-least-32-characters-long-realtime-base
          METRICS_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          REPLICATION_MODE: RLS
          REPLICATION_POLL_INTERVAL: 100
          ERL_AFLAGS: -proto_dist inet_tcp
          DNS_NODES: "''"
          APP_NAME: realtime
          SEED_SELF_HOST: "true"
          RUN_JANITOR: "false"
          RLIMIT_NOFILE: "10000"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Start MinIO fixture
        run: |
          docker run --detach --rm \
            --name supacloud-ci-minio \
            --publish 9001:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data

      - name: Show runtime versions
        run: |
          node --version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: |
          bun install --frozen-lockfile
          cd ../edge-runtime && bun install --frozen-lockfile

      - name: Initialize Database
        working-directory: packages/management-api
        run: bun src/db/init.ts
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres

      - name: Wait for CI services
        run: |
          echo "Waiting for Realtime container to be ready..."
          JWT_SECRET="super-secret-jwt-token-with-at-least-32-characters-long"
          # Realtime v2.111+ validates Bearer tokens as HS256 JWTs signed with API_JWT_SECRET;
          # passing the raw secret returns 403. Sign an admin JWT for the health probe.
          REALTIME_ADMIN_TOKEN="$(JWT_SECRET="${JWT_SECRET}" node -e 'const crypto=require("node:crypto");const s=process.env.JWT_SECRET;const n=Math.floor(Date.now()/1000);const e=v=>Buffer.from(JSON.stringify(v)).toString("base64url");const h=e({alg:"HS256",typ:"JWT"});const p=e({iss:"supabase",role:"supabase_admin",iat:n,exp:n+3600});const sig=crypto.createHmac("sha256",s).update(`${h}.${p}`).digest("base64url");console.log(`${h}.${p}.${sig}`);')"
          realtime_ready=false
          for i in $(seq 1 60); do
            # Check the health endpoint for the self-seeded tenant
            if curl -sf -H "Authorization: Bearer ${REALTIME_ADMIN_TOKEN}" "http://127.0.0.1:4000/api/tenants/realtime-dev/health" > /dev/null 2>&1; then
              echo "✅ Realtime self-hosted tenant is ready"
              realtime_ready=true
              break
            elif curl -sf "http://127.0.0.1:4000/healthcheck" > /dev/null 2>&1; then
              echo "✅ Realtime container is ready (basic health)"
              realtime_ready=true
              break
            fi
            echo "  Attempt $i/60: Realtime not ready, waiting 2s..."
            sleep 2
          done
          if [ "${realtime_ready}" != "true" ]; then
            echo "::error title=Realtime service not ready::Realtime did not become reachable on :4000"
            docker ps -a --filter "ancestor=public.ecr.aws/supabase/realtime:v2.116.1" || true
            realtime_container_id="$(docker ps -a -q --filter "ancestor=public.ecr.aws/supabase/realtime:v2.116.1" | head -n1)"
            if [ -n "${realtime_container_id}" ]; then
              echo "--- Realtime container status ---"
              docker inspect --format='{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}} oom={{.State.OOMKilled}} restart={{.RestartCount}}' "${realtime_container_id}" || true
              echo "--- Realtime container logs (last 200 lines) ---"
              docker logs --tail 200 "${realtime_container_id}" || true
            fi
            exit 1
          fi
          echo "Waiting for MinIO container to be ready..."
          minio_ready=false
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:9001/minio/health/live > /dev/null 2>&1; then
              echo "✅ MinIO is ready"
              minio_ready=true
              break
            fi
            echo "  Attempt $i/15: MinIO not ready, waiting 2s..."
            sleep 2
          done
          if [ "${minio_ready}" != "true" ]; then
            echo "::error title=MinIO service not ready::MinIO did not become reachable on :9001"
            docker logs --tail 200 supacloud-ci-minio || true
            exit 1
          fi

      - name: Setup CI Tenant Bridge
        working-directory: packages/management-api
        run: |
          echo "🌉 Setting up CI Tenant Bridge..."
          bun run tests/scripts/ci-tenant-bridge.ts
          echo "✅ CI Tenant Bridge configured."
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres
          MASTER_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
          TEST_SUPABASE_ANON_KEY: ${{ env.SUPABASE_DEMO_ANON_KEY }}
          TEST_SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_DEMO_SERVICE_KEY }}
          CI: "true"
          NODE_ENV: test
          S3_ENDPOINT: http://127.0.0.1:9001
          S3_REGION: us-east-1
          STORAGE_TYPE: s3
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_FORCE_PATH_STYLE: true

      - name: Restart flaky services
        run: |
          echo "Restarting Auth and Realtime Containers..."
          docker start $(docker ps -a -q --filter "ancestor=supabase/gotrue:v2.193.0") || true
          docker start $(docker ps -a -q --filter "ancestor=public.ecr.aws/supabase/realtime:v2.116.1") || true
          sleep 4

      - name: Launch API & Execute Full Defenses
        working-directory: packages/management-api
        run: |
          echo "Starting Management API in background..."
          bun src/index.ts > api-server.log 2>&1 &
          PID=$!
          sleep 4
          curl -sf http://127.0.0.1:9090/health || (echo "API failed to start. Logs:" && cat api-server.log && exit 1)

          echo "===== RUNNING E2E SNAPSHOTS ====="
          bun test tests/e2e || (echo "::error title=E2E Failed! Server Logs::$(tail -n 50 api-server.log | awk '{printf "%s%%0A", $0}')" && cat api-server.log && exit 1)

          echo "===== RUNNING SDK PARITY TESTS (hard gate) ====="
          bun test tests/integration/sdk-parity.test.ts || (echo "::error title=SDK Parity Failed::SDK parity tests failed. Check sdk-parity.test.ts output above." && exit 1)

          echo "===== RUNNING OFFICIAL SDK PARITY PIPELINE ====="
          bun run tests/scripts/run-official-sdk-compliance.ts || (echo "::error title=Official SDK Parity Failed::Server Logs below:"; cat api-server.log; exit 1)

          sleep 2
          curl -sf http://127.0.0.1:9090/health || echo "⚠️ API health check failed between phases"

          echo "===== RUNNING OFFICIAL CLI COMPLIANCE ====="
          bun run tests/scripts/run-official-cli-compliance.ts

          sleep 2
          curl -sf http://127.0.0.1:9090/health || echo "⚠️ API health check failed between phases"

          echo "===== RUNNING OPENAPI SCHEMA CRAWLER ====="
          bun run tests/scripts/run-openapi-compliance.ts
        env:
          DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres
          PORT: 9090
          TEST_FIXED_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
          TEST_SUPABASE_URL: http://127.0.0.1:9090
          TEST_SUPABASE_ANON_KEY: ${{ env.SUPABASE_DEMO_ANON_KEY }}
          TEST_SUPABASE_SERVICE_KEY: ${{ env.SUPABASE_DEMO_SERVICE_KEY }}
          MASTER_TOKEN: super-secret-jwt-token-with-at-least-32-characters-long
          CI: "true"
          NODE_ENV: test
          S3_ENDPOINT: http://127.0.0.1:9001
          S3_REGION: us-east-1
          STORAGE_TYPE: s3
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_FORCE_PATH_STYLE: true

  shell-scripts-lint:
    name: Shell Scripts Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          ignored_rules="SC1090,SC1091,SC2012,SC2015,SC2016,SC2030,SC2031,SC2034,SC2046,SC2086,SC2155,SC2207,SC2317"

          echo "=== Checking scripts/*.sh and scripts/lib/*.sh ==="
          shellcheck -s bash -e "$ignored_rules" scripts/*.sh scripts/lib/*.sh

          echo "=== Checking root shell scripts ==="
          root_scripts=()
          for script in install.sh setup.sh switch.sh deploy_all.sh supacloud; do
            if [ -f "$script" ]; then
              root_scripts+=("$script")
            fi
          done
          shellcheck -s bash -e "$ignored_rules" "${root_scripts[@]}"

  build-binaries:
    name: Build Binaries
    needs: [lint-and-typecheck, package-checks, docker-and-scripts-checks, unit-test, integration-test, shell-scripts-lint]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Show runtime versions
        run: |
          node --version
          go version
          bun --version

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install --frozen-lockfile

      - name: Install edge-runtime dependencies
        working-directory: packages/edge-runtime
        run: bun install --frozen-lockfile

      - name: Build Linux primary binaries
        working-directory: packages/management-api
        run: |
          mkdir -p dist
          bun run build:linux
          mv supacloud-linux-amd64 dist/
          mv supacloud-linux-arm64 dist/

      - name: Build macOS developer binaries
        working-directory: packages/management-api
        run: |
          bun run build:macos
          mv supacloud-macos-amd64 dist/
          mv supacloud-macos-arm64 dist/

      - name: Build edge-runtime Linux binaries
        working-directory: packages/edge-runtime
        run: |
          mkdir -p dist
          bun run build:linux
          mv supacloud-edge-runtime-linux-amd64 dist/
          mv supacloud-edge-runtime-linux-arm64 dist/

      - name: Smoke edge-runtime Linux amd64 binary
        working-directory: packages/edge-runtime
        run: |
          tmp_functions="$(mktemp -d)"
          EDGE_RUNTIME_HOST=127.0.0.1 PORT=19090 \
            EDGE_FUNCTIONS_DIR="$tmp_functions" \
            EDGE_FUNCTIONS_BASE_DIR="$tmp_functions" \
            ./dist/supacloud-edge-runtime-linux-amd64 > /tmp/supacloud-edge-runtime-smoke.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            rm -rf "$tmp_functions"
          }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:19090/health >/tmp/supacloud-edge-runtime-health.json; then
              cat /tmp/supacloud-edge-runtime-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/supacloud-edge-runtime-smoke.log
              exit 1
            fi
            sleep 0.5
          done
          cat /tmp/supacloud-edge-runtime-smoke.log
          exit 1

      - name: Build edge-runtime macOS binaries
        working-directory: packages/edge-runtime
        run: |
          bun run build:macos
          mv supacloud-edge-runtime-macos-amd64 dist/
          mv supacloud-edge-runtime-macos-arm64 dist/

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}

      - name: Build Caddy edge binaries
        run: OUT_DIR=packages/management-api/dist bash scripts/build_supacloud_caddy.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: supacloud-binaries-linux-primary-macos-dev
          path: |
            packages/management-api/dist/*
            packages/edge-runtime/dist/*
          retention-days: 7
