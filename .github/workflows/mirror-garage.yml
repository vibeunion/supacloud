name: Mirror Garage Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Garage version to mirror (e.g., v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if release exists
        id: check_release
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG_NAME="garage-${VERSION}"
          
          echo "Checking if release $TAG_NAME exists..."
          
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Release $TAG_NAME does not exist. Proceeding."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Binaries
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          # Garage official URL includes 'v' in the path, e.g., /_releases/v1.0.1/...
          # So we use VERSION as is (assuming input has 'v')
          
          mkdir -p dist
          
          # Map arch names if necessary, but Garage uses standard names in URL
          # Available architectures vary by version
          ARCHS=("x86_64" "aarch64" "i686")
          
          for ARCH in "${ARCHS[@]}"; do
            URL="https://garagehq.deuxfleurs.fr/_releases/${VERSION}/${ARCH}-unknown-linux-musl/garage"
            
            SUFFIX="${ARCH}"
            if [ "$ARCH" == "x86_64" ]; then SUFFIX="amd64"; fi
            if [ "$ARCH" == "aarch64" ]; then SUFFIX="arm64"; fi
            
            FILENAME="garage-${VERSION}-linux-${SUFFIX}"
            
            echo "Checking ${ARCH} at ${URL}..."
            if curl -L --head --fail "$URL" >/dev/null 2>&1; then
              echo "Downloading ${ARCH}..."
              curl -L --fail "$URL" -o "dist/${FILENAME}"
              chmod +x "dist/${FILENAME}"
              file "dist/${FILENAME}"
            else
              echo "Architecture ${ARCH} not found at ${URL}. Skipping."
            fi
          done
          
          ls -lh dist/

      - name: Create Release and Upload
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: garage-${{ github.event.inputs.version }}
          name: Garage ${{ github.event.inputs.version }} Mirror
          body: |
            Mirror of Garage ${{ github.event.inputs.version }} binaries.
            Source: https://garagehq.deuxfleurs.fr/_releases/${{ github.event.inputs.version }}/
          files: dist/*
          draft: false
          prerelease: false
