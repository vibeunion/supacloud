name: Nx Rollout Verification Inputs

# Temporary branch-only verification input capture. Remove before final review.
on:
  push:
    branches: ['feat/nx-workspace-foundation']
    paths: ['.github/workflows/nx-rollout-verification.yml']

permissions:
  contents: read

jobs:
  verification-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/supacloud-nx-rollout-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked compatibility test dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts --cwd packages/delivery
          bun install --frozen-lockfile --ignore-scripts --cwd packages/management-api
      - name: Export isolated dependency cache
        run: |
          mkdir -p "$RUNNER_TEMP/nx-rollout-inputs"
          git rev-parse HEAD > "$RUNNER_TEMP/nx-rollout-inputs/commit.txt"
          tar -cf "$RUNNER_TEMP/nx-rollout-inputs/cache.tar" -C "$BUN_INSTALL_CACHE_DIR" .
          bun --version > "$RUNNER_TEMP/nx-rollout-inputs/bun-version.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: nx-rollout-verification-inputs
          path: ${{ runner.temp }}/nx-rollout-inputs/
          include-hidden-files: true
          retention-days: 1
