name: Nx Rollout Verification Inputs

# Temporary, branch-scoped verification aid. Remove before final review.
on:
  push:
    branches: ['feat/nx-workspace-foundation']
    paths: ['.github/workflows/nx-rollout-verification.yml']

permissions:
  contents: read

jobs:
  verification-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUN_INSTALL_CACHE_DIR: /tmp/supacloud-nx-rollout-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked verification dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          for package in contracts delivery commands compiler db app app-svelte supacloud-js elysia cli admin; do
            bun install --frozen-lockfile --ignore-scripts --cwd "packages/$package"
          done
      - name: Export source and isolated package cache
        run: |
          mkdir -p "$RUNNER_TEMP/nx-rollout-inputs"
          git archive HEAD > "$RUNNER_TEMP/nx-rollout-inputs/source.tar"
          git rev-parse HEAD > "$RUNNER_TEMP/nx-rollout-inputs/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/nx-rollout-inputs/tree.txt"
          tar -cf "$RUNNER_TEMP/nx-rollout-inputs/cache.tar" -C "$BUN_INSTALL_CACHE_DIR" .
          node --version > "$RUNNER_TEMP/nx-rollout-inputs/node-version.txt"
          bun --version > "$RUNNER_TEMP/nx-rollout-inputs/bun-version.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: nx-rollout-verification-inputs
          path: ${{ runner.temp }}/nx-rollout-inputs/
          include-hidden-files: true
          retention-days: 1
