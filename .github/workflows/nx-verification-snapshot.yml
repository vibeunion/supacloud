name: Nx Verification Snapshot
on:
  push:
    branches: [work/nx-completion-verification-20261003]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 244d92c43d5e021b3c49f1abc9568a4ea7f14150
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Generate and verify consumer lock changes
        run: |
          node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; for (const p of ["admin","web-console"]) { const path=`packages/${p}/package.json`; const value=JSON.parse(readFileSync(path,"utf8")); value.dependencies["@supacloud/delivery"]="file:../delivery"; writeFileSync(path,JSON.stringify(value,null,2)+"\n"); }'
          mkdir -p /tmp/nx-verification
          for package in admin web-console; do
            bun install --lockfile-only --ignore-scripts --cwd "packages/$package"
            bun install --frozen-lockfile --ignore-scripts --cwd "packages/$package"
            cp "packages/$package/bun.lock" "/tmp/nx-verification/$package.bun.lock"
          done
          git diff -- packages/admin/bun.lock packages/web-console/bun.lock > /tmp/nx-verification/locks.patch
          git rev-parse HEAD > /tmp/nx-verification/commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nx-explicit-consumer-locks
          path: /tmp/nx-verification/
          retention-days: 1
