name: Nx Verification Snapshot
on:
  push:
    branches: [work/nx-completion-verification-20261003]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7b1496828a9ade663f2a3d4572252af966296763
          persist-credentials: false
      - name: Record exact merged baseline
        run: |
          mkdir -p /tmp/nx-verification
          git archive HEAD > /tmp/nx-verification/source.tar
          git rev-parse HEAD > /tmp/nx-verification/commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: nx-merged-main-source
          path: /tmp/nx-verification/
          retention-days: 1
