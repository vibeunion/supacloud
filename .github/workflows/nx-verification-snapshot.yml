name: Nx Verification Snapshot
on:
  push:
    branches: [work/nx-completion-verification-20261003]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 244d92c43d5e021b3c49f1abc9568a4ea7f14150
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Prepare pinned consumer inputs
        run: |
          for package in delivery cli admin web-console; do
            bun install --frozen-lockfile --ignore-scripts --cwd "packages/$package"
          done
          mkdir -p /tmp/nx-verification
          git rev-parse HEAD > /tmp/nx-verification/commit.txt
          tar -chf /tmp/nx-verification/consumer-dependencies.tar packages/cli/node_modules packages/admin/node_modules packages/web-console/node_modules packages/delivery/node_modules
          tar -C "$HOME/.bun/install" -cf /tmp/nx-verification/consumer-bun-cache.tar cache
      - uses: actions/upload-artifact@v7
        with:
          name: nx-shared-consumer-inputs
          path: /tmp/nx-verification/
          retention-days: 1
