name: Nx Workspace Tooling

# Reused by Management API CI and included in its Required Checks aggregate.
# Do not add PR path filters or a second pull_request run here.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nx-workspace-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Nx Workspace Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install pinned repository tooling
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Install existing Compiler parser
        run: bun install --ignore-scripts --frozen-lockfile --cwd packages/compiler
      - name: Workspace and source-boundary regression tests
        run: bun run test:workspace
      - name: Reject new source-boundary and coverage findings
        id: source_inventory
        run: |
          mkdir -p .nx/evidence
          bun run check:source-regressions > .nx/evidence/source-boundaries.json
      - name: Validate repository metadata and Nx discovery
        run: |
          mkdir -p .nx/evidence
          node scripts/workspace/cli.mjs check > .nx/evidence/workspace.json
          node scripts/workspace/nx.mjs graph --file=.nx/evidence/nx-graph.json
      - name: Exercise real Nx task ordering and failure propagation
        run: bun run test:nx-acceptance
      - name: Build the app/contracts pilot using the actual repository task graph
        run: bun run workspace:build --project app
      - name: Record affected shadow plan without selecting or skipping CI jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/workspace/cli.mjs affected --base "$BASE_SHA" > .nx/evidence/affected.json
          else
            node scripts/workspace/cli.mjs affected > .nx/evidence/affected.json
          fi
      - name: Record verification versions
        if: always()
        run: |
          mkdir -p .nx/evidence
          node --version > .nx/evidence/node-version.txt
          bun --version > .nx/evidence/bun-version.txt
          git rev-parse HEAD > .nx/evidence/commit.txt
          if [ -f node_modules/nx/package.json ]; then
            node -p "require('./node_modules/nx/package.json').version" > .nx/evidence/nx-version.txt
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nx-workspace-evidence
          path: .nx/evidence/
          include-hidden-files: true
          retention-days: 7
