name: Publish Docker Postgres

on:
  push:
    branches: [main]
    paths:
      - "docker/self-host/postgres/**"
      - ".github/workflows/publish-docker-postgres.yml"
      - "scripts/publish-postgres-image.sh"
      - "scripts/postgres-image.test.ts"
  workflow_dispatch:

concurrency:
  group: publish-docker-postgres
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require main for public tags
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push postgres image
        env:
          POSTGRES_IMAGE: ghcr.io/${{ github.repository }}/postgres
        run: bash scripts/publish-postgres-image.sh
