name: Release Management API

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: ./packages/management-api
        run: bun install

      - name: Build AMD64 Binary
        working-directory: ./packages/management-api
        run: bun run build:amd64

      - name: Build ARM64 Binary
        working-directory: ./packages/management-api
        run: bun run build:arm64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            packages/management-api/supacloud-api-linux-amd64
            packages/management-api/supacloud-api-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
