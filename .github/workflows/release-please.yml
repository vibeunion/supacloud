name: Release Please

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  BUN_VERSION: "1.4.0"
  XCADDY_VERSION: "v0.4.5"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      management_api_released: ${{ steps.release.outputs['packages/management-api--release_created'] }}
      management_api_tag_name: ${{ steps.release.outputs['packages/management-api--tag_name'] }}
      edge_runtime_released: ${{ steps.release.outputs['packages/edge-runtime--release_created'] }}
      edge_runtime_tag_name: ${{ steps.release.outputs['packages/edge-runtime--tag_name'] }}
      pgredis_runtime_released: ${{ steps.release.outputs['packages/pgredis-runtime--release_created'] }}
      pgredis_runtime_tag_name: ${{ steps.release.outputs['packages/pgredis-runtime--tag_name'] }}
      supacloud_lite_released: ${{ steps.release.outputs['packages/supacloud-lite--release_created'] }}
      supacloud_lite_tag_name: ${{ steps.release.outputs['packages/supacloud-lite--tag_name'] }}
      supacloud_js_released: ${{ steps.release.outputs['packages/supacloud-js--release_created'] }}
      cli_released: ${{ steps.release.outputs['packages/cli--release_created'] }}
      admin_released: ${{ steps.release.outputs['packages/admin--release_created'] }}
      function_adapter_released: ${{ steps.release.outputs['packages/function-adapter--release_created'] }}
      supacloud_released: ${{ steps.release.outputs['packages/supacloud--release_created'] }}
      app_released: ${{ steps.release.outputs['packages/app--release_created'] }}
      compiler_released: ${{ steps.release.outputs['packages/compiler--release_created'] }}
      elysia_released: ${{ steps.release.outputs['packages/elysia--release_created'] }}
      db_released: ${{ steps.release.outputs['packages/db--release_created'] }}
      testing_released: ${{ steps.release.outputs['packages/testing--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-management-api-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.management_api_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.management_api_tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install --frozen-lockfile

      - name: Install edge-runtime dependencies
        working-directory: packages/edge-runtime
        run: bun install --frozen-lockfile

      - name: Build web console static artifact
        run: |
          cd packages/web-console
          bun install --frozen-lockfile
          bun run build
          mkdir -p ../management-api/dist
          tar -czf ../management-api/dist/web-console-build.tar.gz -C build .

      - name: Build release binaries
        working-directory: packages/management-api
        run: |
          mkdir -p dist
          bun run build:linux
          bun run build:macos
          mv supacloud-linux-amd64 dist/
          mv supacloud-linux-arm64 dist/
          mv supacloud-macos-amd64 dist/
          mv supacloud-macos-arm64 dist/
          chmod 0755 dist/supacloud-*

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@${XCADDY_VERSION}

      - name: Build Caddy edge binaries
        run: OUT_DIR=packages/management-api/dist bash scripts/build_supacloud_caddy.sh

      - name: Smoke Caddy to Edge Runtime proxy
        run: CADDY_BINARY=packages/management-api/dist/supacloud-caddy-linux-amd64 bash scripts/test_supacloud_caddy_edge_proxy.sh

      - name: Generate SHA256SUMS
        run: |
          mkdir -p release-assets
          cp packages/management-api/dist/* release-assets/
          cd release-assets
          sha256sum * > SHA256SUMS

      - name: Generate strict Management release manifest
        working-directory: packages/management-api
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.management_api_tag_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: bun run release:manifest --assets-dir ../../release-assets --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"

      - name: Attest management release artifacts
        id: attest-management-release
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/*

      - name: Stage offline Management attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-management-release.outputs.bundle-path }}
        run: install -m 0600 "$ATTESTATION_BUNDLE" release-assets/SUPACLOUD-RELEASE.attestation.jsonl

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.management_api_tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber


  publish-edge-runtime-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.edge_runtime_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.edge_runtime_tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: packages/edge-runtime
        run: bun install --frozen-lockfile

      - name: Build release binaries
        working-directory: packages/edge-runtime
        run: |
          mkdir -p dist
          bun run build:linux
          bun run build:macos
          mv supacloud-edge-runtime-linux-amd64 dist/
          mv supacloud-edge-runtime-linux-arm64 dist/
          mv supacloud-edge-runtime-macos-amd64 dist/
          mv supacloud-edge-runtime-macos-arm64 dist/
          chmod 0755 dist/supacloud-edge-runtime-*

      - name: Smoke edge-runtime Linux amd64 binary
        working-directory: packages/edge-runtime
        run: |
          tmp_functions="$(mktemp -d)"
          EDGE_RUNTIME_HOST=127.0.0.1 PORT=19090 \
            EDGE_FUNCTIONS_DIR="$tmp_functions" \
            EDGE_FUNCTIONS_BASE_DIR="$tmp_functions" \
            ./dist/supacloud-edge-runtime-linux-amd64 > /tmp/supacloud-edge-runtime-smoke.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            rm -rf "$tmp_functions"
          }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:19090/health >/tmp/supacloud-edge-runtime-health.json; then
              cat /tmp/supacloud-edge-runtime-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/supacloud-edge-runtime-smoke.log
              exit 1
            fi
            sleep 0.5
          done
          cat /tmp/supacloud-edge-runtime-smoke.log
          exit 1

      - name: Generate SHA256SUMS
        working-directory: packages/edge-runtime/dist
        run: sha256sum * > SHA256SUMS

      - name: Generate strict Edge Runtime release manifest
        working-directory: packages/edge-runtime
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.edge_runtime_tag_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: bun run release:manifest --assets-dir dist --tag "$RELEASE_TAG" --source-commit "$SOURCE_COMMIT"

      - name: Attest Edge Runtime release artifacts
        id: attest-edge-runtime-release
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/edge-runtime/dist/*

      - name: Stage offline Edge Runtime attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-edge-runtime-release.outputs.bundle-path }}
        run: install -m 0600 "$ATTESTATION_BUNDLE" packages/edge-runtime/dist/SUPACLOUD-RELEASE.attestation.jsonl

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.edge_runtime_tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/edge-runtime/dist/* --clobber


  publish-pgredis-runtime-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.pgredis_runtime_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pgredis_runtime_tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: packages/pgredis-runtime
        run: bun install --frozen-lockfile

      - name: Build release binaries
        working-directory: packages/pgredis-runtime
        run: |
          mkdir -p dist
          bun run build:linux
          bun run build:macos
          mv supacloud-pgredis-runtime-linux-amd64 dist/
          mv supacloud-pgredis-runtime-linux-arm64 dist/
          mv supacloud-pgredis-runtime-macos-amd64 dist/
          mv supacloud-pgredis-runtime-macos-arm64 dist/
          chmod 0755 dist/supacloud-pgredis-runtime-*

      - name: Smoke pgredis-runtime Linux amd64 binary
        working-directory: packages/pgredis-runtime
        run: |
          tenants_dir="$(mktemp -d)"
          PGREDIS_RUNTIME_HOST=127.0.0.1 \
          PGREDIS_RUNTIME_PORT=19010 \
          PGREDIS_RUNTIME_TENANTS_DIR="$tenants_dir" \
          PGREDIS_RUNTIME_INTERNAL_TOKEN="$(openssl rand -hex 32)" \
            ./dist/supacloud-pgredis-runtime-linux-amd64 > /tmp/supacloud-pgredis-runtime-smoke.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            rm -rf "$tenants_dir"
          }
          trap cleanup EXIT
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:19010/health >/tmp/supacloud-pgredis-runtime-health.json; then
              cat /tmp/supacloud-pgredis-runtime-health.json
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/supacloud-pgredis-runtime-smoke.log
              exit 1
            fi
            sleep 0.5
          done
          cat /tmp/supacloud-pgredis-runtime-smoke.log
          exit 1

      - name: Generate SHA256SUMS
        working-directory: packages/pgredis-runtime/dist
        run: sha256sum * > SHA256SUMS

      - name: Attest pgredis-runtime release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/pgredis-runtime/dist/*

      - name: Upload binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.pgredis_runtime_tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/pgredis-runtime/dist/* --clobber


  publish-supacloud-lite-binaries:
    needs: release-please
    if: ${{ needs.release-please.outputs.supacloud_lite_released == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.supacloud_lite_tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: packages/supacloud-lite
        run: bun install --frozen-lockfile

      - name: Build standalone release matrix
        working-directory: packages/supacloud-lite
        run: bun run build:standalone:release

      - name: Smoke Linux x64 standalone binary
        working-directory: packages/supacloud-lite
        env:
          SUPACLOUD_LITE_STANDALONE_BINARY: dist/standalone/supacloud-lite-linux-x64
        run: bun run test:standalone

      - name: Verify Linux x64 standalone native contracts
        working-directory: packages/supacloud-lite
        env:
          SUPACLOUD_LITE_STANDALONE_BINARY: dist/standalone/supacloud-lite-linux-x64
        run: bun run test:standalone:native

      - name: Generate SHA256SUMS
        working-directory: packages/supacloud-lite/dist/standalone
        run: |
          cp ../../LICENSE SUPACLOUD-LITE-APACHE-2.0.txt
          cp ../../THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.md
          cp ../../LICENSES/*.txt .
          sha256sum * > SHA256SUMS

      - name: Attest SupaCloud Lite standalone artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: packages/supacloud-lite/dist/standalone/*

      - name: Upload standalone artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.supacloud_lite_tag_name }}
        run: gh release upload "$RELEASE_TAG" packages/supacloud-lite/dist/standalone/* --clobber


  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # required for npm OIDC Trusted Publisher
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify npm publisher
        run: npm --version

      - name: Publish supacloud-js to NPM
        if: ${{ needs.release-please.outputs.supacloud_js_released == 'true' }}
        working-directory: packages/supacloud-js
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish SupaCloud Lite to NPM
        if: ${{ needs.release-please.outputs.supacloud_lite_released == 'true' }}
        working-directory: packages/supacloud-lite
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run check
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish cli to NPM
        if: ${{ needs.release-please.outputs.cli_released == 'true' }}
        working-directory: packages/cli
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish admin to NPM
        if: ${{ needs.release-please.outputs.admin_released == 'true' }}
        working-directory: packages/admin
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish function adapter to NPM
        if: ${{ needs.release-please.outputs.function_adapter_released == 'true' }}
        working-directory: packages/function-adapter
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish supacloud (umbrella) to NPM
        if: ${{ needs.release-please.outputs.supacloud_released == 'true' }}
        working-directory: packages/supacloud
        run: |
          bun install --frozen-lockfile --registry https://registry.npmjs.org
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      # App-framework packages. NODE_AUTH_TOKEN supports the first publish of
      # each new package before npm trusted publishing is linked.
      - name: Publish app framework metadata to NPM
        if: ${{ needs.release-please.outputs.app_released == 'true' }}
        working-directory: packages/app
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish app compiler to NPM
        if: ${{ needs.release-please.outputs.compiler_released == 'true' }}
        working-directory: packages/compiler
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish elysia adapter to NPM
        if: ${{ needs.release-please.outputs.elysia_released == 'true' }}
        working-directory: packages/elysia
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish database governance to NPM
        if: ${{ needs.release-please.outputs.db_released == 'true' }}
        working-directory: packages/db
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

      - name: Publish testing utilities to NPM
        if: ${{ needs.release-please.outputs.testing_released == 'true' }}
        working-directory: packages/testing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun run build
          node "$GITHUB_WORKSPACE/.github/scripts/publish-npm-package.mjs"

  sync-supacloud-dependencies:
    needs: [release-please, publish-npm]
    if: ${{ always() && needs.publish-npm.result == 'success' && (needs.release-please.outputs.cli_released == 'true' || needs.release-please.outputs.admin_released == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Synchronize umbrella dependencies
        id: synchronize
        run: |
          if ! sync_output="$(node .github/scripts/sync-supacloud-dependencies.mjs)"; then
            echo "Dependency synchronization failed." >&2
            exit 1
          fi
          case "$sync_output" in
            changed=true|changed=false) ;;
            *)
              echo "Unexpected dependency synchronization output: $sync_output" >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$sync_output" >> "$GITHUB_OUTPUT"

      - name: Wait for published dependencies
        if: ${{ steps.synchronize.outputs.changed == 'true' }}
        run: |
          cli_version="$(node -p "require('./packages/cli/package.json').version")"
          admin_version="$(node -p "require('./packages/admin/package.json').version")"
          for spec in "@supacloud/cli@$cli_version" "@supacloud/admin@$admin_version"; do
            published=""
            for attempt in $(seq 1 12); do
              published="$(npm view "$spec" version 2>/dev/null || true)"
              if [[ "$published" == "${spec##*@}" ]]; then
                break
              fi
              if [[ "$attempt" -lt 12 ]]; then
                sleep 5
              fi
            done
            if [[ "$published" != "${spec##*@}" ]]; then
              echo "Published package is not visible: $spec" >&2
              exit 1
            fi
          done

      - name: Regenerate and verify umbrella lockfile
        if: ${{ steps.synchronize.outputs.changed == 'true' }}
        working-directory: packages/supacloud
        run: |
          bun install --lockfile-only --registry https://registry.npmjs.org
          bun install --frozen-lockfile --registry https://registry.npmjs.org
          for package_name in cli admin; do
            expected="$(node -p "require('../$package_name/package.json').version")"
            installed="$(node -p "require('./node_modules/@supacloud/$package_name/package.json').version")"
            if [[ "$installed" != "$expected" ]]; then
              echo "Installed @supacloud/$package_name version $installed does not match published sibling version $expected." >&2
              exit 1
            fi
          done
          git diff --check -- package.json bun.lock

      - name: Open dependency synchronization PR
        if: ${{ steps.synchronize.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          if git diff --quiet -- packages/supacloud/package.json packages/supacloud/bun.lock; then
            echo "Dependency synchronization reported a change but produced no diff." >&2
            exit 1
          fi

          branch="automation/sync-supacloud-dependencies"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add packages/supacloud/package.json packages/supacloud/bun.lock
          git commit -m "fix(supacloud): sync published CLI dependencies"
          git push --force-with-lease origin "HEAD:$branch"

          existing_pr="$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$existing_pr" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "fix(supacloud): sync published CLI dependencies" \
              --body "Synchronize the umbrella package with the CLI and Admin versions that have completed trusted npm publication, including the reproducible Bun lockfile."
          else
            echo "Updated dependency synchronization PR #$existing_pr."
          fi
