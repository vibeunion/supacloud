name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      supacloud_js_released: ${{ steps.release.outputs['packages/supacloud-js--release_created'] }}
      cli_released: ${{ steps.release.outputs['packages/cli--release_created'] }}
      admin_released: ${{ steps.release.outputs['packages/admin--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write  # required for npm OIDC Trusted Publisher
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Publish supacloud-js to NPM
        if: ${{ needs.release-please.outputs.supacloud_js_released == 'true' }}
        working-directory: packages/supacloud-js
        run: |
          bun install
          bunx npm publish --provenance --access public

      - name: Publish cli to NPM
        if: ${{ needs.release-please.outputs.cli_released == 'true' }}
        working-directory: packages/cli
        run: |
          bun install
          bunx npm publish --provenance --access public

      - name: Publish admin to NPM
        if: ${{ needs.release-please.outputs.admin_released == 'true' }}
        working-directory: packages/admin
        run: |
          bun install
          bunx npm publish --provenance --access public
