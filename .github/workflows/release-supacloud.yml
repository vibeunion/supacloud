name: Release SupaCloud Binary

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: ./packages/management-api
        run: bun install

      - name: Prebuild Web Console & Pack Assets
        working-directory: ./packages/management-api
        run: bun run prebuild

      - name: Build AMD64 Binary
        working-directory: ./packages/management-api
        run: bun run build:amd64

      - name: Build ARM64 Binary
        working-directory: ./packages/management-api
        run: bun run build:arm64

      - name: Build macOS Binaries
        working-directory: ./packages/management-api
        run: |
          bun run build:macos-amd64
          bun run build:macos-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## SuperCloud Release
            
            ### Quick Install (Linux)
            ```bash
            # Download and Install
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/supacloud-linux-amd64 -O supacloud
            chmod +x supacloud
            ./supacloud install
            ```

            ### Download for macOS
            - [Apple Silicon (M1/M2/M3)](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/supacloud-macos-arm64)
            - [Intel Mac](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/supacloud-macos-amd64)
            
            ### Maintenance
            - Run `supacloud doctor` for health check.
            - Run `supacloud upgrade` for future updates.
          files: |
            packages/management-api/supacloud-linux-amd64
            packages/management-api/supacloud-linux-arm64
            packages/management-api/supacloud-macos-amd64
            packages/management-api/supacloud-macos-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
