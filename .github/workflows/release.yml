name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/management-api
        run: bun install

      - name: Build Linux primary binaries
        working-directory: packages/management-api
        run: bun run build:linux

      - name: Build macOS developer binaries
        working-directory: packages/management-api
        run: bun run build:macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/management-api/supacloud-linux-amd64
            packages/management-api/supacloud-linux-arm64
            packages/management-api/supacloud-macos-amd64
            packages/management-api/supacloud-macos-arm64
          body: |
            Production installs and upgrades use the Linux binaries:
            - supacloud-linux-amd64
            - supacloud-linux-arm64

            macOS binaries are published for local development and diagnostics only.
          generate_release_notes: true
