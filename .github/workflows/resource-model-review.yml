name: Resource Model Review Validation
on:
  push:
    branches:
      - review/resource-model-1512-validation
permissions:
  contents: write
jobs:
  resource-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install locked test dependencies
        run: |
          bun install --frozen-lockfile --cwd packages/delivery
          bun install --frozen-lockfile --cwd packages/compiler
          bun install --frozen-lockfile --cwd packages/app
      - name: Check original resource tests before applying the patch
        working-directory: packages/compiler
        run: bun test src/resource-model.test.ts
      - name: Prove review regressions fail against the original implementation
        working-directory: packages/compiler
        run: |
          set +e
          bun test src/resource-model-regressions.test.ts > /tmp/resource-review-before.log 2>&1
          code=$?
          set -e
          cat /tmp/resource-review-before.log
          if [ "$code" -eq 0 ]; then
            echo 'Expected regression failures before the fix'; exit 1
          fi
          grep -Eq '[1-9][0-9]* fail' /tmp/resource-review-before.log
          if grep -Eq 'Cannot find (module|package)|ModuleNotFound' /tmp/resource-review-before.log; then
            echo 'Dependency errors are not regression evidence'; exit 1
          fi
      - name: Apply the blob-pinned review patch
        run: python3 .review/apply-resource-review.py
      - name: Compiler resource and existing graph/manifest regressions
        working-directory: packages/compiler
        run: |
          set -o pipefail
          bun test src/resource-model.test.ts src/resource-model-regressions.test.ts src/analyze.test.ts src/generate.test.ts src/contract-manifest.test.ts 2>&1 | tee /tmp/resource-review-after.log
      - name: App decorator and resource metadata regressions
        working-directory: packages/app
        run: |
          set -o pipefail
          bun test src/decorators.test.ts src/infra-resource-metadata.test.ts 2>&1 | tee /tmp/resource-review-app.log
      - name: Compiler and app source and test type checks
        run: |
          bun run --cwd packages/compiler typecheck
          bun run --cwd packages/compiler typecheck:test
          bun run --cwd packages/app typecheck
          bun run --cwd packages/app typecheck:test
      - name: Diagnostic documentation and diff checks
        run: |
          bun scripts/check_diagnostic_docs.ts
          git diff --check
      - name: Save only validated source and documentation changes on the review branch
        run: |
          test "$(git branch --show-current)" = 'review/resource-model-1512-validation'
          git add packages/compiler/src/analyze.ts docs/application-resource-model.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(compiler): fail closed on invalid resource declarations'
          git push origin HEAD:review/resource-model-1512-validation
          git show --stat --oneline HEAD
          git rev-parse HEAD
          git ls-files -s packages/compiler/src/analyze.ts packages/compiler/src/resource-model-regressions.test.ts packages/app/src/infra-resource-metadata.test.ts docs/application-resource-model.md
      - name: Preserve red-green test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-model-review-evidence
          path: /tmp/resource-review-*.log
          retention-days: 7
