name: RxJS implementation verification
on:
  push:
    branches: ["feat/default-rxjs-sdk"]
permissions:
  contents: write
concurrency:
  group: rxjs-implementation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/feat/default-rxjs-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/default-rxjs-sdk
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Prepare declared defaults and regenerate affected lockfiles
        run: python3 .github/scripts/prepare-rxjs.py
      - name: Commit only generated integration edits to the implementation branch
        run: |
          git add packages/app/package.json packages/supacloud-js/package.json
          git add packages/app/README.md packages/supacloud-js/README.md docs/engineering-goals.md
          git add packages/cli/src/shared/tools/app-starter.ts packages/cli/src/shared/tools/app-starter-templates.ts
          git ls-files -z 'packages/**/bun.lock' | xargs -0 git add --
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: wire default RxJS entries and refresh dependency locks'
            git push origin HEAD:refs/heads/feat/default-rxjs-sdk
          fi
      - name: App build, types and tests
        run: |
          bun run scripts/build-command-dependencies.ts app
          cd packages/app
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
          bun run typecheck:test
          bun test
      - name: SDK build, consumer types and tests
        run: |
          bun run scripts/build-command-dependencies.ts supacloud-js
          cd packages/supacloud-js
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
          bun run typecheck:test
          bun run typecheck:consumer
          bun test
      - name: Default starter integration
        run: |
          cd packages/cli
          bun install --frozen-lockfile --ignore-scripts
          bun test src/shared/tools/app-starter-reactive.test.ts
