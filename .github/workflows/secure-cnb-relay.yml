name: Secure CNB issue detail recovery

on:
  push:
    branches: [agent/secure-cnb-relay-20260819]
    paths: [.github/workflows/secure-cnb-relay.yml]

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_BRANCH: agent/secure-cnb-relay-20260819
      RELAY_NONCE: recovery-1787099210-11813
      CNB_REPO: aizhuliren/xgic/supacloud
      RECIPIENT_CERT_B64: 
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELAY_BRANCH }}

      - name: Publish one-time runner certificate
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/cnb-relay
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout /tmp/cnb-relay/runner.key \
            -out /tmp/cnb-relay/runner.crt \
            -days 1 -subj '/CN=SupaCloud CNB recovery runner' >/dev/null 2>&1
          chmod 600 /tmp/cnb-relay/runner.key
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.secure-relay/runner-${RELAY_NONCE}.crt" \
            -f message="chore(relay): publish recovery runner ${RELAY_NONCE}" \
            -f content="$(base64 -w0 /tmp/cnb-relay/runner.crt)" \
            -f branch="$RELAY_BRANCH" >/dev/null

      - name: Receive encrypted token
        shell: bash
        run: |
          set -euo pipefail
          ref=$(jq -rn --arg value "$RELAY_BRANCH" '$value|@uri')
          for _ in $(seq 1 180); do
            if encoded=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/.secure-relay/token-${RELAY_NONCE}.cms.b64?ref=$ref" \
              --jq .content 2>/dev/null); then
              printf '%s' "$encoded" | tr -d '\n' | base64 -d > /tmp/cnb-relay/token.cms.b64
              break
            fi
            sleep 2
          done
          test -s /tmp/cnb-relay/token.cms.b64
          base64 -d /tmp/cnb-relay/token.cms.b64 > /tmp/cnb-relay/token.cms.der
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/cnb-relay/token.cms.der \
            -recip /tmp/cnb-relay/runner.crt \
            -inkey /tmp/cnb-relay/runner.key \
            -out /tmp/cnb-relay/token
          chmod 600 /tmp/cnb-relay/token
          echo "::add-mask::$(cat /tmp/cnb-relay/token)"

      - name: Read open issue details and comments
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/cnb-relay/token)
          api="https://api.cnb.cool/${CNB_REPO}"
          curl -fsS -H 'Accept: application/json' -H "Authorization: Bearer $token" \
            "$api/-/issues?state=open&page=1&page_size=100" > /tmp/cnb-relay/list.json
          jq empty /tmp/cnb-relay/list.json
          : > /tmp/cnb-relay/details.ndjson
          jq -r 'if type == "array" then .[] else (.data // .items // .issues // [])[] end | .number' \
            /tmp/cnb-relay/list.json | while read -r number; do
              test -n "$number"
              curl -fsS -H 'Accept: application/json' -H "Authorization: Bearer $token" \
                "$api/-/issues/$number" > /tmp/cnb-relay/detail.json
              curl -fsS -H 'Accept: application/json' -H "Authorization: Bearer $token" \
                "$api/-/issues/$number/comments?page=1&page_size=100" > /tmp/cnb-relay/comments.json
              jq -cn --arg number "$number" \
                --slurpfile detail /tmp/cnb-relay/detail.json \
                --slurpfile comments /tmp/cnb-relay/comments.json \
                '{number:$number, detail:$detail[0], comments:$comments[0]}' \
                >> /tmp/cnb-relay/details.ndjson
            done
          jq -s --slurpfile list /tmp/cnb-relay/list.json \
            '{schema:1, list:$list[0], issues:.}' /tmp/cnb-relay/details.ndjson \
            > /tmp/cnb-relay/payload.json
          test "$(jq '.issues | length' /tmp/cnb-relay/payload.json)" -gt 0

      - name: Return encrypted detail payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RECIPIENT_CERT_B64" | base64 -d > /tmp/cnb-relay/recipient.crt
          gzip -9 -c /tmp/cnb-relay/payload.json > /tmp/cnb-relay/payload.json.gz
          openssl cms -encrypt -aes256 -binary -outform DER \
            -in /tmp/cnb-relay/payload.json.gz \
            -out /tmp/cnb-relay/details.cms.der \
            /tmp/cnb-relay/recipient.crt
          base64 -w0 /tmp/cnb-relay/details.cms.der > /tmp/cnb-relay/details.cms.b64
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.secure-relay/details-${RELAY_NONCE}.cms.b64" \
            -f message="chore(relay): publish encrypted recovery details ${RELAY_NONCE}" \
            -f content="$(base64 -w0 /tmp/cnb-relay/details.cms.b64)" \
            -f branch="$RELAY_BRANCH" >/dev/null

      - name: Destroy plaintext material
        if: always()
        shell: bash
        run: |
          set +e
          find /tmp/cnb-relay -type f -exec shred -u {} +
          rmdir /tmp/cnb-relay 2>/dev/null || true
