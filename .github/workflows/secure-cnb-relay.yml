name: Secure CNB Issue Relay

on:
  push:
    branches:
      - agent/secure-cnb-relay-20260819
    paths:
      - .github/workflows/secure-cnb-relay.yml

permissions:
  contents: write

env:
  RELAY_BRANCH: agent/secure-cnb-relay-20260819
  CNB_REPO: aizhuliren/xgic/supacloud
  RECIPIENT_CERT_B64: 

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELAY_BRANCH }}
          fetch-depth: 0

      - name: Publish one-time relay certificate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/cnb-relay
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout /tmp/cnb-relay/runner.key.pem \
            -out /tmp/cnb-relay/runner.crt.pem \
            -days 1 -subj '/CN=SupaCloud CNB one-time relay' >/dev/null 2>&1

          content=$(base64 -w0 /tmp/cnb-relay/runner.crt.pem)
          payload=$(jq -n \
            --arg message 'chore: publish one-time relay key' \
            --arg content "$content" \
            --arg branch "$RELAY_BRANCH" \
            '{message:$message, content:$content, branch:$branch}')
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.secure-relay/runner.crt.pem" \
            --data "$payload" >/tmp/cnb-relay/publish.json

      - name: Receive token, collect issues, and encrypt result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          cd /tmp/cnb-relay

          found=0
          for _ in $(seq 1 360); do
            git -C "$GITHUB_WORKSPACE" fetch --quiet origin "$RELAY_BRANCH" || true
            if git -C "$GITHUB_WORKSPACE" show "origin/${RELAY_BRANCH}:.secure-relay/token.cms.b64" > token.cms.b64 2>/dev/null; then
              found=1
              break
            fi
            sleep 2
          done
          if [ "$found" -ne 1 ]; then
            echo 'Encrypted token handoff was not received.' >&2
            exit 1
          fi

          base64 -d token.cms.b64 > token.cms
          CNB_TOKEN=$(openssl cms -decrypt -binary -inform DER \
            -in token.cms \
            -recip runner.crt.pem \
            -inkey runner.key.pem)
          CNB_TOKEN=${CNB_TOKEN//$'\r'/}
          CNB_TOKEN=${CNB_TOKEN//$'\n'/}
          if [ -z "$CNB_TOKEN" ]; then
            echo 'Encrypted token handoff decrypted to an empty value.' >&2
            exit 1
          fi
          echo "::add-mask::$CNB_TOKEN"
          export CNB_RELAY_TOKEN="$CNB_TOKEN"

          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://api.cnb.cool"
          repo = os.environ["CNB_REPO"]
          token = os.environ["CNB_RELAY_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.cnb.api+json",
              "User-Agent": "supacloud-secure-issue-relay",
          }

          def fetch(path: str):
              request = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def try_fetch(path: str):
              try:
                  return {"ok": True, "data": fetch(path)}
              except urllib.error.HTTPError as exc:
                  return {"ok": False, "status": exc.code, "reason": exc.reason}
              except Exception as exc:
                  return {"ok": False, "error": type(exc).__name__, "reason": str(exc)[:300]}

          quoted_repo = "/".join(urllib.parse.quote(part, safe="") for part in repo.split("/"))
          issue_summaries = []
          for page in range(1, 101):
              path = f"/{quoted_repo}/-/issues?state=open&page={page}&page_size=100&order_by=created_at"
              page_items = fetch(path)
              if not isinstance(page_items, list):
                  raise RuntimeError("CNB issue list response was not an array")
              issue_summaries.extend(page_items)
              if len(page_items) < 100:
                  break

          issues = []
          for summary in issue_summaries:
              number = summary.get("number") if isinstance(summary, dict) else None
              if number is None:
                  issues.append({"summary": summary, "detail_error": "missing issue number"})
                  continue
              encoded_number = urllib.parse.quote(str(number), safe="")
              detail = try_fetch(f"/{quoted_repo}/-/issues/{encoded_number}")

              comments = []
              comment_errors = []
              for page in range(1, 101):
                  result = try_fetch(
                      f"/{quoted_repo}/-/issues/{encoded_number}/comments"
                      f"?sort=created&page={page}&page_size=100"
                  )
                  if not result.get("ok"):
                      comment_errors.append(result)
                      break
                  page_comments = result.get("data")
                  if not isinstance(page_comments, list):
                      comment_errors.append({"ok": False, "error": "comments response was not an array"})
                      break
                  comments.extend(page_comments)
                  if len(page_comments) < 100:
                      break

              activities = []
              activity_errors = []
              for page in range(1, 101):
                  result = try_fetch(
                      f"/{quoted_repo}/-/issues/{encoded_number}/activities"
                      f"?page={page}&page_size=100"
                  )
                  if not result.get("ok"):
                      activity_errors.append(result)
                      break
                  page_activities = result.get("data")
                  if not isinstance(page_activities, list):
                      activity_errors.append({"ok": False, "error": "activities response was not an array"})
                      break
                  activities.extend(page_activities)
                  if len(page_activities) < 100:
                      break

              issues.append({
                  "summary": summary,
                  "detail": detail,
                  "comments": comments,
                  "comment_errors": comment_errors,
                  "activities": activities,
                  "activity_errors": activity_errors,
              })

          payload = {
              "repository": repo,
              "state": "open",
              "count": len(issue_summaries),
              "issues": issues,
          }
          with open("issues.json", "w", encoding="utf-8") as output:
              json.dump(payload, output, ensure_ascii=False, indent=2)
          PY

          unset CNB_RELAY_TOKEN CNB_TOKEN
          printf '%s' "$RECIPIENT_CERT_B64" | base64 -d > recipient.crt.pem
          openssl cms -encrypt -aes256 -binary \
            -in issues.json \
            -outform DER \
            -out issues.cms \
            recipient.crt.pem
          sha256sum issues.cms > issues.cms.sha256
          rm -f issues.json token.cms token.cms.b64

      - name: Upload encrypted issue bundle
        uses: actions/upload-artifact@v4
        with:
          name: cnb-issues-encrypted
          path: |
            /tmp/cnb-relay/issues.cms
            /tmp/cnb-relay/issues.cms.sha256
          if-no-files-found: error
          retention-days: 1
