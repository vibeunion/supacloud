name: Secure CNB issue relay

on:
  push:
    branches: [agent/secure-cnb-relay-20260819]
    paths: [.github/workflows/secure-cnb-relay.yml]

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_BRANCH: agent/secure-cnb-relay-20260819
      RELAY_RUN: ${{ github.run_id }}
      CNB_ISSUES_URL: https://api.cnb.cool/aizhuliren/xgic/supacloud/-/issues?state=open&page=1&page_size=100
      RECIPIENT_CERT_B64: 
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELAY_BRANCH }}

      - name: Publish one-time runner certificate
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/cnb-relay
          openssl req -x509 -newkey rsa:4096 -sha256 -nodes \
            -keyout /tmp/cnb-relay/runner.key \
            -out /tmp/cnb-relay/runner.crt \
            -days 1 -subj '/CN=SupaCloud CNB relay runner' >/dev/null 2>&1
          chmod 600 /tmp/cnb-relay/runner.key
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.secure-relay/runner-${RELAY_RUN}.crt" \
            -f message="chore(relay): publish runner certificate ${RELAY_RUN}" \
            -f content="$(base64 -w0 /tmp/cnb-relay/runner.crt)" \
            -f branch="$RELAY_BRANCH" >/dev/null

      - name: Receive encrypted token
        shell: bash
        run: |
          set -euo pipefail
          ref=$(jq -rn --arg value "$RELAY_BRANCH" '$value|@uri')
          for _ in $(seq 1 180); do
            if encoded=$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/.secure-relay/token-${RELAY_RUN}.cms.b64?ref=$ref" \
              --jq .content 2>/dev/null); then
              printf '%s' "$encoded" | tr -d '\n' | base64 -d \
                > /tmp/cnb-relay/token.cms.b64
              break
            fi
            sleep 2
          done
          test -s /tmp/cnb-relay/token.cms.b64
          base64 -d /tmp/cnb-relay/token.cms.b64 > /tmp/cnb-relay/token.cms.der
          openssl cms -decrypt -binary -inform DER \
            -in /tmp/cnb-relay/token.cms.der \
            -recip /tmp/cnb-relay/runner.crt \
            -inkey /tmp/cnb-relay/runner.key \
            -out /tmp/cnb-relay/token
          chmod 600 /tmp/cnb-relay/token
          echo "::add-mask::$(cat /tmp/cnb-relay/token)"

      - name: Read open CNB issues
        shell: bash
        run: |
          set -euo pipefail
          token=$(cat /tmp/cnb-relay/token)
          status=$(curl -sS -o /tmp/cnb-relay/issues.json -w '%{http_code}' \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $token" \
            "$CNB_ISSUES_URL")
          if [[ "$status" == 401 || "$status" == 403 ]]; then
            status=$(curl -sS -o /tmp/cnb-relay/issues.json -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H "Authorization: token $token" \
              "$CNB_ISSUES_URL")
          fi
          if [[ "$status" == 401 || "$status" == 403 ]]; then
            status=$(curl -sS -o /tmp/cnb-relay/issues.json -w '%{http_code}' \
              -H 'Accept: application/json' \
              -H "Private-Token: $token" \
              "$CNB_ISSUES_URL")
          fi
          test "$status" = 200
          jq empty /tmp/cnb-relay/issues.json

      - name: Return encrypted issue payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RECIPIENT_CERT_B64" | base64 -d \
            > /tmp/cnb-relay/recipient.crt
          gzip -9 -c /tmp/cnb-relay/issues.json > /tmp/cnb-relay/issues.json.gz
          openssl cms -encrypt -aes256 -binary -outform DER \
            -in /tmp/cnb-relay/issues.json.gz \
            -out /tmp/cnb-relay/issues.cms.der \
            /tmp/cnb-relay/recipient.crt
          base64 -w0 /tmp/cnb-relay/issues.cms.der \
            > /tmp/cnb-relay/issues.cms.b64
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/.secure-relay/issues-${RELAY_RUN}.cms.b64" \
            -f message="chore(relay): publish encrypted CNB issues ${RELAY_RUN}" \
            -f content="$(base64 -w0 /tmp/cnb-relay/issues.cms.b64)" \
            -f branch="$RELAY_BRANCH" >/dev/null

      - name: Destroy plaintext material
        if: always()
        shell: bash
        run: |
          set +e
          find /tmp/cnb-relay -type f -exec shred -u {} +
          rmdir /tmp/cnb-relay 2>/dev/null || true
