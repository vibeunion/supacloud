name: SupaCloud Lite Full Validation

on:
  schedule:
    # Run outside the top-of-hour queue; 02:17 Asia/Shanghai.
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supacloud-lite-full-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'
  BUN_VERSION: '1.4.4'

jobs:
  full-linux:
    name: SupaCloud Lite Full (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Lite Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-lite-full-${{ hashFiles('packages/*/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-lite-full-
            bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-lite-

      - name: Prepare Lite dependencies
        working-directory: packages/supacloud-lite
        run: |
          bun run ../../scripts/build-command-dependencies.ts supacloud-lite
          bun install --frozen-lockfile

      - name: Run the complete Lite suite
        working-directory: packages/supacloud-lite
        run: bun run check

      - name: Audit Lite dependencies
        working-directory: packages/supacloud-lite
        run: bun run ../../scripts/audit_dependencies.ts

  full-windows:
    name: SupaCloud Lite Full (Windows)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Windows Lite Bun package cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-lite-full-${{ hashFiles('packages/*/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-lite-full-
            bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-lite-

      - name: Prepare Windows Lite dependencies
        shell: pwsh
        working-directory: packages/supacloud-lite
        run: |
          bun run ../../scripts/build-command-dependencies.ts supacloud-lite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the complete Lite suite on Windows
        shell: pwsh
        working-directory: packages/supacloud-lite
        run: |
          bun run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit Windows Lite dependencies
        shell: pwsh
        working-directory: packages/supacloud-lite
        run: |
          bun run ../../scripts/audit_dependencies.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
