name: Sync PR 957 with main

on:
  push:
    branches:
      - codex/supauth-cnb-platform-remediation
    paths:
      - .github/workflows/sync-pr-957.yml

permissions:
  contents: write

concurrency:
  group: sync-pr-957-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: codex/supauth-cnb-platform-remediation
          fetch-depth: 0

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:codex/supauth-cnb-platform-remediation
