name: Workspace Tooling

# Reused by Management API CI and included in its Required Checks aggregate.
# Do not add PR path filters or a second pull_request run here.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-tooling-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace Acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      # copyfile: Bun 1.4.4 hardlinks workspace manifests into node_modules, which starter sync rejects.
      - name: Install root tooling lock
        run: bun install --ignore-scripts --frozen-lockfile --backend=copyfile
      - name: Install local delivery dependencies
        run: bun install --ignore-scripts --frozen-lockfile --backend=copyfile --cwd packages/delivery
      - name: Install existing Compiler parser
        run: bun install --ignore-scripts --frozen-lockfile --backend=copyfile --cwd packages/compiler
      - name: Workspace and source-boundary regression tests
        run: |
          bun run test:workspace
          bun test scripts/workspace/sync-public-api.test.ts
      - name: Check generated starter metadata and release synchronization
        run: bun run check:workspace-sync
      - name: Reject new source-boundary and coverage findings
        id: source_inventory
        run: |
          mkdir -p .workspace/evidence
          bun run check:source-regressions > .workspace/evidence/source-boundaries.json
      - name: Validate repository metadata
        run: |
          mkdir -p .workspace/evidence
          node scripts/workspace/cli.mjs check > .workspace/evidence/workspace.json
      - name: Exercise Bun task ordering and failure propagation
        run: bun run test:workspace-acceptance
      - name: Build the app/contracts pilot using the repository task graph
        run: bun run workspace:build --project app
      - name: Check public API generator synchronization without modifying files
        run: |
          bun run workspace:sync --check > .workspace/evidence/sync.json
          git diff --exit-code -- packages/app/public-api.json packages/compiler/public-api.json
      - name: Record unified workspace context
        run: bun run workspace:context > .workspace/evidence/context.json
      - name: Record affected shadow plan without selecting or skipping CI jobs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/workspace/cli.mjs affected --base "$BASE_SHA" > .workspace/evidence/affected.json
          else
            node scripts/workspace/cli.mjs affected > .workspace/evidence/affected.json
          fi
      - name: Record verification versions
        if: always()
        run: |
          mkdir -p .workspace/evidence
          node --version > .workspace/evidence/node-version.txt
          bun --version > .workspace/evidence/bun-version.txt
          git rev-parse HEAD > .workspace/evidence/commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: workspace-tooling-evidence
          path: .workspace/evidence/
          include-hidden-files: true
          retention-days: 7
