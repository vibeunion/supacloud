# SupaCloud Studio Docker Compose
# 使用自编译的云平台模式 Studio

version: "3.8"

services:
  studio:
    image: supacloud-studio:latest
    container_name: supabase-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=::
      - PORT=3000
      # 数据库连接
      - STUDIO_PG_META_URL=http://meta:8080
      - POSTGRES_PASSWORD=your-super-secret-password
      # Supabase 服务
      - SUPABASE_URL=http://kong:8000
      - SUPABASE_PUBLIC_URL=https://studio.esgfarm.cn
      - SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzcyNDUwNTQ2LCJleHAiOjE5MzAxMzA1NDZ9.JVxVRBVFWC2pbXfqDxmA8t34qX0HGUxvAXBqekQ2b8M
      - SUPABASE_SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NzI0NTA1NDYsImV4cCI6MTkzMDEzMDU0Nn0._5AFsCew3j-iETEdg3fb5VZ5xqG2IiQ-UZCroztyaQw
      # 认证
      - AUTH_JWT_SECRET=your-super-secret-jwt-token-with-at-least-32-characters-long
      # 功能开关
      - NEXT_PUBLIC_ENABLE_LOGS=true
      - NEXT_PUBLIC_REALTIME_ENABLED=true
    networks:
      - supabase_default
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/platform/profile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  supabase_default:
    external: true
