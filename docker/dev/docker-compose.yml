services:
  caddy:
    image: caddy:2.11.4
    restart: always
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${CADDY_HTTP_PORT:-8000}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - postgres
      - gotrue
      - postgrest
      - management-api
      - edge-runtime
    networks:
      - supacloud-dev

  postgres:
    build:
      context: ../self-host/postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PG18 uses a new volume name so an existing PG17 dev volume is preserved for explicit dump/restore.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - supacloud-dev
      - pgredis-database

  gotrue:
    image: supabase/gotrue:v2.195.0
    restart: always
    environment:
      GOTRUE_SITE_URL: http://localhost:${CADDY_HTTP_PORT:-8000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      API_EXTERNAL_URL: http://localhost:${CADDY_HTTP_PORT:-8000}/auth/v1
      GOTRUE_OPERATOR_TOKEN: ${MASTER_TOKEN:-${JWT_SECRET}}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "true"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_CUSTOM_OAUTH_ENABLED: "true"
      GOTRUE_CUSTOM_OAUTH_MAX_PROVIDERS: "0"
      GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: http://localhost:${CADDY_HTTP_PORT:-8000}/auth/v1
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_ENCRYPT: "true"
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_ENCRYPTION_KEY_ID: ${GOTRUE_DB_ENCRYPTION_KEY_ID}
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_ENCRYPTION_KEY: ${GOTRUE_DB_ENCRYPTION_KEY}
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_DECRYPTION_KEYS: ${GOTRUE_DB_DECRYPTION_KEYS}
      GOTRUE_PASSKEY_ENABLED: ${PASSKEY_ENABLED:-false}
      GOTRUE_PASSKEY_MAX_PASSKEYS_PER_USER: ${PASSKEY_MAX_PASSKEYS_PER_USER:-10}
      GOTRUE_WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      GOTRUE_WEBAUTHN_RP_DISPLAY_NAME: ${WEBAUTHN_RP_DISPLAY_NAME:-SupaCloud Local}
      GOTRUE_WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-http://localhost:${CADDY_HTTP_PORT:-8000}}
    networks:
      - supacloud-dev

  postgrest:
    image: postgrest/postgrest:v16.1
    restart: always
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks:
      - supacloud-dev

  management-api:
    build:
      context: ../../
      dockerfile: packages/management-api/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      victorialogs:
        condition: service_started
    command: ["sh", "-lc", "bun run src/index.ts --init-db && exec bun run src/index.ts"]
    environment:
      - PORT=9090
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      - SUPACLOUD_POSTGRES_URL=postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/postgres
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_DATABASE=postgres
      - JIT_DATABASE_GATEWAY_BIND_HOST=${JIT_DATABASE_GATEWAY_BIND_HOST:-::}
      - JIT_DATABASE_GATEWAY_PUBLIC_HOST=${JIT_DATABASE_GATEWAY_PUBLIC_HOST:-localhost}
      - JIT_DATABASE_GATEWAY_PORT_RANGE=${JIT_DATABASE_GATEWAY_PORT_RANGE:-6600-6699}
      - SUPACLOUD_POSTGRES_MAJOR_UPGRADE_EXECUTOR=/opt/supacloud/scripts/lib/postgres_major_upgrade_executor.sh
      - SUPACLOUD_POSTGRES_MAJOR_UPGRADE_PROVIDER_EXECUTOR=${SUPACLOUD_POSTGRES_MAJOR_UPGRADE_PROVIDER_EXECUTOR:-}
      - PGPASSWORD=${POSTGRES_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET}
      - MASTER_TOKEN=${MASTER_TOKEN}
      - SECRETS_ENCRYPTION_KEY=${SECRETS_ENCRYPTION_KEY:-${JWT_SECRET}}
      - LEGACY_SECRETS_ENCRYPTION_KEY=${LEGACY_SECRETS_ENCRYPTION_KEY:-}
      - SUPAOAUTH_BFF_SIGNING_SECRET=${SUPAOAUTH_BFF_SIGNING_SECRET:-dev-supaoauth-bff-signing-secret-change-me}
      - CADDY_ADMIN_URL=http://caddy:2019
      - CADDY_CONFIG_PATH=/tmp/supacloud-caddy/config.json
      - CADDY_STATE_DIR=/data
      # The development management-api image does not bundle supacloud-caddy.
      # Caddy validates and applies config through the Admin API in the caddy container.
      - CADDY_BINARY_PATH=/bin/true
      - TENANT_CONFIG_DIR=/etc/supabase/tenants
      - PGREDIS_TENANT_CONFIG_DIR=/etc/supabase/pgredis-tenants
      - PGREDIS_TENANT_CONFIG_OWNER=bun:bun
      - PGREDIS_RUNTIME_INTERNAL_URL=http://pgredis-runtime:9010
      - PGREDIS_RUNTIME_INTERNAL_TOKEN=${PGREDIS_RUNTIME_INTERNAL_TOKEN}
      - PGREDIS_RUNTIME_INTERNAL_TIMEOUT_MS=${PGREDIS_RUNTIME_INTERNAL_TIMEOUT_MS:-5000}
      - SUPACLOUD_LOGS_ENABLED=true
      - SUPACLOUD_LOG_COLLECTOR_JOURNAL_ENABLED=false
      - EDGE_FUNCTIONS_DIR=/opt/supacloud/functions
      - VICTORIALOGS_URL=http://victorialogs:9428
      - SUPACLOUD_PIPELINE_RUNTIME_MODE=unavailable
    ports:
      - "${API_PORT:-9090}:9090"
      - "${JIT_DATABASE_GATEWAY_PORT_RANGE:-6600-6699}:${JIT_DATABASE_GATEWAY_PORT_RANGE:-6600-6699}"
    volumes:
      - tenant-config:/etc/supabase/tenants
      - pgredis-tenant-config:/etc/supabase/pgredis-tenants
      - ../../supabase/functions:/opt/supacloud/functions:ro
      - log-collector-state:/var/lib/supacloud/log-collector
    networks:
      - supacloud-dev
      - edge-pgredis

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: always
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${VICTORIALOGS_RETENTION:-7d}
      - -httpListenAddr=:9428
    volumes:
      - victorialogs-data:/victoria-logs-data
    networks:
      - supacloud-dev

  edge-runtime:
    build:
      context: ../../
      dockerfile: packages/edge-runtime/Dockerfile
    restart: always
    depends_on:
      pgredis-runtime:
        condition: service_healthy
    environment:
      - PORT=9005
      - WORKER_POOL_SIZE=${WORKER_POOL_SIZE:-2}
      - MANAGEMENT_API_URL=http://management-api:9090
      - MASTER_TOKEN=${MASTER_TOKEN}
      - PGREDIS_RUNTIME_INTERNAL_URL=http://pgredis-runtime:9010
      - PGREDIS_RUNTIME_INTERNAL_TOKEN=${PGREDIS_RUNTIME_INTERNAL_TOKEN}
      - PGREDIS_RUNTIME_CAPABILITY_TTL_MS=${PGREDIS_RUNTIME_CAPABILITY_TTL_MS:-600000}
    ports:
      - "${EDGE_RUNTIME_PORT:-9005}:9005"
    volumes:
      # Automatically map user's local functions to the runtime!
      - ../../supabase/functions:/app/supabase/functions
    networks:
      - supacloud-dev
      - edge-pgredis

  pgredis-runtime:
    build:
      context: ../../
      dockerfile: packages/pgredis-runtime/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGREDIS_RUNTIME_HOST=0.0.0.0
      - PGREDIS_RUNTIME_PORT=9010
      - PGREDIS_RUNTIME_INTERNAL_TOKEN=${PGREDIS_RUNTIME_INTERNAL_TOKEN}
      - PGREDIS_RUNTIME_CAPABILITY_MAX_TTL_MS=${PGREDIS_RUNTIME_CAPABILITY_TTL_MS:-600000}
      - PGREDIS_RUNTIME_TENANTS_DIR=/etc/supabase/pgredis-tenants
      - PGREDIS_RUNTIME_CONNECTIONS_PER_TENANT=${PGREDIS_RUNTIME_CONNECTIONS_PER_TENANT:-2}
      - PGREDIS_RUNTIME_L1_MAX_ENTRIES=${PGREDIS_RUNTIME_L1_MAX_ENTRIES:-1000}
      - PGREDIS_RUNTIME_L1_TTL_MS=${PGREDIS_RUNTIME_L1_TTL_MS:-30000}
    volumes:
      - pgredis-tenant-config:/etc/supabase/pgredis-tenants:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9010/health'); if(!r.ok) process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pgredis-database
      - edge-pgredis

volumes:
  pgdata18:
  tenant-config:
  pgredis-tenant-config:
  caddy-data:
  caddy-config:
  victorialogs-data:
  log-collector-state:

networks:
  supacloud-dev:
    driver: bridge
  pgredis-database:
    internal: true
  edge-pgredis:
    internal: true
