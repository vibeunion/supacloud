services:
  postgres:
    build:
      context: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
      ENABLE_FERRETDB: ${ENABLE_FERRETDB:-false}
      FERRETDB_USER: ${FERRETDB_USER:-ferretdb}
      FERRETDB_PASSWORD: ${FERRETDB_PASSWORD:-}
      FERRETDB_DATABASE: ${FERRETDB_DATABASE:-${POSTGRES_DB:-postgres}}
      ENABLE_PGSODIUM: ${ENABLE_PGSODIUM:-false}
      PGSODIUM_KEY: ${PGSODIUM_KEY:-}
      PGSODIUM_KEY_FILE: ${PGSODIUM_KEY_FILE:-/run/secrets/pgsodium_key}
      PGSODIUM_ENABLE_EVENT_TRIGGER: ${PGSODIUM_ENABLE_EVENT_TRIGGER:-off}
      ENABLE_SUPABASE_VAULT: ${ENABLE_SUPABASE_VAULT:-false}
      VAULT_KEY: ${VAULT_KEY:-}
      VAULT_KEY_FILE: ${VAULT_KEY_FILE:-/run/secrets/vault_key}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - pgredis-database

  gotrue:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_SITE_URL: ${STUDIO_URL}
      API_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_OPERATOR_TOKEN: ${MASTER_TOKEN}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_CUSTOM_OAUTH_ENABLED: "true"
      GOTRUE_CUSTOM_OAUTH_MAX_PROVIDERS: "0"
      GOTRUE_CUSTOM_OAUTH_EXTERNAL_URL: ${PUBLIC_URL}/auth/v1
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_ENCRYPT: "true"
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_ENCRYPTION_KEY_ID: ${GOTRUE_DB_ENCRYPTION_KEY_ID}
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_ENCRYPTION_KEY: ${GOTRUE_DB_ENCRYPTION_KEY}
      GOTRUE_SECURITY_DATABASE_ENCRYPTION_DECRYPTION_KEYS: ${GOTRUE_DB_DECRYPTION_KEYS}
      GOTRUE_PASSKEY_ENABLED: ${PASSKEY_ENABLED:-false}
      GOTRUE_PASSKEY_MAX_PASSKEYS_PER_USER: ${PASSKEY_MAX_PASSKEYS_PER_USER:-10}
      GOTRUE_WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      GOTRUE_WEBAUTHN_RP_DISPLAY_NAME: ${WEBAUTHN_RP_DISPLAY_NAME:-SupaCloud}
      GOTRUE_WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:-${STUDIO_URL}}

  postgrest:
    image: postgrest/postgrest:v16.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PROXY_URI: ${PUBLIC_URL}

  ferretdb:
    image: ${FERRETDB_IMAGE:-ghcr.io/ferretdb/ferretdb:2.7.0}
    restart: unless-stopped
    profiles:
      - ferretdb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${FERRETDB_USER:-ferretdb}:${FERRETDB_PASSWORD:-}@postgres:5432/${FERRETDB_DATABASE:-${POSTGRES_DB:-postgres}}
    ports:
      - "${FERRETDB_PORT:-27017}:27017"

  management-api:
    build:
      context: ../..
      dockerfile: docker/self-host/management-api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_healthy
      victorialogs:
        condition: service_started
    environment:
      PORT: 9090
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      SUPACLOUD_POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB:-postgres}
      JIT_DATABASE_GATEWAY_BIND_HOST: ${JIT_DATABASE_GATEWAY_BIND_HOST:-::}
      JIT_DATABASE_GATEWAY_PUBLIC_HOST: ${JIT_DATABASE_GATEWAY_PUBLIC_HOST:-localhost}
      JIT_DATABASE_GATEWAY_PORT_RANGE: ${JIT_DATABASE_GATEWAY_PORT_RANGE:-6600-6699}
      SUPACLOUD_POSTGRES_MAJOR_UPGRADE_EXECUTOR: /opt/supacloud/scripts/lib/postgres_major_upgrade_executor.sh
      SUPACLOUD_POSTGRES_MAJOR_UPGRADE_PROVIDER_EXECUTOR: ${SUPACLOUD_POSTGRES_MAJOR_UPGRADE_PROVIDER_EXECUTOR:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MASTER_TOKEN: ${MASTER_TOKEN}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      SUPAOAUTH_BFF_SIGNING_SECRET: ${SUPAOAUTH_BFF_SIGNING_SECRET}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CADDY_ADMIN_URL: http://caddy:2019
      CADDY_CONFIG_PATH: /etc/supacloud/caddy/config.json
      CADDY_STATE_DIR: /var/lib/supacloud/caddy
      MANAGEMENT_API_INTERNAL: management-api:9090
      EDGE_RUNTIME_MODE: external
      EDGE_RUNTIME_URL: http://edge-runtime:9005
      EDGE_RUNTIME_INTERNAL: edge-runtime:9005
      EDGE_RUNTIME_BACKGROUND_INTERNAL: edge-runtime:9005
      EDGE_RUNTIME_MASTER_KEY: ${MASTER_TOKEN}
      EDGE_FUNCTIONS_DIR: /data/functions
      TENANT_CONFIG_DIR: /etc/supabase/tenants
      PGREDIS_TENANT_CONFIG_DIR: /etc/supabase/pgredis-tenants
      PGREDIS_TENANT_CONFIG_OWNER: bun:bun
      PGREDIS_RUNTIME_INTERNAL_URL: http://pgredis-runtime:9010
      PGREDIS_RUNTIME_INTERNAL_TOKEN: ${PGREDIS_RUNTIME_INTERNAL_TOKEN}
      PGREDIS_RUNTIME_INTERNAL_TIMEOUT_MS: ${PGREDIS_RUNTIME_INTERNAL_TIMEOUT_MS:-5000}
      DASHBOARD_USERNAME: supabase
      DASHBOARD_PASSWORD: supacloud
      SUPACLOUD_LOGS_ENABLED: "true"
      SUPACLOUD_LOG_COLLECTOR_JOURNAL_ENABLED: "false"
      VICTORIALOGS_URL: http://victorialogs:9428
      SUPACLOUD_PIPELINE_RUNTIME_MODE: unavailable
    volumes:
      - tenant-config:/etc/supabase/tenants
      - pgredis-tenant-config:/etc/supabase/pgredis-tenants
      - functions-data:/data/functions
      - frontend-data:/var/supacloud/frontends
      - caddy-managed-config:/etc/supacloud/caddy
      - caddy-managed-state:/var/lib/supacloud/caddy
      - log-collector-state:/var/lib/supacloud/log-collector
      - type: bind
        source: ${LEGACY_SECRETS_MIGRATION_FILE}
        target: /run/secrets/supacloud-legacy-secrets-migration
        bind:
          create_host_path: false
    ports:
      - "${API_PORT:-9090}:9090"
      - "${JIT_DATABASE_GATEWAY_PORT_RANGE:-6600-6699}:${JIT_DATABASE_GATEWAY_PORT_RANGE:-6600-6699}"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9090/health'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - default
      - edge-pgredis

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=${VICTORIALOGS_RETENTION:-7d}
      - -httpListenAddr=:9428
    volumes:
      - victorialogs-data:/victoria-logs-data
    networks:
      - default

  edge-runtime:
    build:
      context: ../..
      dockerfile: docker/self-host/edge-runtime.Dockerfile
    restart: unless-stopped
    depends_on:
      management-api:
        condition: service_healthy
      pgredis-runtime:
        condition: service_healthy
    environment:
      PORT: 9005
      NODE_ENV: production
      MANAGEMENT_API_URL: http://management-api:9090
      MASTER_TOKEN: ${MASTER_TOKEN}
      EDGE_RUNTIME_MASTER_KEY: ${MASTER_TOKEN}
      EDGE_FUNCTIONS_DIR: /data/functions
      TENANTS_DIR: /etc/supabase/tenants
      PGREDIS_RUNTIME_INTERNAL_URL: http://pgredis-runtime:9010
      PGREDIS_RUNTIME_INTERNAL_TOKEN: ${PGREDIS_RUNTIME_INTERNAL_TOKEN}
      PGREDIS_RUNTIME_CAPABILITY_TTL_MS: ${PGREDIS_RUNTIME_CAPABILITY_TTL_MS:-600000}
    volumes:
      - tenant-config:/etc/supabase/tenants
      - functions-data:/data/functions
    ports:
      - "127.0.0.1:${EDGE_RUNTIME_PORT:-9005}:9005"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9005/health'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - default
      - edge-pgredis

  pgredis-runtime:
    build:
      context: ../..
      dockerfile: docker/self-host/pgredis-runtime.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PGREDIS_RUNTIME_HOST: 0.0.0.0
      PGREDIS_RUNTIME_PORT: 9010
      PGREDIS_RUNTIME_INTERNAL_TOKEN: ${PGREDIS_RUNTIME_INTERNAL_TOKEN}
      PGREDIS_RUNTIME_CAPABILITY_MAX_TTL_MS: ${PGREDIS_RUNTIME_CAPABILITY_TTL_MS:-600000}
      PGREDIS_RUNTIME_TENANTS_DIR: /etc/supabase/pgredis-tenants
      PGREDIS_RUNTIME_CONNECTIONS_PER_TENANT: ${PGREDIS_RUNTIME_CONNECTIONS_PER_TENANT:-2}
      PGREDIS_RUNTIME_L1_MAX_ENTRIES: ${PGREDIS_RUNTIME_L1_MAX_ENTRIES:-1000}
      PGREDIS_RUNTIME_L1_TTL_MS: ${PGREDIS_RUNTIME_L1_TTL_MS:-30000}
    volumes:
      - pgredis-tenant-config:/etc/supabase/pgredis-tenants:ro
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9010/health'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - pgredis-database
      - edge-pgredis

  caddy:
    build:
      context: ./caddy
    image: supacloud-caddy:2.11.4-ratelimit
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/supacloud-caddy-entrypoint"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - frontend-data:/var/supacloud/frontends:ro
      - caddy-managed-config:/etc/supacloud/caddy:ro
      - caddy-managed-state:/var/lib/supacloud/caddy
    ports:
      - "${CADDY_HTTP_PORT:-8000}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  tenant-config:
  pgredis-tenant-config:
  functions-data:
  frontend-data:
  caddy-managed-config:
  caddy-managed-state:
  caddy-data:
  caddy-config:
  victorialogs-data:
  log-collector-state:

networks:
  pgredis-database:
    internal: true
  edge-pgredis:
    internal: true
