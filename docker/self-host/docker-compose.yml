services:
  postgres:
    build:
      context: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
      ENABLE_FERRETDB: ${ENABLE_FERRETDB:-false}
      FERRETDB_USER: ${FERRETDB_USER:-ferretdb}
      FERRETDB_PASSWORD: ${FERRETDB_PASSWORD:-}
      FERRETDB_DATABASE: ${FERRETDB_DATABASE:-${POSTGRES_DB:-postgres}}
      ENABLE_PGSODIUM: ${ENABLE_PGSODIUM:-false}
      PGSODIUM_KEY: ${PGSODIUM_KEY:-}
      PGSODIUM_KEY_FILE: ${PGSODIUM_KEY_FILE:-/run/secrets/pgsodium_key}
      PGSODIUM_ENABLE_EVENT_TRIGGER: ${PGSODIUM_ENABLE_EVENT_TRIGGER:-off}
      ENABLE_SUPABASE_VAULT: ${ENABLE_SUPABASE_VAULT:-false}
      VAULT_KEY: ${VAULT_KEY:-}
      VAULT_KEY_FILE: ${VAULT_KEY_FILE:-/run/secrets/vault_key}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  gotrue:
    image: supabase/gotrue:v2.105.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_SITE_URL: ${STUDIO_URL}
      API_EXTERNAL_URL: ${PUBLIC_URL}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_OPERATOR_TOKEN: ${MASTER_TOKEN}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"

  postgrest:
    image: postgrest/postgrest:v11.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public,pgmq_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PROXY_URI: ${PUBLIC_URL}

  ferretdb:
    image: ${FERRETDB_IMAGE:-ghcr.io/ferretdb/ferretdb:2.7.0}
    restart: unless-stopped
    profiles:
      - ferretdb
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://${FERRETDB_USER:-ferretdb}:${FERRETDB_PASSWORD:-}@postgres:5432/${FERRETDB_DATABASE:-${POSTGRES_DB:-postgres}}
    ports:
      - "${FERRETDB_PORT:-27017}:27017"

  management-api:
    build:
      context: ../..
      dockerfile: docker/self-host/management-api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 9090
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      SUPACLOUD_POSTGRES_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MASTER_TOKEN: ${MASTER_TOKEN}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      CADDY_ADMIN_URL: http://caddy:2019
      MANAGEMENT_API_INTERNAL: management-api:9090
      EDGE_RUNTIME_MODE: external
      EDGE_RUNTIME_URL: http://edge-runtime:9000
      EDGE_RUNTIME_INTERNAL: edge-runtime:9000
      EDGE_RUNTIME_BACKGROUND_INTERNAL: edge-runtime:9000
      EDGE_RUNTIME_MASTER_KEY: ${MASTER_TOKEN}
      EDGE_FUNCTIONS_DIR: /data/functions
      TENANT_CONFIG_DIR: /etc/supabase/tenants
      DASHBOARD_USERNAME: supabase
      DASHBOARD_PASSWORD: supacloud
    volumes:
      - tenant-config:/etc/supabase/tenants
      - functions-data:/data/functions
    ports:
      - "${API_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9090/health'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  edge-runtime:
    build:
      context: ../..
      dockerfile: docker/self-host/edge-runtime.Dockerfile
    restart: unless-stopped
    depends_on:
      management-api:
        condition: service_healthy
    environment:
      PORT: 9000
      NODE_ENV: production
      MANAGEMENT_API_URL: http://management-api:9090
      MASTER_TOKEN: ${MASTER_TOKEN}
      EDGE_RUNTIME_MASTER_KEY: ${MASTER_TOKEN}
      EDGE_FUNCTIONS_DIR: /data/functions
      TENANTS_DIR: /etc/supabase/tenants
    volumes:
      - tenant-config:/etc/supabase/tenants
      - functions-data:/data/functions
    ports:
      - "127.0.0.1:${EDGE_RUNTIME_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:9000/health'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on:
      management-api:
        condition: service_healthy
      edge-runtime:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${CADDY_HTTP_PORT:-8000}:8000"

volumes:
  postgres-data:
  tenant-config:
  functions-data:
  caddy-data:
  caddy-config:
