<title id="title">De las declaraciones de la aplicación a la ejecución</title><desc id="description">Las declaraciones de la aplicación pasan por el compilador y producen artefactos generados. En ejecución, el host Elysia consume los módulos compilados e invoca servicios propiedad de la aplicación. El host sigue instalando Elysia; los módulos de negocio no necesitan importar tipos nativos de Elysia.</desc>
