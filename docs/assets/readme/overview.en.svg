<title id="title">Self-hosted multi-project platform</title><desc id="description">The full platform is the primary product for operating isolated projects on your infrastructure. Application engineering is optional; Lite is a bounded single-project runtime. These are not interchangeable editions.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526579"/></marker></defs>
