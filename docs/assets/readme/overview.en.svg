<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="40" class="lane">SUPACLOUD</text>
<text x="48" y="86" class="title">Self-hosted multi-project platform</text>
<text x="48" y="124" class="subtitle">Operate projects first. Add application tooling when useful.</text>
<rect x="48" y="160" width="1104" height="184" rx="16" fill="#EDF8F5" stroke="#D5E0E9"/>
<text x="72" y="200" class="heading">SupaCloud platform</text>
<text x="72" y="238" class="body">Pigsty / multiple isolated projects</text>
<text x="72" y="268" class="body">Management API, Web Console, Admin CLI</text>
<text x="72" y="298" class="body">Gateway, delivery, observability and recovery</text>
<text x="72" y="328" class="body">Primary self-hosted product</text>
<text x="48" y="392" class="lane">PRODUCT LAYERS / DIFFERENT OPERATIONAL BOUNDARIES</text>
<rect x="48" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="72" y="460" class="heading">Application engineering</text>
<text x="72" y="498" class="body">@supacloud/app  +  @supacloud/compiler  +  @supacloud/elysia</text>
<text x="72" y="528" class="body">Business modules, static wiring, schemas and generated clients</text>
<text x="72" y="558" class="body">Optional development layer</text>
<text x="72" y="588" class="body">Not required for platform use</text>
<rect x="616" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="640" y="460" class="heading">SupaCloud Lite</text>
<text x="640" y="498" class="body">Bun + PGlite / one project per process</text>
<text x="640" y="528" class="body">REST, Auth, Storage, Realtime, Functions</text>
<text x="640" y="558" class="body">Local development and small deployments</text>
<text x="640" y="588" class="body">No multi-project control plane or Studio</text>
<text x="48" y="690" class="body">The application layer is optional; Lite is single-project; neither implies full-platform production acceptance.</text>
</svg>
