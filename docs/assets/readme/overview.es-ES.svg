<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="40" class="lane">SUPACLOUD</text>
<text x="48" y="86" class="title">Ingeniería de aplicaciones. Operaciones autoalojadas.</text>
<text x="48" y="124" class="subtitle">Desarrolla con contratos explícitos. Elige el alojamiento según la carga.</text>
<rect x="48" y="160" width="1104" height="184" rx="16" fill="#EDF8F5" stroke="#D5E0E9"/>
<text x="72" y="200" class="heading">Ingeniería de aplicaciones</text>
<text x="72" y="238" class="body">@supacloud/app  +  @supacloud/compiler  +  @supacloud/elysia</text>
<text x="72" y="268" class="body">Módulos de negocio, cableado estático, esquemas y clientes generados</text>
<text x="72" y="298" class="body">Las políticas de negocio y la autorización a nivel de objeto siguen siendo responsabilidad de la aplicación</text>
<text x="48" y="392" class="lane">OPCIONES DE ALOJAMIENTO / LÍMITES OPERATIVOS DIFERENTES</text>
<rect x="48" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="72" y="460" class="heading">SupaCloud Lite</text>
<text x="72" y="498" class="body">Bun + PGlite / un proyecto por proceso</text>
<text x="72" y="528" class="body">REST, Auth, Storage, Realtime, Functions</text>
<text x="72" y="558" class="body">Desarrollo local y despliegues pequeños</text>
<text x="72" y="588" class="body">Sin plano de control multi-proyecto ni Studio</text>
<rect x="616" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="640" y="460" class="heading">Plataforma SupaCloud</text>
<text x="640" y="498" class="body">Pigsty / varios proyectos aislados</text>
<text x="640" y="528" class="body">Management API, Web Console, Admin CLI</text>
<text x="640" y="558" class="body">Gateway, entrega y observabilidad</text>
<text x="640" y="588" class="body">Infraestructura compartida, responsabilidad del operador</text>
<text x="48" y="690" class="body">La capa de desarrollo no es una edición de alojamiento; este resumen no implica paridad de despliegue.</text>
