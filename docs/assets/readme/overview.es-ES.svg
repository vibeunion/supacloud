<title id="title">Ingeniería de aplicaciones. Operaciones autoalojadas.</title><desc id="description">La capa de desarrollo define y compila módulos de negocio. Lite es un runtime Bun y PGlite de un solo proyecto; la plataforma completa administra varios proyectos en Pigsty. No son tres ediciones intercambiables.</desc>
