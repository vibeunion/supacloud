<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">自托管多项目应用平台</title><desc id="description">完整平台是在自有基础设施上运行隔离项目的主产品。应用工程可选，Lite 是有边界的单项目运行时。它们不是可以互换的版本。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526579"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#162B40}.title{font-size:34px;font-weight:700}.subtitle{font-size:21px;fill:#526579}.heading{font-size:23px;font-weight:700}.body{font-size:20px;fill:#334C63}.lane{font-size:16px;font-weight:700;fill:#37675F;letter-spacing:1px}</style>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="40" class="lane">SUPACLOUD</text>
<text x="48" y="86" class="title">自托管多项目应用平台</text>
<text x="48" y="124" class="subtitle">先可靠地运行项目，再按需增加开发工具。</text>
<rect x="48" y="160" width="1104" height="184" rx="16" fill="#EDF8F5" stroke="#D5E0E9"/>
<text x="72" y="200" class="heading">SupaCloud 完整平台</text>
<text x="72" y="238" class="body">Pigsty / 多个隔离项目</text>
<text x="72" y="268" class="body">Management API、Web Console、Admin CLI</text>
<text x="72" y="298" class="body">网关、交付、可观测性和恢复</text>
<text x="72" y="328" class="body">自托管主产品</text>
<text x="48" y="392" class="lane">产品层级 / 各自具有不同的运维边界</text>
<rect x="48" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="72" y="460" class="heading">应用工程层</text>
<text x="72" y="498" class="body">@supacloud/app  +  @supacloud/compiler  +  @supacloud/elysia</text>
<text x="72" y="528" class="body">业务模块、静态装配、Schema 与生成的客户端</text>
<text x="72" y="558" class="body">可选开发层</text>
<text x="72" y="588" class="body">平台使用不要求采用</text>
<rect x="616" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="640" y="460" class="heading">SupaCloud Lite</text>
<text x="640" y="498" class="body">Bun + PGlite / 每个进程一个项目</text>
<text x="640" y="528" class="body">REST、Auth、Storage、Realtime、Functions</text>
<text x="640" y="558" class="body">本地开发与小型部署</text>
<text x="640" y="588" class="body">不提供多项目控制面或 Studio</text>
<text x="48" y="690" class="body">应用工程层可选；Lite 只支持单项目；二者都不等于完整平台生产验收。</text>
</svg>
