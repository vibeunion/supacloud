<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">应用工程底座，自托管运行平台</title><desc id="description">开发层负责业务模块的声明与编译。Lite 是基于 Bun 和 PGlite 的单项目运行时；完整平台在 Pigsty 上管理多个项目。它们不是三个可以直接互换的版本。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#526579"/></marker></defs>
<style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#162B40}.title{font-size:34px;font-weight:700}.subtitle{font-size:21px;fill:#526579}.heading{font-size:23px;font-weight:700}.body{font-size:20px;fill:#334C63}.lane{font-size:16px;font-weight:700;fill:#37675F;letter-spacing:1px}</style>
<rect width="1200" height="720" fill="#FFFFFF"/>
<text x="48" y="40" class="lane">SUPACLOUD</text>
<text x="48" y="86" class="title">应用工程底座，自托管运行平台</text>
<text x="48" y="124" class="subtitle">以明确契约组织开发，按工作负载选择运行形态。</text>
<rect x="48" y="160" width="1104" height="184" rx="16" fill="#EDF8F5" stroke="#D5E0E9"/>
<text x="72" y="200" class="heading">应用工程层</text>
<text x="72" y="238" class="body">@supacloud/app  +  @supacloud/compiler  +  @supacloud/elysia</text>
<text x="72" y="268" class="body">业务模块、静态装配、Schema 与生成的客户端</text>
<text x="72" y="298" class="body">业务规则与对象级授权仍由应用负责</text>
<text x="48" y="392" class="lane">运行形态 / 各自具有不同的运维边界</text>
<rect x="48" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="72" y="460" class="heading">SupaCloud Lite</text>
<text x="72" y="498" class="body">Bun + PGlite / 每个进程一个项目</text>
<text x="72" y="528" class="body">REST、Auth、Storage、Realtime、Functions</text>
<text x="72" y="558" class="body">本地开发与小型部署</text>
<text x="72" y="588" class="body">不提供多项目控制面或 Studio</text>
<rect x="616" y="420" width="536" height="224" rx="16" fill="#F5F8FB" stroke="#D5E0E9"/>
<text x="640" y="460" class="heading">SupaCloud 完整平台</text>
<text x="640" y="498" class="body">Pigsty / 多个隔离项目</text>
<text x="640" y="528" class="body">Management API、Web Console、Admin CLI</text>
<text x="640" y="558" class="body">网关、交付与可观测性</text>
<text x="640" y="588" class="body">共享基础设施，由平台运维者管理</text>
<text x="48" y="690" class="body">开发层不是一种托管版本；本图不表示不同运行形态已具备相同的部署能力。</text>
</svg>
