<title id="title">One storage backend per project</title><desc id="description">Storage API authorization precedes routing by trusted projectRef. Unbound projects retain platform storage; projects A and B use independent S3 endpoint, credential, physical bucket and prefix bindings. Failed bindings never fall back to other storage.</desc>
