<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description" xml:lang="es-ES">
<title id="title">Un backend de almacenamiento por proyecto</title><desc id="description">La autorización de Storage API precede al enrutamiento mediante un projectRef confiable. Los proyectos sin binding conservan el almacenamiento de la plataforma; los proyectos A y B usan bindings S3 independientes con endpoint, credenciales, bucket físico y prefijo propios. Los bindings fallidos nunca recurren a otro almacenamiento.</desc>
