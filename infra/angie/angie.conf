user angie;
worker_processes auto;
error_log /var/log/angie/error.log warn;
pid       /run/angie.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    resolver 10.6.0.7; 

    # ── ACME 配置 (ECC 证书) ───────────────────────────────────────────────────
    acme_client le https://acme-v02.api.letsencrypt.org/directory 
                  email=admin@YOUR_STUDIO_DOMAIN
                  key_type=ecdsa
                  key_length=256;

    # ── SSL 全局优化 (ECC 优先) ───────────────────────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # ECC 证书优化
    ssl_ecdh_curve      X25519:P-256:P-384;
    ssl_conf_command    Options ServerPreference;
    ssl_conf_command    Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # ── HTTP Server (80)：ACME 验证 + 跳转 ─────────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        # Angie 会自动处理 /.well-known/acme-challenge/ 如果在 http 或 server 级启用了 acme? 
        # 我们暂时不手动写 acme 指令在 80，看它是否能通过跳转或自动拦截工作。
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Studio Server (YOUR_STUDIO_DOMAIN) ─────────────────────────────────────────
    server {
        listen 80;
        listen 443 ssl;
        server_name YOUR_STUDIO_DOMAIN;

        acme le;
        ssl_certificate     $acme_cert_le;
        ssl_certificate_key $acme_cert_key_le;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── API Server (YOUR_API_DOMAIN) ─────────────────────────────────────────────
    server {
        listen 80;
        listen 443 ssl;
        server_name YOUR_API_DOMAIN;

        acme le;
        ssl_certificate     $acme_cert_le;
        ssl_certificate_key $acme_cert_key_le;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── 多租户路由（SupaCloud Tenants）────────────────────────────────────────
    include /etc/angie/http.d/*.conf;
}
