# Angie (Nginx Fork) Configuration for SupaCloud
# 采用原生 http_acme 模块实现 SSL 自动申请

user angie;
worker_processes auto;
error_log /var/log/angie/error.log warn;
pid       /run/angie.pid;

# 加载 ACME 模块
load_module modules/ngx_http_acme_module.so;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # ── ACME 配置 ────────────────────────────────────────────────────────────
    # 定义 ACME 客户端（Let's Encrypt）
    acme_client le {
        server https://acme-v02.api.letsencrypt.org/directory;
        contact mailto:admin@YOUR_STUDIO_DOMAIN;
    }

    # 共享内存用于存储证书状态
    acme_shm_size 2m;

    # ── SSL 全局优化 ─────────────────────────────────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # ── 默认 HTTP Server (80)：ACME 验证 + 跳转 ─────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # 原生 ACME 挑战响应
        location /.well-known/acme-challenge/ {
            acme le;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server (443) ───────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name YOUR_STUDIO_DOMAIN YOUR_API_DOMAIN;

        # 核心：使用 Angie 的 acme 指令自动管理证书
        acme le;

        # 注意：Angie 的 acme 模式下，ssl_certificate 指令由模块自动处理
        # 即使没有提供传统的证书文件，angie 也能在握手时动态生成/获取证书

        # ── 反向代理配置 ─────────────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 路由到 SupaCloud 控制台
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 路由到 Grafana
        location /grafana/ {
            proxy_pass http://127.0.0.1:3000/;
        }
    }

    # ── 多租户路由（SupaCloud Tenants）────────────────────────────────────────
    include /etc/angie/http.d/*.conf;
}
