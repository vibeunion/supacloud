user angie;
worker_processes auto;
error_log /var/log/angie/error.log warn;
pid       /run/angie.pid;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    resolver 10.6.0.7; 

    # ── Gzip Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml image/svg+xml font/woff2;

    # ── ACME (ECC Certificate) ──────────────────────────────────────────
    acme_client le https://acme-v02.api.letsencrypt.org/directory 
                  email=admin@YOUR_STUDIO_DOMAIN
                  key_type=ecdsa;

    # ── SSL Global Optimization (ECC first) ─────────────────────────────
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve      X25519:P-256:P-384;
    ssl_conf_command    Options ServerPreference;
    ssl_conf_command    Ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

    # ── Security Headers ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── HTTP (80): ACME validation + redirect ───────────────────────────
    server {
        listen 80 default_server;
        server_name _;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Studio Server (YOUR_STUDIO_DOMAIN) ──────────────────────────────
    # Single binary: management-api serves both API and SPA static assets
    server {
        listen 80;
        listen 443 ssl;
        server_name YOUR_STUDIO_DOMAIN;

        acme le;
        ssl_certificate     $acme_cert_le;
        ssl_certificate_key $acme_cert_key_le;

        # Static asset caching (built SPA files)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # All other requests → supacloud binary
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── API Server (YOUR_API_DOMAIN) — optional separate domain ─────────
    server {
        listen 80;
        listen 443 ssl;
        server_name YOUR_API_DOMAIN;

        acme le;
        ssl_certificate     $acme_cert_le;
        ssl_certificate_key $acme_cert_key_le;

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ── Tenant Routes (SupaCloud multi-tenant hosting) ──────────────────
    include /etc/angie/http.d/*.conf;
}
