# SupaCloud - OpenResty + lua-resty-auto-ssl + PostgreSQL 配置模板
# 
# 安装后位于: /usr/local/openresty/nginx/conf/nginx.conf
# 占位符一览（setup.sh 会自动替换）:
#   YOUR_STUDIO_DOMAIN       → Supabase Studio 域名（如 studio.example.com）
#   YOUR_API_DOMAIN          → API 场 E域名（如 api.example.com）
#   CHANGE_ME_STRONG_PASSWORD → autossl DB 用户密码（setup.sh 自动替换）

worker_processes auto;
error_log /usr/local/openresty/logs/error.log warn;
pid       /usr/local/openresty/logs/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── lua-resty-auto-ssl 共享内存 ─────────────────────────────────────────
    # 1MB ≈ 100 个域名证书；5MB 应对多租户场景
    lua_shared_dict auto_ssl          5m;
    lua_shared_dict auto_ssl_settings 64k;

    # DNS resolver（Let's Encrypt OCSP stapling + lua DNS 解析必需）
    resolver 8.8.8.8 8.8.4.4 valid=300s ipv6=off;
    resolver_timeout 10s;

    # SSL 全局优化
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── lua-resty-auto-ssl 初始化 ────────────────────────────────────────────
    init_by_lua_block {
        auto_ssl = (require "resty.auto-ssl").new()

        -- 使用 PostgreSQL 存储适配器（替代默认 file 或 redis）
        auto_ssl:set("storage_adapter", "resty.auto-ssl.storage_adapters.postgres")

        -- PostgreSQL 连接配置（对应 Pigsty 本地实例）
        auto_ssl:set("postgres", {
            host      = "127.0.0.1",
            port      = 5432,
            database  = "postgres",
            user      = "autossl",
            password  = "CHANGE_ME_STRONG_PASSWORD",
            schema    = "autossl",
            ["table"] = "certificates",
            pool_size = 5,
        })

        -- 域名白名单（setup.sh 自动替换占位符）
        auto_ssl:set("allow_domain", function(domain)
            local allowed = {
                ["YOUR_STUDIO_DOMAIN"] = true,
                ["YOUR_API_DOMAIN"]    = true,
            }
            return allowed[domain] == true
        end)

        -- 证书到期前 30 天触发续期；每 24 小时扫描一次
        auto_ssl:set("renew_check_interval", 86400)

        auto_ssl:init()
    }

    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }

    # ── HTTP 80：ACME challenge + 强制跳转 HTTPS ────────────────────────────
    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt HTTP-01 验证端点（必须保留，不可重定向）
        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                auto_ssl:challenge_server()
            }
        }

        # 其余请求永久重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 443：动态 TLS + 反向代理 ──────────────────────────────────────
    server {
        listen 443 ssl default_server;
        server_name _;

        # 动态 SSL：auto-ssl 在握手时按域名自动申请/使用 Let's Encrypt 证书
        ssl_certificate_by_lua_block {
            auto_ssl:ssl_certificate()
        }

        # 静态 fallback 证书（nginx 启动时必须存在，实际 TLS 握手由 lua 接管）
        ssl_certificate     /etc/ssl/resty-auto-ssl-fallback.crt;
        ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;

        # 请求结束后归还 PG 连接到连接池
        log_by_lua_block {
            if auto_ssl and auto_ssl.storage and auto_ssl.storage.adapter then
                local ok, err = pcall(function()
                    auto_ssl.storage.adapter:release_connection()
                end)
                if not ok then
                    ngx.log(ngx.ERR, "auto-ssl: release_connection error: ", err)
                end
            end
        }

        # ── 通用代理头 ────────────────────────────────────────────────────
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── 根据 Pigsty infra_portal 迁移代理规则 ────────────────────────
        # 示例：Grafana（默认端口 3000）
        # 如有子域名区分，可拆分到独立的 server 块
        location /grafana/ {
            proxy_pass http://127.0.0.1:3000/;
        }

        # 示例：Prometheus（默认端口 9090）
        # location /prometheus/ {
        #     proxy_pass http://127.0.0.1:9090/;
        # }

        # 示例：Alertmanager（默认端口 9093）
        # location /alertmanager/ {
        #     proxy_pass http://127.0.0.1:9093/;
        # }

        # 默认：代理到 SupaCloud Web Console（如果有）
        location / {
            proxy_pass http://127.0.0.1:3000;

            # WebSocket 支持（Grafana / Supabase Realtime）
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }
    }

    # ── 内部 Hook Server（lua-resty-auto-ssl 内部 ACME 回调，不对外暴露）────
    server {
        listen 127.0.0.1:8999;

        # 增大 body buffer，确保 ACME 回调内容能完整读入内存
        client_body_buffer_size 128k;
        client_max_body_size    128k;

        location / {
            content_by_lua_block {
                auto_ssl:hook_server()
            }
        }
    }
}
