rule_files:
  - supacloud-slo.rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: supacloud_management_http_requests_total
        values: 0+100x20
      - series: supacloud_management_http_errors_total
        values: 0+10x20
      - series: supacloud_management_http_request_duration_ms_bucket{le="500"}
        values: 0+0x20
      - series: supacloud_management_http_request_duration_ms_bucket{le="1000"}
        values: 0+100x20
      - series: supacloud_management_http_request_duration_ms_bucket{le="+Inf"}
        values: 0+100x20
      - series: supacloud_background_attempts_total
        values: 0+100x20
      - series: supacloud_background_failures_total
        values: 0+10x20
      - series: supacloud_background_queue_wait_seconds_bucket{le="300"}
        values: 0+0x20
      - series: supacloud_background_queue_wait_seconds_bucket{le="600"}
        values: 0+100x20
      - series: supacloud_background_queue_wait_seconds_bucket{le="+Inf"}
        values: 0+100x20
      - series: supacloud_backup_inventory_available
        values: 1x20
      - series: supacloud_backup_latest_success_age_seconds
        values: 60x20
      - series: supacloud_restore_drill_last_status{status="succeeded"}
        values: 1x20
      - series: supacloud_restore_drill_last_completed_timestamp_seconds
        values: 1000000x20
      - series: supacloud_log_ingestion_delay_seconds
        values: 30x20
    alert_rule_test:
      - eval_time: 15m
        alertname: SupaCloudManagementErrorBudget
        exp_alerts:
          - exp_labels: {severity: warning, service: management-api}
            exp_annotations:
              summary: Management API error ratio exceeds one percent
              runbook: docs/request-task-tracing.md#management-errors
      - eval_time: 15m
        alertname: SupaCloudManagementLatency
        exp_alerts:
          - exp_labels: {severity: warning, service: management-api}
            exp_annotations:
              summary: Management API p95 exceeds 500 milliseconds
              runbook: docs/request-task-tracing.md#management-latency
      - eval_time: 15m
        alertname: SupaCloudBackgroundFailures
        exp_alerts:
          - exp_labels: {severity: warning, service: background-worker}
            exp_annotations:
              summary: Background function attempt failure ratio exceeds two percent
              runbook: docs/request-task-tracing.md#background-failures
      - eval_time: 15m
        alertname: SupaCloudBackgroundQueueDelay
        exp_alerts:
          - exp_labels: {severity: warning, service: background-worker}
            exp_annotations:
              summary: Dispatched background task p95 age exceeds five minutes
              runbook: docs/request-task-tracing.md#queue-delay
      - {eval_time: 15m, alertname: SupaCloudBackupFreshness, exp_alerts: []}
      - {eval_time: 15m, alertname: SupaCloudRestoreDrillFailure, exp_alerts: []}
      - {eval_time: 15m, alertname: SupaCloudLogIngestionDelay, exp_alerts: []}
  - interval: 1m
    input_series:
      - series: supacloud_management_http_requests_total
        values: 0+100x20
      - series: supacloud_management_http_errors_total
        values: 0+0x20
      - series: supacloud_management_http_request_duration_ms_bucket{le="100"}
        values: 0+100x20
      - series: supacloud_management_http_request_duration_ms_bucket{le="+Inf"}
        values: 0+100x20
      - series: supacloud_background_attempts_total
        values: 0+100x20
      - series: supacloud_background_failures_total
        values: 0+0x20
      - series: supacloud_background_queue_wait_seconds_bucket{le="10"}
        values: 0+100x20
      - series: supacloud_background_queue_wait_seconds_bucket{le="+Inf"}
        values: 0+100x20
      - series: supacloud_backup_inventory_available
        values: 1x20
      - series: supacloud_backup_latest_success_age_seconds
        values: 4000x20
      - series: supacloud_restore_drill_last_status{status="failed"}
        values: 1x20
      - series: supacloud_restore_drill_last_completed_timestamp_seconds
        values: 0x20
      - series: supacloud_log_ingestion_delay_seconds
        values: 400x20
    alert_rule_test:
      - {eval_time: 15m, alertname: SupaCloudManagementErrorBudget, exp_alerts: []}
      - {eval_time: 15m, alertname: SupaCloudManagementLatency, exp_alerts: []}
      - {eval_time: 15m, alertname: SupaCloudBackgroundFailures, exp_alerts: []}
      - {eval_time: 15m, alertname: SupaCloudBackgroundQueueDelay, exp_alerts: []}
      - eval_time: 15m
        alertname: SupaCloudBackupFreshness
        exp_alerts:
          - exp_labels: {severity: critical, service: backup}
            exp_annotations:
              summary: Backup inventory is unavailable or the latest backup is older than one hour
              runbook: docs/request-task-tracing.md#backup-freshness
      - eval_time: 15m
        alertname: SupaCloudRestoreDrillFailure
        exp_alerts:
          - exp_labels: {severity: critical, service: recovery, status: failed}
            exp_annotations:
              summary: The latest restore drill failed or no successful drill ran in seven days
              runbook: docs/request-task-tracing.md#restore-failure
      - eval_time: 15m
        alertname: SupaCloudLogIngestionDelay
        exp_alerts:
          - exp_labels: {severity: warning, service: observability}
            exp_annotations:
              summary: Log ingestion delay exceeds five minutes
              runbook: docs/request-task-tracing.md#log-ingestion-delay
