
user nobody;
worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    # --- Auto-SSL 配置开始 ---
    # 设置解析器，Let's Encrypt 验证需要 DNS 解析
    resolver 8.8.8.8;

    # 初始化 Auto-SSL
    lua_shared_dict auto_ssl 1m;
    lua_shared_dict auto_ssl_settings 64k;
    init_by_lua_block {
        auto_ssl = (require "resty.auto-ssl").new()
        
        -- 定义允许自动申请证书的域名规则
        auto_ssl:set("allow_domain", function(domain)
            return true -- 注意：在生产环境中最好限制域名，避免被恶意刷证书
            -- return ngx.re.match(domain, "^(supa|sapi)\\.seagoo\\.top$", "jo")
        end)
        
        auto_ssl:init()
    }
    
    init_worker_by_lua_block {
        auto_ssl:init_worker()
    }
    # --- Auto-SSL 配置结束 ---

    upstream studio_backend {
        server 127.0.0.1:3003;
    }
    
    upstream kong_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name supa.seagoo.top sapi.seagoo.top;
        
        # --- Auto-SSL ACME 验证 ---
        location /.well-known/acme-challenge/ {
            content_by_lua_block {
                auto_ssl:challenge_server()
            }
        }
        
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Studio HTTPS
    server {
        listen 443 ssl;
        server_name supa.seagoo.top;
        
        # --- Auto-SSL 动态证书 ---
        ssl_certificate_by_lua_block {
            auto_ssl:ssl_certificate()
        }
        
        # 静态回退证书 (必须指定，否则 Nginx 不懂 ssl)
        # 我们使用之前生成的 fallback 证书，或者已有的证书都可以
        ssl_certificate /etc/resty-auto-ssl/resty-auto-ssl-fallback.crt;
        ssl_certificate_key /etc/resty-auto-ssl/resty-auto-ssl-fallback.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 100m;
        
        location / {
            proxy_pass http://studio_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
    
    # API HTTPS
    server {
        listen 443 ssl;
        server_name sapi.seagoo.top;
        
        # --- Auto-SSL 动态证书 ---
        ssl_certificate_by_lua_block {
            auto_ssl:ssl_certificate()
        }
        
        # 静态回退证书
        ssl_certificate /etc/resty-auto-ssl/resty-auto-ssl-fallback.crt;
        ssl_certificate_key /etc/resty-auto-ssl/resty-auto-ssl-fallback.key;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 100m;
        
        location / {
            proxy_pass http://kong_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
